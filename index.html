<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>民法自修講義</title>
<link rel="stylesheet" href="vendor/github-markdown.css">
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --accent: #0969da; --card: #f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --accent: #4493f8; --card: #151b23; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 10; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
           padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  header a.home { font-weight: 600; color: var(--fg); text-decoration: none; margin-right: auto; }
  header nav a { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px;
                 color: var(--fg); text-decoration: none; font-size: 14px; }
  header nav a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
  .markdown-body { background: transparent; font-size: 16px; }
  .markdown-body img { max-width: min(100%, 680px); border-radius: 8px; border: 1px solid var(--line); }
  .markdown-body details { margin: 8px 0 16px; padding: 8px 14px; background: var(--card);
                           border: 1px solid var(--line); border-radius: 8px; }
  .markdown-body summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  .markdown-body details[open] summary { margin-bottom: 8px; }
  .cards { display: grid; gap: 12px; margin-top: 16px; }
  .cards a { display: block; padding: 18px; border: 1px solid var(--line); border-radius: 12px;
             background: var(--card); color: var(--fg); text-decoration: none; }
  .cards a:hover { border-color: var(--accent); }
  .cards b { display: block; font-size: 18px; margin-bottom: 4px; }
  .cards span { color: var(--muted); font-size: 14px; }
  #toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  #toolbar button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px;
                    background: var(--card); color: var(--fg); cursor: pointer; font-size: 14px; }
  .error { color: #d1242f; }
</style>
</head>
<body>
<header>
  <a class="home" href="./">📚 民法自修講義</a>
  <nav id="nav"></nav>
</header>
<main id="main"></main>

<script src="vendor/marked.min.js"></script>
<script>
  // 要新增講義，在這裡加一筆即可
  const DOCS = [
    { id: 'week2', file: 'notes/第2週-1140916-行為能力自修.md',
      title: '第 2 週：法律行為與行為能力', desc: '114/09/16 · 陳玫儒 · 行為能力、監護宣告、刑事責任能力' },
    { id: 'week3', file: 'notes/性別平權與生活法律-第三週.md',
      title: '第 3 週：性別平權與生活法律', desc: '115/09/24 · 王俊怡律師 · 親屬、父母子女、繼承' },
    { id: 'week4', file: 'notes/第4週-1140930-婚姻與離婚自修.md',
      title: '第 4 週：結婚與離婚', desc: '114/09/30 · 結婚要件、近親禁婚、裁判離婚案例' },
    { id: 'week5', file: 'notes/性別平權與生活法律-第五週.md',
      title: '第 5 週：代位繼承與遺產分割', desc: '115/10/08 · 王俊怡律師 · 代位繼承、喪失繼承權、扣還與歸扣' },
    { id: 'week6', file: 'notes/性別平權與生活法律-第六週.md',
      title: '第 6 週：繼承的態樣與遺囑', desc: '115/10/15 · 王俊怡律師 · 有限責任、拋棄繼承、遺囑方式、特留分' },
    { id: 'week7', file: 'notes/第7週-1151022-剩餘財產分配.md',
      title: '第 7 週：剩餘財產分配', desc: '115/10/22 · 陳玫儒律師 · 計算三步驟、基準時點、追加計算、查財產' },
  ];

  const nav = document.getElementById('nav');
  const main = document.getElementById('main');

  function renderNav(active) {
    nav.innerHTML = DOCS.map(d =>
      `<a href="?doc=${d.id}" class="${d.id === active ? 'active' : ''}">${d.title.split('：')[0]}</a>`
    ).join('');
  }

  function renderHome() {
    document.title = '民法自修講義';
    main.innerHTML = '<div class="markdown-body"><h1>民法自修講義</h1>' +
      '<p>每段先讀內容，再做題目，最後點開「解答」對答案。</p></div>' +
      '<div class="cards">' + DOCS.map(d =>
        `<a href="?doc=${d.id}"><b>${d.title}</b><span>${d.desc}</span></a>`).join('') + '</div>';
  }

  async function renderDoc(doc) {
    document.title = doc.title;
    main.innerHTML = '<p>載入中…</p>';
    const mdUrl = new URL(doc.file, location.href);
    try {
      const res = await fetch(mdUrl, { cache: 'no-cache' });
      if (!res.ok) throw new Error(res.status);
      const html = marked.parse(await res.text());
      main.innerHTML = '<div id="toolbar"><button data-open="1">展開全部解答</button>' +
        '<button data-open="0">收合全部解答</button></div>' +
        '<article class="markdown-body">' + html + '</article>';
      // 圖片路徑是相對於 .md 檔，改成相對於網頁
      main.querySelectorAll('img').forEach(img => {
        img.src = new URL(img.getAttribute('src'), mdUrl).href;
        img.loading = 'lazy';
      });
      main.querySelectorAll('#toolbar button').forEach(b => b.onclick = () =>
        main.querySelectorAll('details').forEach(d => d.open = b.dataset.open === '1'));
    } catch (e) {
      main.innerHTML = `<p class="error">無法載入 ${doc.file}（${e.message}）</p>`;
    }
  }

  const id = new URLSearchParams(location.search).get('doc');
  const doc = DOCS.find(d => d.id === id);
  renderNav(doc && doc.id);
  doc ? renderDoc(doc) : renderHome();
</script>
</body>
</html>
