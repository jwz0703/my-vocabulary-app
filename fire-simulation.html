<title>火焰流體模擬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed WebGL canvas as the stage; a slim soot-glass control rail floats at the right edge. Single dark look by choice. */
  :root {
    color-scheme: dark;
    --soot: #0b0908;
    --ash: #1a1613;
    --glass: rgba(18, 14, 12, 0.72);
    --line: rgba(255, 196, 140, 0.14);
    --text: #efe6dc;
    --muted: #a3958a;
    --ember: #ff8a3d;
    --ember-dim: #7a3b16;
    --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--soot);
    color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
  }
  #stage {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  .hud {
    position: fixed;
    top: calc(16px + env(safe-area-inset-top, 0px));
    left: 16px;
    display: grid; gap: 4px;
    pointer-events: none;
    max-width: calc(100% - 32px);
  }
  .hud h1 {
    margin: 0;
    font-size: 1.15rem; font-weight: 700;
    letter-spacing: 0.04em;
    text-wrap: balance;
  }
  .hud p {
    margin: 0;
    font-size: 0.78rem; color: var(--muted);
    line-height: 1.5;
  }
  .stats {
    font-family: var(--font-data);
    font-size: 0.7rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .panel {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(300px, calc(100% - 32px));
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    display: grid; gap: 12px;
    max-height: calc(100% - 140px);
    overflow-y: auto;
  }
  .panel header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .panel h2 {
    margin: 0; font-size: 0.72rem; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .controls { display: grid; gap: 10px; }
  .panel.collapsed .controls, .panel.collapsed .actions { display: none; }
  .row { display: grid; gap: 4px; }
  .row label {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 0.8rem;
  }
  .row output {
    font-family: var(--font-data); font-size: 0.72rem; color: var(--ember);
    font-variant-numeric: tabular-nums;
  }
  input[type="range"] {
    width: 100%; margin: 0;
    accent-color: var(--ember);
  }
  .check {
    display: flex; align-items: center; gap: 8px; font-size: 0.8rem;
  }
  .check input { accent-color: var(--ember); margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; font-size: 0.78rem;
    color: var(--text);
    background: var(--ash);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { border-color: var(--ember-dim); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  button.primary { background: var(--ember-dim); border-color: var(--ember-dim); }
  #toggle { padding: 2px 10px; font-size: 0.72rem; }
  .error {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding-inline: 16px; text-align: center; color: var(--muted);
  }
</style>

<canvas id="stage" aria-label="火焰流體模擬畫面，拖曳以添加燃料與氣流"></canvas>

<div class="hud">
  <h1>火焰流體模擬</h1>
  <p>Navier–Stokes 不可壓縮流體 · 浮力 · 燃燒 · 渦度約束<br>在畫面上拖曳可噴灑燃料並推動氣流</p>
  <div class="stats" id="stats">初始化中…</div>
</div>

<section class="panel" id="panel" aria-label="模擬參數">
  <header>
    <h2>參數</h2>
    <button id="toggle" type="button" aria-expanded="true">收合</button>
  </header>
  <div class="controls">
    <div class="row">
      <label for="fuel">燃料供給 <output id="fuel-out" for="fuel"></output></label>
      <input id="fuel" type="range" min="0" max="3" step="0.05" value="1.2">
    </div>
    <div class="row">
      <label for="width">燃燒器寬度 <output id="width-out" for="width"></output></label>
      <input id="width" type="range" min="0.02" max="0.6" step="0.01" value="0.16">
    </div>
    <div class="row">
      <label for="buoy">浮力 <output id="buoy-out" for="buoy"></output></label>
      <input id="buoy" type="range" min="0" max="600" step="10" value="260">
    </div>
    <div class="row">
      <label for="vort">渦度約束 <output id="vort-out" for="vort"></output></label>
      <input id="vort" type="range" min="0" max="60" step="1" value="22">
    </div>
    <div class="row">
      <label for="cool">冷卻率 <output id="cool-out" for="cool"></output></label>
      <input id="cool" type="range" min="0.2" max="4" step="0.05" value="1.3">
    </div>
    <div class="row">
      <label for="wind">側風 <output id="wind-out" for="wind"></output></label>
      <input id="wind" type="range" min="-120" max="120" step="2" value="0">
    </div>
    <div class="row">
      <label for="iters">壓力迭代 <output id="iters-out" for="iters"></output></label>
      <input id="iters" type="range" min="4" max="60" step="1" value="28">
    </div>
    <label class="check" for="smoke"><input id="smoke" type="checkbox" checked> 顯示煙霧</label>
    <label class="check" for="bloom"><input id="bloom" type="checkbox" checked> 光暈 (Bloom)</label>
  </div>
  <div class="actions">
    <button id="pause" type="button" class="primary">暫停</button>
    <button id="clear" type="button">清除場</button>
    <button id="reset" type="button">恢復預設</button>
  </div>
</section>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const statsEl = document.getElementById('stats');
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: false });

  function fail(msg) {
    const d = document.createElement('div');
    d.className = 'error';
    d.textContent = msg;
    document.body.appendChild(d);
    statsEl.textContent = '無法執行';
  }
  if (!gl) { fail('此瀏覽器不支援 WebGL2，無法執行流體模擬。請改用最新版 Chrome、Edge、Firefox 或 Safari。'); return; }
  if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float')) {
    fail('此裝置的 GPU 不支援浮點紋理渲染，無法執行流體模擬。'); return;
  }
  gl.getExtension('OES_texture_float_linear');

  // ---------- parameters ----------
  const defaults = { fuel: 1.2, width: 0.16, buoy: 260, vort: 22, cool: 1.3, wind: 0, iters: 28, smoke: true, bloom: true };
  const P = { ...defaults, paused: false };
  const SIM_RES = 200;   // velocity / pressure grid, shorter side
  const DYE_RES = 512;   // temperature / fuel / smoke grid, shorter side
  const BLOOM_DIV = 4;

  // ---------- shaders ----------
  const VS = `#version 300 es
  precision highp float;
  in vec2 aPos;
  uniform vec2 texel;
  out vec2 vUv, vL, vR, vT, vB;
  void main() {
    vUv = aPos * 0.5 + 0.5;
    vL = vUv - vec2(texel.x, 0.0); vR = vUv + vec2(texel.x, 0.0);
    vT = vUv + vec2(0.0, texel.y); vB = vUv - vec2(0.0, texel.y);
    gl_Position = vec4(aPos, 0.0, 1.0);
  }`;
  const HEAD = `#version 300 es
  precision highp float; precision highp sampler2D;
  in vec2 vUv, vL, vR, vT, vB;
  out vec4 o;
  float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int k = 0; k < 4; k++) { s += a * vnoise(p); p *= 2.03; a *= 0.5; } return s; }
  // Approximate blackbody chromaticity (Tanner Helland fit), returned in linear RGB.
  vec3 blackbody(float K) {
    float t = K / 100.0; vec3 c;
    c.r = t <= 66.0 ? 1.0 : clamp(1.29293618606 * pow(t - 60.0, -0.1332047592), 0.0, 1.0);
    c.g = t <= 66.0 ? clamp(0.39008157876 * log(t) - 0.63184144378, 0.0, 1.0)
                    : clamp(1.12989086089 * pow(t - 60.0, -0.0755148492), 0.0, 1.0);
    c.b = t >= 66.0 ? 1.0 : (t <= 19.0 ? 0.0 : clamp(0.54320678911 * log(t - 10.0) - 1.19625408914, 0.0, 1.0));
    return pow(c, vec3(2.2));
  }
  // Emitted radiance from a temperature value: Kelvin mapping + Stefan–Boltzmann T^4 intensity.
  vec3 emission(float T) {
    float K = 700.0 + T * 950.0;
    float I = pow(K / 1600.0, 4.0) * smoothstep(0.06, 0.45, T);
    return blackbody(K) * I * 1.4;
  }
  `;

  const FS = {
    advect: `
      uniform sampler2D uVel, uSrc; uniform vec2 velTexel; uniform float dt; uniform vec4 decay; uniform float zeroOutside;
      void main() {
        vec2 c = vUv - dt * texture(uVel, vUv).xy * velTexel;
        vec4 v = texture(uSrc, c) * exp(-decay * dt);
        if (zeroOutside > 0.5 && (c.x < 0.0 || c.x > 1.0 || c.y < 0.0 || c.y > 1.0)) v = vec4(0.0);
        o = v;
      }`,
    combust: `
      uniform sampler2D uFire; uniform float dt, burnRate, heat, cooling, soot;
      void main() {
        vec4 f = texture(uFire, vUv);
        float T = f.r, F = f.g, S = f.b;
        float ign = smoothstep(0.2, 0.55, T);
        float burn = min(F, F * burnRate * ign * dt);
        F -= burn; T += burn * heat; S += burn * soot;
        T = max(0.0, T - dt * (cooling * 0.35 * T + cooling * 0.12 * T * T * T * T));
        o = vec4(min(T, 4.0), F, min(S, 3.0), 1.0);
      }`,
    source: `
      uniform sampler2D uFire; uniform float time, width, center, amount, aspect, dt;
      void main() {
        vec4 f = texture(uFire, vUv);
        float x = (vUv.x - center) * aspect;
        float shape = 1.0 - smoothstep(width * 0.55, width, abs(x));
        float band = 1.0 - smoothstep(0.0, 0.05, vUv.y);
        float n = fbm(vec2(x * 18.0, time * 2.6)) * fbm(vec2(x * 7.0 + 31.0, time * 1.3));
        n = smoothstep(0.08, 0.5, n);
        float a = shape * band;
        f.g += a * n * amount * dt * 26.0;
        f.r = max(f.r, a * (0.55 + 0.6 * n) * step(0.001, amount));
        o = f;
      }`,
    forces: `
      uniform sampler2D uVel, uFire; uniform float dt, buoy, weight, wind, time, center, width, aspect, turb;
      void main() {
        vec2 v = texture(uVel, vUv).xy;
        vec4 f = texture(uFire, vUv);
        v.y += dt * (buoy * f.r - weight * f.b);
        v.x += dt * 0.9 * (wind * (0.25 + vUv.y) - v.x) * smoothstep(0.0, 0.05, f.r + f.b);
        float x = (vUv.x - center) * aspect;
        float near = (1.0 - smoothstep(width, width * 2.0, abs(x))) * (1.0 - smoothstep(0.0, 0.3, vUv.y));
        vec2 kick = vec2(vnoise(vec2(vUv.x * 24.0, time * 5.0)), vnoise(vec2(vUv.x * 24.0 + 17.0, time * 5.0))) - 0.5;
        v += dt * kick * turb * near;
        o = vec4(v, 0.0, 1.0);
      }`,
    curl: `
      uniform sampler2D uVel;
      void main() {
        float L = texture(uVel, vL).y, R = texture(uVel, vR).y, T = texture(uVel, vT).x, B = texture(uVel, vB).x;
        o = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
      }`,
    vorticity: `
      uniform sampler2D uVel, uCurl; uniform float eps, dt;
      void main() {
        float L = texture(uCurl, vL).x, R = texture(uCurl, vR).x, T = texture(uCurl, vT).x, B = texture(uCurl, vB).x;
        float C = texture(uCurl, vUv).x;
        vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        force /= length(force) + 1e-4;
        force *= eps * C; force.y *= -1.0;
        vec2 v = texture(uVel, vUv).xy + force * dt;
        o = vec4(clamp(v, -2000.0, 2000.0), 0.0, 1.0);
      }`,
    divergence: `
      uniform sampler2D uVel;
      void main() {
        float L = texture(uVel, vL).x, R = texture(uVel, vR).x, T = texture(uVel, vT).y, B = texture(uVel, vB).y;
        vec2 C = texture(uVel, vUv).xy;
        if (vL.x < 0.0) L = -C.x;
        if (vR.x > 1.0) R = -C.x;
        if (vB.y < 0.0) B = -C.y;
        o = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
      }`,
    pressure: `
      uniform sampler2D uP, uDiv;
      void main() {
        float L = texture(uP, vL).x, R = texture(uP, vR).x, T = texture(uP, vT).x, B = texture(uP, vB).x;
        if (vT.y > 1.0) T = 0.0; // open top: ambient pressure
        o = vec4((L + R + B + T - texture(uDiv, vUv).x) * 0.25, 0.0, 0.0, 1.0);
      }`,
    gradient: `
      uniform sampler2D uP, uVel;
      void main() {
        float L = texture(uP, vL).x, R = texture(uP, vR).x, T = texture(uP, vT).x, B = texture(uP, vB).x;
        if (vT.y > 1.0) T = 0.0;
        vec2 v = texture(uVel, vUv).xy - 0.5 * vec2(R - L, T - B);
        o = vec4(v, 0.0, 1.0);
      }`,
    scale: `
      uniform sampler2D uSrc; uniform float k;
      void main() { o = texture(uSrc, vUv) * k; }`,
    splat: `
      uniform sampler2D uSrc; uniform vec2 point; uniform float radius, aspect; uniform vec4 val;
      void main() {
        vec2 p = vUv - point; p.x *= aspect;
        o = texture(uSrc, vUv) + val * exp(-dot(p, p) / radius);
      }`,
    prefilter: `
      uniform sampler2D uFire;
      void main() { o = vec4(emission(texture(uFire, vUv).r), 1.0); }`,
    blur: `
      uniform sampler2D uSrc; uniform vec2 dir;
      void main() {
        vec3 s = texture(uSrc, vUv).rgb * 0.227027;
        s += (texture(uSrc, vUv + dir * 1.384615).rgb + texture(uSrc, vUv - dir * 1.384615).rgb) * 0.316216;
        s += (texture(uSrc, vUv + dir * 3.230769).rgb + texture(uSrc, vUv - dir * 3.230769).rgb) * 0.070270;
        o = vec4(s, 1.0);
      }`,
    display: `
      uniform sampler2D uFire, uBloom; uniform float smokeOn, bloomAmt, aspect; uniform vec2 res;
      void main() {
        vec4 f = texture(uFire, vUv);
        vec3 bl = texture(uBloom, vUv).rgb;
        vec2 q = (vUv - vec2(0.5, 0.0)) * vec2(aspect, 1.0);
        vec3 bg = vec3(0.006, 0.005, 0.005) + vec3(0.035, 0.016, 0.006) * exp(-length(q * vec2(1.0, 1.8)) * 2.4);
        float dens = f.b * smokeOn;
        float tr = exp(-dens * 1.8);
        vec3 smokeCol = vec3(0.05, 0.047, 0.045);
        vec3 col = bg * tr + smokeCol * (1.0 - tr);
        col += (1.0 - tr) * bl * 0.9;              // smoke lit by the flame
        col += emission(f.r) * mix(1.0, tr, 0.35) + bl * bloomAmt;
        col = 1.0 - exp(-col * 1.15);                 // exposure tone map
        col = pow(col, vec3(1.0 / 2.2));
        col += (hash(gl_FragCoord.xy + fract(res)) - 0.5) / 255.0;
        o = vec4(col, 1.0);
      }`,
  };

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const vs = compile(gl.VERTEX_SHADER, VS);
  function program(fsBody) {
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, HEAD + fsBody));
    gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p, u };
  }
  let prog;
  try { prog = Object.fromEntries(Object.entries(FS).map(([k, src]) => [k, program(src)])); }
  catch (e) { console.error(e); fail('著色器編譯失敗：' + e.message); return; }

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // ---------- framebuffers ----------
  function fbo(w, h) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('framebuffer incomplete');
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fb, w, h, texel: [1 / w, 1 / h] };
  }
  function dfbo(w, h) {
    const d = { read: fbo(w, h), write: fbo(w, h), w, h };
    d.texel = d.read.texel;
    d.swap = () => { const t = d.read; d.read = d.write; d.write = t; };
    return d;
  }
  function freeFbo(f) { if (!f) return; gl.deleteTexture(f.tex); gl.deleteFramebuffer(f.fb); }
  function gridSize(res, aspect) {
    return aspect >= 1 ? [Math.round(res * aspect), res] : [res, Math.round(res / aspect)];
  }

  let vel, fire, pres, div, curl, bloomA, bloomB, aspect = 1;
  function allocate() {
    [vel, fire, pres].forEach(d => { if (d) { freeFbo(d.read); freeFbo(d.write); } });
    [div, curl, bloomA, bloomB].forEach(freeFbo);
    aspect = canvas.width / canvas.height;
    const [sw, sh] = gridSize(SIM_RES, aspect);
    const [dw, dh] = gridSize(DYE_RES, aspect);
    vel = dfbo(sw, sh); pres = dfbo(sw, sh); div = fbo(sw, sh); curl = fbo(sw, sh);
    fire = dfbo(dw, dh);
    const bw = Math.max(1, Math.round(canvas.width / BLOOM_DIV)), bh = Math.max(1, Math.round(canvas.height / BLOOM_DIV));
    bloomA = fbo(bw, bh); bloomB = fbo(bw, bh);
    statsEl.dataset.grid = `${sw}×${sh}`;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (w === canvas.width && h === canvas.height && vel) return;
    canvas.width = w; canvas.height = h;
    try { allocate(); } catch (e) { console.error(e); fail('無法建立浮點緩衝區：' + e.message); throw e; }
  }

  // ---------- pass helper ----------
  let unit = 0;
  function run(pr, target, uniforms, texel) {
    gl.useProgram(pr.p);
    unit = 0;
    const t = texel || (target ? target.texel : [1 / canvas.width, 1 / canvas.height]);
    if (pr.u.texel) gl.uniform2f(pr.u.texel, t[0], t[1]);
    for (const [name, v] of Object.entries(uniforms)) {
      const loc = pr.u[name];
      if (loc == null) continue;
      if (v && v.tex) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, v.tex); gl.uniform1i(loc, unit++); }
      else if (typeof v === 'number') gl.uniform1f(loc, v);
      else if (v.length === 2) gl.uniform2f(loc, v[0], v[1]);
      else if (v.length === 4) gl.uniform4f(loc, v[0], v[1], v[2], v[3]);
    }
    if (target) { gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, canvas.width, canvas.height); }
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // ---------- pointer input ----------
  const pointers = new Map();
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    const p = toUv(e);
    pointers.set(e.pointerId, { x: p[0], y: p[1], dx: 0, dy: 0, moved: true });
  });
  canvas.addEventListener('pointermove', e => {
    const ptr = pointers.get(e.pointerId);
    if (!ptr) return;
    const p = toUv(e);
    ptr.dx += p[0] - ptr.x; ptr.dy += p[1] - ptr.y;
    ptr.x = p[0]; ptr.y = p[1]; ptr.moved = true;
  });
  const up = e => pointers.delete(e.pointerId);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  function toUv(e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height];
  }

  // ---------- simulation step ----------
  function step(dt, time) {
    const center = 0.5;
    // inject fuel at the burner
    run(prog.source, fire.write, { uFire: fire.read, time, width: P.width, center, amount: P.fuel, aspect, dt });
    fire.swap();

    // pointer: spray fuel + heat and push the air
    for (const ptr of pointers.values()) {
      run(prog.splat, fire.write, { uSrc: fire.read, point: [ptr.x, ptr.y], radius: 0.00035, aspect, val: [0.4, 1.4, 0, 0] });
      fire.swap();
      const [sw, sh] = [vel.w, vel.h];
      const fx = ptr.dx * sw / Math.max(dt, 1e-3) * 0.6, fy = ptr.dy * sh / Math.max(dt, 1e-3) * 0.6;
      if (fx || fy) { run(prog.splat, vel.write, { uSrc: vel.read, point: [ptr.x, ptr.y], radius: 0.0012, aspect, val: [fx, fy, 0, 0] }); vel.swap(); }
      ptr.dx = 0; ptr.dy = 0;
    }

    // combustion: fuel → heat + soot, radiative/convective cooling
    run(prog.combust, fire.write, { uFire: fire.read, dt, burnRate: 4.5, heat: 0.55, cooling: P.cool, soot: 0.22 });
    fire.swap();

    // buoyancy, wind and burner turbulence
    run(prog.forces, vel.write, { uVel: vel.read, uFire: fire.read, dt, buoy: P.buoy, weight: 18, wind: P.wind, time, center, width: P.width, aspect, turb: 900 });
    vel.swap();

    // vorticity confinement
    run(prog.curl, curl, { uVel: vel.read });
    run(prog.vorticity, vel.write, { uVel: vel.read, uCurl: curl, eps: P.vort, dt });
    vel.swap();

    // projection: make the velocity field divergence-free
    run(prog.divergence, div, { uVel: vel.read });
    run(prog.scale, pres.write, { uSrc: pres.read, k: 0.8 });
    pres.swap();
    for (let i = 0; i < P.iters; i++) {
      run(prog.pressure, pres.write, { uP: pres.read, uDiv: div });
      pres.swap();
    }
    run(prog.gradient, vel.write, { uP: pres.read, uVel: vel.read });
    vel.swap();

    // semi-Lagrangian advection
    run(prog.advect, vel.write, { uVel: vel.read, uSrc: vel.read, velTexel: vel.texel, dt, decay: [0.15, 0.15, 0, 0], zeroOutside: 0 }, vel.texel);
    vel.swap();
    run(prog.advect, fire.write, { uVel: vel.read, uSrc: fire.read, velTexel: vel.texel, dt, decay: [0, 0.2, 0.3, 0], zeroOutside: 1 }, fire.texel);
    fire.swap();
  }

  function render() {
    if (P.bloom) {
      run(prog.prefilter, bloomA, { uFire: fire.read });
      for (let i = 0; i < 3; i++) {
        const s = 1 + i;
        run(prog.blur, bloomB, { uSrc: bloomA, dir: [bloomA.texel[0] * s, 0] });
        run(prog.blur, bloomA, { uSrc: bloomB, dir: [0, bloomA.texel[1] * s] });
      }
    }
    run(prog.display, null, { uFire: fire.read, uBloom: bloomA, smokeOn: P.smoke ? 1 : 0, bloomAmt: P.bloom ? 0.55 : 0, aspect, res: [canvas.width, canvas.height] });
  }

  function clearFields() {
    [vel, fire, pres].forEach(d => [d.read, d.write].forEach(f => {
      gl.bindFramebuffer(gl.FRAMEBUFFER, f.fb); gl.viewport(0, 0, f.w, f.h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    }));
    run(prog.scale, bloomA, { uSrc: bloomB, k: 0 });
  }

  // ---------- loop ----------
  let last = performance.now(), simTime = 0, frames = 0, fpsT = last, fps = 0;
  function frame(now) {
    resize();
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    if (!P.paused) { simTime += dt; step(dt, simTime); }
    render();
    frames++;
    if (now - fpsT > 500) {
      fps = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now;
      statsEl.textContent = `網格 ${statsEl.dataset.grid} · 壓力迭代 ${P.iters} · ${fps} fps${P.paused ? ' · 已暫停' : ''}`;
    }
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------
  const fmt = { fuel: v => v.toFixed(2), width: v => v.toFixed(2), buoy: v => v.toFixed(0), vort: v => v.toFixed(0), cool: v => v.toFixed(2), wind: v => (v > 0 ? '+' : '') + v.toFixed(0), iters: v => v.toFixed(0) };
  function bindUI() {
    for (const key of Object.keys(fmt)) {
      const input = document.getElementById(key), out = document.getElementById(key + '-out');
      input.value = P[key]; out.textContent = fmt[key](P[key]);
      input.oninput = () => { P[key] = parseFloat(input.value); out.textContent = fmt[key](P[key]); };
    }
    for (const key of ['smoke', 'bloom']) {
      const input = document.getElementById(key);
      input.checked = P[key];
      input.onchange = () => { P[key] = input.checked; };
    }
  }
  bindUI();
  const pauseBtn = document.getElementById('pause');
  pauseBtn.onclick = () => { P.paused = !P.paused; pauseBtn.textContent = P.paused ? '繼續' : '暫停'; };
  document.getElementById('clear').onclick = () => clearFields();
  document.getElementById('reset').onclick = () => { Object.assign(P, defaults); bindUI(); };
  const panel = document.getElementById('panel'), toggle = document.getElementById('toggle');
  toggle.onclick = () => {
    const c = panel.classList.toggle('collapsed');
    toggle.textContent = c ? '展開' : '收合';
    toggle.setAttribute('aria-expanded', String(!c));
  };
  if (window.innerWidth < 600) toggle.click();
  window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); pauseBtn.click(); } });

  try { resize(); } catch (e) { return; }
  requestAnimationFrame(frame);
})();
</script>
