<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水流實驗槽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: one-screen lab bench. The tank fills the left; a narrow control rail sits on the right and stacks under the tank on phones. */
:root {
  --bg: #e7ecea;
  --surface: #f5f7f6;
  --surface-2: #dfe6e3;
  --fg: #16201e;
  --muted: #566562;
  --line: #c9d3d0;
  --accent: #976214;
  --accent-soft: #f0e2c8;
  --on-accent: #ffffff;
  --danger: #b0402e;
  --tank-bezel: #cdd6d3;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1312; --surface: #161d1c; --surface-2: #1f2827; --fg: #e1e8e6; --muted: #8fa09c;
    --line: #2a3533; --accent: #d7a24a; --accent-soft: #3a2f1b; --on-accent: #1a1406; --danger: #e2735e;
    --tank-bezel: #1b2321; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1312; --surface: #161d1c; --surface-2: #1f2827; --fg: #e1e8e6; --muted: #8fa09c;
  --line: #2a3533; --accent: #d7a24a; --accent-soft: #3a2f1b; --on-accent: #1a1406; --danger: #e2735e;
  --tank-bezel: #1b2321; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font-ui);
}

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.bar {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 24px;
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 {
  margin: 0;
  font: 700 22px/1.2 var(--font-display);
  letter-spacing: 0.06em;
}
.brand .sub { color: var(--muted); font: 12px/1.4 var(--font-data); letter-spacing: 0.04em; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-left: auto; }
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat .k { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
.stat .v { font: 500 13px/1 var(--font-data); font-variant-numeric: tabular-nums; min-width: 6ch; }
.transport { display: flex; gap: 6px; }

/* ---------- buttons ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font: 500 13px/1 var(--font-ui);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.12s, border-color 0.12s;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .tool:focus-visible, .seg button:focus-visible, .swatch:focus-visible, .scene:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 5.5em; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }

/* ---------- tank ---------- */
.tank-wrap {
  position: relative;
  min-height: 0;
  min-width: 0;
  border-radius: 10px;
  background: var(--tank-bezel);
  overflow: hidden;
}
.tank-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#bg, #gl, #gpu { pointer-events: none; }
#tank { touch-action: none; cursor: crosshair; }
.hint {
  position: absolute;
  left: 12px;
  bottom: 12px;
  max-width: calc(100% - 24px);
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(8, 14, 18, 0.72);
  color: #dbe7ea;
  font-size: 12px;
  pointer-events: none;
}

/* ---------- control rail ---------- */
.rail {
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-right: 2px;
}
.rail section { display: flex; flex-direction: column; gap: 10px; }
.rail h2 {
  margin: 0;
  font: 500 11px/1 var(--font-ui);
  color: var(--muted);
  letter-spacing: 0.18em;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tool {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 9px 2px 7px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font: 500 12px/1.2 var(--font-ui);
  cursor: pointer;
}
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool .key { position: absolute; top: 3px; right: 5px; font: 10px/1 var(--font-data); color: var(--muted); }
.tool:hover { border-color: var(--accent); }
.tool[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tool[aria-checked="true"] svg { stroke: var(--accent); }

.field { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 8px; }
.field label { font-size: 13px; }
.field output { font: 12px/1 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.field input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button {
  appearance: none; border: 0; background: var(--surface); color: var(--fg);
  font: 500 12px/1 var(--font-ui); padding: 8px 4px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.seg button:disabled { color: var(--muted); cursor: not-allowed; }
.seg-label { font-size: 13px; }

.dev { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.dev-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dev-title { font-weight: 700; }
.dev-row { display: flex; gap: 6px; }
.dev-row .btn { flex: 1; }
.empty { margin: 0; color: var(--muted); font-size: 13px; }
.readout { margin: 0; font-size: 12px; color: var(--muted); }
.readout b { font: 500 13px/1 var(--font-data); color: var(--fg); font-variant-numeric: tabular-nums; }
.swatches { display: flex; gap: 8px; }
.swatch {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line);
  cursor: pointer; padding: 0;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }

.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scene {
  appearance: none; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 8px 10px; cursor: pointer; font: 500 13px/1.3 var(--font-ui);
}
.scene small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.scene:hover { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; }
  .tank-wrap { height: 62vh; min-height: 320px; }
  .rail { overflow: visible; }
  .stats { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>水流實驗槽</h1>
      <span class="sub" id="gridInfo">載入中</span>
    </div>
    <div class="stats" aria-live="off">
      <div class="stat"><span class="k">水量</span><span class="v" id="stVol">0 L</span></div>
      <div class="stat"><span class="k">流入</span><span class="v" id="stIn">0.0 L/s</span></div>
      <div class="stat"><span class="k">排出</span><span class="v" id="stOut">0.0 L/s</span></div>
      <div class="stat"><span class="k">粒子</span><span class="v" id="stP">0</span></div>
      <div class="stat"><span class="k">FPS</span><span class="v" id="stFps">–</span></div>
    </div>
    <div class="transport">
      <button class="btn primary" id="btnPlay" aria-pressed="false">暫停</button>
      <button class="btn" id="btnStep" disabled>單步</button>
    </div>
  </header>

  <main class="tank-wrap" id="tankWrap">
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="gpu" aria-hidden="true" hidden></canvas>
    <canvas id="tank" aria-label="水槽模擬畫面"></canvas>
    <div class="hint" id="hint"></div>
  </main>

  <aside class="rail">
    <section>
      <h2>工具</h2>
      <div class="tools" role="radiogroup" aria-label="工具">
        <button class="tool" role="radio" data-tool="select" aria-checked="false"><span class="key">1</span>
          <svg viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.5L10 18z"/></svg>移動</button>
        <button class="tool" role="radio" data-tool="wall" aria-checked="true"><span class="key">2</span>
          <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 12h18M9 6v6M15 12v6"/></svg>障礙物</button>
        <button class="tool" role="radio" data-tool="erase" aria-checked="false"><span class="key">3</span>
          <svg viewBox="0 0 24 24"><path d="M4 15l9-9 6 6-7 7H7zM9 10l6 6M12 19h8"/></svg>擦除</button>
        <button class="tool" role="radio" data-tool="source" aria-checked="false"><span class="key">4</span>
          <svg viewBox="0 0 24 24"><path d="M3 7h9a4 4 0 0 1 4 4v2M3 4v6M16 17v.5M16 21v.5M13 19v.5"/></svg>出水孔</button>
        <button class="tool" role="radio" data-tool="drain" aria-checked="false"><span class="key">5</span>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 9h8M7 12h10M8 15h8"/></svg>排水孔</button>
        <button class="tool" role="radio" data-tool="pour" aria-checked="false"><span class="key">6</span>
          <svg viewBox="0 0 24 24"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/></svg>倒水</button>
        <button class="tool" role="radio" data-tool="stir" aria-checked="false"><span class="key">7</span>
          <svg viewBox="0 0 24 24"><path d="M19 13a7 7 0 1 1-2.5-6.4M19 4v4h-4"/></svg>攪動</button>
        <button class="tool" role="radio" data-tool="sponge" aria-checked="false"><span class="key">8</span>
          <svg viewBox="0 0 24 24"><path d="M4 8h16v10H4zM8 12h.01M12 15h.01M16 11h.01M7 8c1-3 9-3 10 0"/></svg>吸水</button>
      </div>
      <div class="field">
        <label for="brush">筆刷大小</label><output id="brushOut" for="brush">12 cm</output>
        <input type="range" id="brush" min="5" max="40" step="1" value="12">
      </div>
    </section>

    <section>
      <h2>裝置</h2>
      <p class="empty" id="devEmpty">用「出水孔」或「排水孔」工具在槽內點一下來放置，或用「移動」點選已放好的裝置來調整。</p>

      <div class="dev" id="srcEdit" hidden>
        <div class="dev-head"><span class="dev-title" id="srcTitle">出水孔</span><button class="btn danger" id="srcDel">刪除</button></div>
        <div class="dev-row"><button class="btn" id="srcOn" aria-pressed="true">出水中</button></div>
        <div class="field">
          <label for="srcSpeed">流速</label><output id="srcSpeedOut" for="srcSpeed">2.5 m/s</output>
          <input type="range" id="srcSpeed" min="0.5" max="6" step="0.1" value="2.5">
        </div>
        <div class="field">
          <label for="srcWidth">口徑</label><output id="srcWidthOut" for="srcWidth">14 cm</output>
          <input type="range" id="srcWidth" min="4" max="40" step="1" value="14">
        </div>
        <div class="field">
          <label for="srcAngle">噴水角度</label><output id="srcAngleOut" for="srcAngle">0°</output>
          <input type="range" id="srcAngle" min="-180" max="180" step="1" value="0">
        </div>
        <div class="seg-label">水的顏色</div>
        <div class="swatches" id="srcColors"></div>
        <p class="readout">流量 <b id="srcFlow">0.0</b> L/s</p>
      </div>

      <div class="dev" id="drnEdit" hidden>
        <div class="dev-head"><span class="dev-title" id="drnTitle">排水孔</span><button class="btn danger" id="drnDel">刪除</button></div>
        <div class="field">
          <label for="drnR">孔徑</label><output id="drnROut" for="drnR">14 cm</output>
          <input type="range" id="drnR" min="5" max="40" step="1" value="14">
        </div>
        <div class="field">
          <label for="drnPull">吸力</label><output id="drnPullOut" for="drnPull">1.0</output>
          <input type="range" id="drnPull" min="0" max="3" step="0.1" value="1">
        </div>
      </div>
    </section>

    <section>
      <h2>環境</h2>
      <div class="seg-label">運算</div>
      <div class="seg" id="segEngine">
        <button data-v="gpu" aria-pressed="false">GPU（WebGPU）</button>
        <button data-v="cpu" aria-pressed="false">CPU</button>
      </div>
      <p class="readout" id="engineInfo"></p>
      <div class="seg-label">模擬品質</div>
      <div class="seg" id="segQuality">
        <button data-v="low" aria-pressed="false">流暢</button>
        <button data-v="mid" aria-pressed="false">標準</button>
        <button data-v="high" aria-pressed="false">精細</button>
        <button data-v="ultra" aria-pressed="false">極致</button>
      </div>
      <p class="readout" id="qualityInfo"></p>
      <div class="field">
        <label for="grav">重力</label><output id="gravOut" for="grav">1.00 g</output>
        <input type="range" id="grav" min="0" max="2" step="0.05" value="1">
      </div>
      <div class="field">
        <label for="flip">水的活潑度</label><output id="flipOut" for="flip">90%</output>
        <input type="range" id="flip" min="0.5" max="0.99" step="0.01" value="0.9">
      </div>
      <div class="seg-label">畫面</div>
      <div class="seg" id="segView">
        <button data-v="surface" aria-pressed="true">水面</button>
        <button data-v="particles" aria-pressed="false">粒子</button>
      </div>
      <div class="seg-label">著色</div>
      <div class="seg" id="segColor">
        <button data-v="source" aria-pressed="true">依來源</button>
        <button data-v="speed" aria-pressed="false">依流速</button>
      </div>
    </section>

    <section>
      <h2>場景</h2>
      <div class="scenes">
        <button class="scene" data-scene="cascade">瀑布階梯<small>水從高處一階一階流下</small></button>
        <button class="scene" data-scene="funnel">漏斗混色<small>兩色水流經過釘陣</small></button>
        <button class="scene" data-scene="dam">潰壩<small>一整塊水瞬間倒下</small></button>
        <button class="scene" data-scene="empty">空水槽<small>只有一個出水孔</small></button>
      </div>
      <div class="row2">
        <button class="btn" id="btnClearWater">清空水</button>
        <button class="btn" id="btnClearWalls">清除障礙物</button>
      </div>
    </section>
  </aside>
</div>

<script>
(() => {
'use strict';

const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const wrap = $('tankWrap');
const bgCanvas = $('bg');
const glCanvas = $('gl');
const gpuCanvas = $('gpu');
const canvas = $('tank');
const ctx = canvas.getContext('2d');

// ---------------------------------------------------------------------------
// World: a 3 m tall tank, 10 cm thick (thickness only matters for litre readouts).
// The aspect ratio is fixed at load; grid resolution comes from the engine + quality.
// ---------------------------------------------------------------------------
const TANK_H = 3.0;
const DEPTH = 0.1;
const r0 = wrap.getBoundingClientRect();
const ASPECT = clamp((r0.width || 960) / (r0.height || 600), 0.8, 2.0);
const SMALL = window.innerWidth < 700;
const HAS_WEBGPU = !!navigator.gpu;

// field: water-surface buffer resolution relative to CSS pixels
const QUALITY = {
  cpu: {
    low:   { ny: 54,  cap: 9000,   field: 0.5 },
    mid:   { ny: 76,  cap: 18000,  field: 0.65 },
    high:  { ny: 100, cap: 32000,  field: 0.8 },
    ultra: { ny: 130, cap: 56000,  field: 1.0 },
  },
  gpu: {
    low:   { ny: 90,  cap: 40000,  field: 0.7 },
    mid:   { ny: 130, cap: 90000,  field: 0.85 },
    high:  { ny: 170, cap: 150000, field: 1.0 },
    ultra: { ny: 230, cap: 260000, field: 1.0 },
  },
};
const prefs = { engine: HAS_WEBGPU ? 'gpu' : 'cpu', quality: { cpu: SMALL ? 'mid' : 'high', gpu: SMALL ? 'low' : 'mid' } };
try {
  const saved = JSON.parse(localStorage.getItem('flowtank.prefs') || 'null');
  if (saved) {
    if (saved.engine === 'cpu' || (saved.engine === 'gpu' && HAS_WEBGPU)) prefs.engine = saved.engine;
    for (const k of ['cpu', 'gpu']) if (saved.quality && QUALITY[k][saved.quality[k]]) prefs.quality[k] = saved.quality[k];
  }
} catch (e) { /* storage unavailable */ }
function savePrefs() { try { localStorage.setItem('flowtank.prefs', JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ } }

const REST_DENSITY = 1 / (0.6 * 0.3 * Math.sqrt(3)) * 0.92;   // particles per cell at rest (hex packing at spacing 2r)
const KERNEL = 3.2;                                          // surface splat radius in particle radii

// ---------------------------------------------------------------------------
// Obstacles: a signed distance field at twice the grid resolution (metres,
// positive in open water). Brush strokes edit it directly; both engines read it.
// ---------------------------------------------------------------------------
class ObstacleField {
  constructor(nx, ny, h) {
    this.nx = nx; this.ny = ny; this.h = h;
    this.solid = new Uint8Array(nx * ny);
    this.s = new Float32Array(nx * ny);
    this.fnx = nx * 2; this.fny = ny * 2; this.fh = h / 2;
    this.sdf = new Float32Array(this.fnx * this.fny);
    this.clear();
  }

  borderSDF(x, y) {
    const h = this.h;
    return Math.min(x - h, (this.nx - 1) * h - x, y - h, (this.ny - 1) * h - y);
  }

  clear() {
    const { fnx, fny, fh, sdf } = this;
    for (let i = 0; i < fnx; i++) for (let j = 0; j < fny; j++) sdf[i * fny + j] = this.borderSDF((i + 0.5) * fh, (j + 0.5) * fh);
    this.updateSolids();
  }

  // Grid cells whose centre lies inside an obstacle become solid for the pressure solve.
  updateSolids(x0 = 0, y0 = 0, x1 = Infinity, y1 = Infinity) {
    const { nx, ny, h, solid, s } = this;
    const i0 = Math.max(0, Math.floor(x0 / h) - 1), i1 = Math.min(nx - 1, Math.ceil(x1 / h) + 1);
    const j0 = Math.max(0, Math.floor(y0 / h) - 1), j1 = Math.min(ny - 1, Math.ceil(y1 / h) + 1);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const c = i * ny + j;
      const border = i === 0 || j === 0 || i === nx - 1 || j === ny - 1;
      solid[c] = border || this.sampleSDF((i + 0.5) * h, (j + 0.5) * h) < 0 ? 1 : 0;
      s[c] = solid[c] ? 0 : 1;
    }
  }

  // Union (add) or subtract a disc. Only nodes near the disc are touched.
  stampCircle(x, y, R, add) {
    const { fnx, fny, fh, sdf } = this, m = R + 3 * this.h;
    const i0 = Math.max(0, Math.floor((x - m) / fh)), i1 = Math.min(fnx - 1, Math.ceil((x + m) / fh));
    const j0 = Math.max(0, Math.floor((y - m) / fh)), j1 = Math.min(fny - 1, Math.ceil((y + m) / fh));
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const px = (i + 0.5) * fh, py = (j + 0.5) * fh, d = Math.hypot(px - x, py - y) - R, c = i * fny + j;
      sdf[c] = add ? Math.min(sdf[c], d) : Math.min(Math.max(sdf[c], -d), this.borderSDF(px, py));
    }
    this.updateSolids(x - m, y - m, x + m, y + m);
  }

  stampBox(x0, y0, x1, y1) {
    const { fnx, fny, fh, sdf } = this, m = 3 * this.h;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, hx = (x1 - x0) / 2, hy = (y1 - y0) / 2;
    const i0 = Math.max(0, Math.floor((x0 - m) / fh)), i1 = Math.min(fnx - 1, Math.ceil((x1 + m) / fh));
    const j0 = Math.max(0, Math.floor((y0 - m) / fh)), j1 = Math.min(fny - 1, Math.ceil((y1 + m) / fh));
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const qx = Math.abs((i + 0.5) * fh - cx) - hx, qy = Math.abs((j + 0.5) * fh - cy) - hy;
      const d = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0), c = i * fny + j;
      sdf[c] = Math.min(sdf[c], d);
    }
    this.updateSolids(x0 - m, y0 - m, x1 + m, y1 + m);
  }

  // Copy obstacles from another field; where the old value only reflects the old tank wall, use the new wall.
  resampleFrom(old) {
    const { fnx, fny, fh, sdf } = this;
    for (let i = 0; i < fnx; i++) for (let j = 0; j < fny; j++) {
      const x = (i + 0.5) * fh, y = (j + 0.5) * fh;
      const v = old.sampleSDF(x, y), wall = old.borderSDF(x, y);
      sdf[i * fny + j] = Math.min(v >= wall - 1e-6 ? Infinity : v, this.borderSDF(x, y));
    }
    this.updateSolids();
  }

  sampleSDF(x, y) {
    const fny = this.fny, sdf = this.sdf, inv = 1 / this.fh;
    const fx = clamp(x * inv - 0.5, 0, this.fnx - 1.001);
    const fy = clamp(y * inv - 0.5, 0, fny - 1.001);
    const i = fx | 0, j = fy | 0, tx = fx - i, ty = fy - j, c = i * fny + j;
    return (1 - tx) * ((1 - ty) * sdf[c] + ty * sdf[c + 1]) + tx * ((1 - ty) * sdf[c + fny] + ty * sdf[c + fny + 1]);
  }
}

// ---------------------------------------------------------------------------
// CPU FLIP fluid: particles carry the water, a MAC grid enforces incompressibility.
// Grid index is i * ny + j, with j pointing up.
// ---------------------------------------------------------------------------
const FLUID = 0, AIR = 1, SOLID = 2;

class Flip {
  constructor(obs, maxP) {
    const nx = obs.nx, ny = obs.ny, h = obs.h;
    this.obs = obs;
    this.nx = nx; this.ny = ny; this.h = h; this.invH = 1 / h;
    const n = nx * ny;
    this.nCells = n;
    this.u = new Float32Array(n); this.v = new Float32Array(n);
    this.du = new Float32Array(n); this.dv = new Float32Array(n);
    this.prevU = new Float32Array(n); this.prevV = new Float32Array(n);
    this.s = obs.s;
    this.cellType = new Int32Array(n);
    this.density = new Float32Array(n);

    this.r = 0.3 * h;
    this.restDensity = REST_DENSITY;
    this.maxP = maxP; this.numP = 0;
    this.pos = new Float32Array(2 * maxP);
    this.vel = new Float32Array(2 * maxP);
    this.col = new Float32Array(3 * maxP);

    this.pInv = 1 / (2.2 * this.r);
    this.pnx = Math.floor(nx * h * this.pInv) + 1;
    this.pny = Math.floor(ny * h * this.pInv) + 1;
    const pc = this.pnx * this.pny;
    this.cellCount = new Int32Array(pc);
    this.firstCell = new Int32Array(pc + 1);
    this.cellIds = new Int32Array(maxP);

    this.gravity = -9.81;
    this.flipRatio = 0.9;
  }

  sampleSDF(x, y) { return this.obs.sampleSDF(x, y); }

  addParticle(x, y, vx, vy, r, g, b) {
    if (this.numP >= this.maxP) return false;
    const i = this.numP++;
    this.pos[2 * i] = x; this.pos[2 * i + 1] = y;
    this.vel[2 * i] = vx; this.vel[2 * i + 1] = vy;
    this.col[3 * i] = r; this.col[3 * i + 1] = g; this.col[3 * i + 2] = b;
    return true;
  }

  removeParticle(i) {
    const last = --this.numP;
    if (i === last) return;
    this.pos[2 * i] = this.pos[2 * last]; this.pos[2 * i + 1] = this.pos[2 * last + 1];
    this.vel[2 * i] = this.vel[2 * last]; this.vel[2 * i + 1] = this.vel[2 * last + 1];
    this.col[3 * i] = this.col[3 * last]; this.col[3 * i + 1] = this.col[3 * last + 1]; this.col[3 * i + 2] = this.col[3 * last + 2];
  }

  integrate(dt) {
    const { pos, vel } = this;
    const g = this.gravity * dt, vmax = 2 * this.h / dt, vmax2 = vmax * vmax;
    for (let i = 0; i < this.numP; i++) {
      let vx = vel[2 * i], vy = vel[2 * i + 1] + g;
      const s2 = vx * vx + vy * vy;
      if (s2 > vmax2) { const k = vmax / Math.sqrt(s2); vx *= k; vy *= k; }
      vel[2 * i] = vx; vel[2 * i + 1] = vy;
      pos[2 * i] += vx * dt; pos[2 * i + 1] += vy * dt;
    }
  }

  pushApart(iters) {
    const { pos, col, pnx, pny, pInv, cellCount, firstCell, cellIds } = this;
    const numP = this.numP, pc = pnx * pny;
    cellCount.fill(0);
    for (let i = 0; i < numP; i++) {
      const xi = clamp(Math.floor(pos[2 * i] * pInv), 0, pnx - 1);
      const yi = clamp(Math.floor(pos[2 * i + 1] * pInv), 0, pny - 1);
      cellCount[xi * pny + yi]++;
    }
    let first = 0;
    for (let c = 0; c < pc; c++) { first += cellCount[c]; firstCell[c] = first; }
    firstCell[pc] = first;
    for (let i = 0; i < numP; i++) {
      const xi = clamp(Math.floor(pos[2 * i] * pInv), 0, pnx - 1);
      const yi = clamp(Math.floor(pos[2 * i + 1] * pInv), 0, pny - 1);
      const c = xi * pny + yi;
      firstCell[c]--;
      cellIds[firstCell[c]] = i;
    }

    const minDist = 2 * this.r, minDist2 = minDist * minDist, mix = 0.002;
    for (let it = 0; it < iters; it++) {
      for (let i = 0; i < numP; i++) {
        const px = pos[2 * i], py = pos[2 * i + 1];
        const pxi = Math.floor(px * pInv), pyi = Math.floor(py * pInv);
        const x0 = Math.max(pxi - 1, 0), y0 = Math.max(pyi - 1, 0);
        const x1 = Math.min(pxi + 1, pnx - 1), y1 = Math.min(pyi + 1, pny - 1);
        for (let xi = x0; xi <= x1; xi++) {
          for (let yi = y0; yi <= y1; yi++) {
            const c = xi * pny + yi;
            for (let k = firstCell[c], end = firstCell[c + 1]; k < end; k++) {
              const id = cellIds[k];
              if (id === i) continue;
              let dx = pos[2 * id] - pos[2 * i], dy = pos[2 * id + 1] - pos[2 * i + 1];
              const d2 = dx * dx + dy * dy;
              if (d2 > minDist2 || d2 === 0) continue;
              const d = Math.sqrt(d2), s = 0.5 * (minDist - d) / d;
              dx *= s; dy *= s;
              pos[2 * i] -= dx; pos[2 * i + 1] -= dy;
              pos[2 * id] += dx; pos[2 * id + 1] += dy;
              for (let ch = 0; ch < 3; ch++) {
                const a = col[3 * i + ch], b = col[3 * id + ch], m = (a + b) * 0.5;
                col[3 * i + ch] = a + (m - a) * mix;
                col[3 * id + ch] = b + (m - b) * mix;
              }
            }
          }
        }
      }
    }
  }

  collisions() {
    const { pos, vel, r, h } = this;
    const minX = h + r, maxX = (this.nx - 1) * h - r, minY = h + r, maxY = (this.ny - 1) * h - r;
    const e = 0.3 * h;
    for (let i = this.numP - 1; i >= 0; i--) {
      let x = pos[2 * i], y = pos[2 * i + 1];
      const d = this.sampleSDF(x, y);
      if (d < r) {
        if (d < -2.5 * h) { this.removeParticle(i); continue; }
        let gx = this.sampleSDF(x + e, y) - this.sampleSDF(x - e, y);
        let gy = this.sampleSDF(x, y + e) - this.sampleSDF(x, y - e);
        const len = Math.sqrt(gx * gx + gy * gy);
        if (len > 1e-9) {
          gx /= len; gy /= len;
          const push = r - d;
          x += gx * push; y += gy * push;
          const vn = vel[2 * i] * gx + vel[2 * i + 1] * gy;
          if (vn < 0) { vel[2 * i] -= vn * gx; vel[2 * i + 1] -= vn * gy; }
        }
      }
      if (x < minX) { x = minX; vel[2 * i] = 0; }
      if (x > maxX) { x = maxX; vel[2 * i] = 0; }
      if (y < minY) { y = minY; vel[2 * i + 1] = 0; }
      if (y > maxY) { y = maxY; vel[2 * i + 1] = 0; }
      pos[2 * i] = x; pos[2 * i + 1] = y;
    }
  }

  markCells() {
    const { pos, cellType, s, nx, ny, invH } = this;
    for (let c = 0; c < this.nCells; c++) cellType[c] = s[c] === 0 ? SOLID : AIR;
    for (let i = 0; i < this.numP; i++) {
      const xi = clamp(Math.floor(pos[2 * i] * invH), 0, nx - 1);
      const yi = clamp(Math.floor(pos[2 * i + 1] * invH), 0, ny - 1);
      const c = xi * ny + yi;
      if (cellType[c] === AIR) cellType[c] = FLUID;
    }
  }

  transfer(toGrid) {
    const { nx, ny, h, invH, u, v, du, dv, prevU, prevV, cellType, pos, vel } = this;
    const n = ny, h2 = 0.5 * h, numP = this.numP;
    if (toGrid) {
      du.fill(0); dv.fill(0); u.fill(0); v.fill(0);
      this.markCells();
    }
    for (let comp = 0; comp < 2; comp++) {
      const dx = comp === 0 ? 0 : h2, dy = comp === 0 ? h2 : 0;
      const f = comp === 0 ? u : v, pf = comp === 0 ? prevU : prevV, d = comp === 0 ? du : dv;
      const offset = comp === 0 ? n : 1;
      for (let p = 0; p < numP; p++) {
        const x = clamp(pos[2 * p], h, (nx - 1) * h), y = clamp(pos[2 * p + 1], h, (ny - 1) * h);
        const x0 = Math.min(Math.floor((x - dx) * invH), nx - 2), tx = ((x - dx) - x0 * h) * invH, x1 = Math.min(x0 + 1, nx - 2);
        const y0 = Math.min(Math.floor((y - dy) * invH), ny - 2), ty = ((y - dy) - y0 * h) * invH, y1 = Math.min(y0 + 1, ny - 2);
        const sx = 1 - tx, sy = 1 - ty;
        const d0 = sx * sy, d1 = tx * sy, d2 = tx * ty, d3 = sx * ty;
        const n0 = x0 * n + y0, n1 = x1 * n + y0, n2 = x1 * n + y1, n3 = x0 * n + y1;
        if (toGrid) {
          const pv = vel[2 * p + comp];
          f[n0] += pv * d0; d[n0] += d0;
          f[n1] += pv * d1; d[n1] += d1;
          f[n2] += pv * d2; d[n2] += d2;
          f[n3] += pv * d3; d[n3] += d3;
        } else {
          const v0 = cellType[n0] !== AIR || cellType[n0 - offset] !== AIR ? 1 : 0;
          const v1 = cellType[n1] !== AIR || cellType[n1 - offset] !== AIR ? 1 : 0;
          const v2 = cellType[n2] !== AIR || cellType[n2 - offset] !== AIR ? 1 : 0;
          const v3 = cellType[n3] !== AIR || cellType[n3 - offset] !== AIR ? 1 : 0;
          const ds = v0 * d0 + v1 * d1 + v2 * d2 + v3 * d3;
          if (ds > 0) {
            const pic = (v0 * d0 * f[n0] + v1 * d1 * f[n1] + v2 * d2 * f[n2] + v3 * d3 * f[n3]) / ds;
            const corr = (v0 * d0 * (f[n0] - pf[n0]) + v1 * d1 * (f[n1] - pf[n1]) + v2 * d2 * (f[n2] - pf[n2]) + v3 * d3 * (f[n3] - pf[n3])) / ds;
            const flip = vel[2 * p + comp] + corr;
            vel[2 * p + comp] = (1 - this.flipRatio) * pic + this.flipRatio * flip;
          }
        }
      }
      if (toGrid) for (let c = 0; c < this.nCells; c++) if (d[c] > 0) f[c] /= d[c];
    }
    if (toGrid) {
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
        const c = i * n + j, sol = cellType[c] === SOLID;
        if (sol || (i > 0 && cellType[c - n] === SOLID)) u[c] = 0;
        if (sol || (j > 0 && cellType[c - 1] === SOLID)) v[c] = 0;
      }
    }
  }

  updateDensity() {
    const { nx, ny, h, invH, pos, density } = this;
    const n = ny, h2 = 0.5 * h;
    density.fill(0);
    for (let p = 0; p < this.numP; p++) {
      const x = clamp(pos[2 * p], h, (nx - 1) * h), y = clamp(pos[2 * p + 1], h, (ny - 1) * h);
      const x0 = Math.floor((x - h2) * invH), tx = ((x - h2) - x0 * h) * invH, x1 = Math.min(x0 + 1, nx - 2);
      const y0 = Math.floor((y - h2) * invH), ty = ((y - h2) - y0 * h) * invH, y1 = Math.min(y0 + 1, ny - 2);
      const sx = 1 - tx, sy = 1 - ty;
      density[x0 * n + y0] += sx * sy;
      density[x1 * n + y0] += tx * sy;
      density[x1 * n + y1] += tx * ty;
      density[x0 * n + y1] += sx * ty;
    }
  }

  solve(iters, overRelax) {
    const { nx, ny, u, v, s, cellType, density, prevU, prevV } = this;
    const n = ny, rest = this.restDensity;
    prevU.set(u); prevV.set(v);
    for (let it = 0; it < iters; it++) {
      for (let i = 1; i < nx - 1; i++) {
        for (let j = 1; j < ny - 1; j++) {
          const c = i * n + j;
          if (cellType[c] !== FLUID) continue;
          const left = c - n, right = c + n, bottom = c - 1, top = c + 1;
          const sx0 = s[left], sx1 = s[right], sy0 = s[bottom], sy1 = s[top];
          const st = sx0 + sx1 + sy0 + sy1;
          if (st === 0) continue;
          let div = u[right] - u[c] + v[top] - v[c];
          const compression = density[c] - rest;
          if (compression > 0) div -= compression;
          const p = -div / st * overRelax;
          u[c] -= sx0 * p; u[right] += sx1 * p;
          v[c] -= sy0 * p; v[top] += sy1 * p;
        }
      }
    }
  }

  step(dt) {
    this.integrate(dt);
    this.pushApart(2);
    this.collisions();
    this.transfer(true);
    this.updateDensity();
    this.solve(32, 1.9);
    this.transfer(false);
  }

  maxSpeed() {
    let m = 0;
    for (let i = 0; i < this.numP; i++) {
      const vx = this.vel[2 * i], vy = this.vel[2 * i + 1], s = vx * vx + vy * vy;
      if (s > m) m = s;
    }
    return Math.sqrt(m);
  }
}

function speedRamp(sp, out, o) {
  const t = clamp(sp / 4.5, 0, 1);
  if (t < 0.5) { const k = t / 0.5; out[o] = 0.08 + 0.04 * k; out[o + 1] = 0.26 + 0.42 * k; out[o + 2] = 0.62 + 0.24 * k; }
  else { const k = (t - 0.5) / 0.5; out[o] = 0.12 + 0.82 * k; out[o + 1] = 0.68 + 0.28 * k; out[o + 2] = 0.86 + 0.13 * k; }
}

let viewMode = 'surface', colorMode = 'source';

// ---------------------------------------------------------------------------
// CPU engine: Flip on the main thread, drawn with WebGL2 (or Canvas 2D as a last resort).
// ---------------------------------------------------------------------------
class CpuEngine {
  constructor(key) {
    const q = QUALITY.cpu[key];
    this.kind = 'cpu'; this.key = key; this.q = q;
    this.ny = q.ny; this.nx = Math.round(q.ny * ASPECT); this.h = TANK_H / this.ny; this.width = this.nx * this.h;
    this.maxP = q.cap;
    this.obs = new ObstacleField(this.nx, this.ny, this.h);
    this.sim = new Flip(this.obs, q.cap);
    this.r = this.sim.r;
    this.restDensity = REST_DENSITY;
    this.particleArea = this.h * this.h / REST_DENSITY;
    this.dispCol = new Float32Array(3 * q.cap);
    this.drainedTotal = 0;
    this.canvasRenderer = getGLRenderer() ? null : makeCanvasRenderer(this);
  }
  get numP() { return this.sim.numP; }
  spawn(x, y, vx, vy, r, g, b) { return this.sim.addParticle(x, y, vx, vy, r, g, b); }
  clearWater() { this.sim.numP = 0; }
  obstaclesChanged() {
    const glr = getGLRenderer();
    if (glr) glr.uploadSDF(this); else this.canvasRenderer.drawObstacles();
  }

  step(dt, input) {
    const sim = this.sim;
    sim.gravity = input.gravity; sim.flipRatio = input.flipRatio;
    if (input.brush) this.applyBrush(input.brush);
    const sub = clamp(Math.ceil(sim.maxSpeed() * dt / (2 * this.h)), 1, 3);
    for (let k = 0; k < sub; k++) sim.step(dt / sub);
    this.drain(dt, input.drains);
  }

  applyBrush(b) {
    const sim = this.sim, { pos, vel } = sim, R2 = b.R * b.R;
    if (b.mode === 'stir') {
      for (let i = 0; i < sim.numP; i++) {
        const dx = pos[2 * i] - b.x, dy = pos[2 * i + 1] - b.y, q = dx * dx + dy * dy;
        if (q > R2) continue;
        const w = (1 - Math.sqrt(q) / b.R) * 0.35;
        vel[2 * i] += (b.vx - vel[2 * i]) * w;
        vel[2 * i + 1] += (b.vy - vel[2 * i + 1]) * w;
      }
    } else {
      for (let i = sim.numP - 1; i >= 0; i--) {
        const dx = pos[2 * i] - b.x, dy = pos[2 * i + 1] - b.y;
        if (dx * dx + dy * dy < R2) sim.removeParticle(i);
      }
    }
  }

  drain(dt, drains) {
    const sim = this.sim, { pos, vel } = sim;
    for (const d of drains) {
      const r2 = d.r * d.r, reach = d.r * 2.6, reach2 = reach * reach;
      for (let i = sim.numP - 1; i >= 0; i--) {
        const dx = pos[2 * i] - d.x, dy = pos[2 * i + 1] - d.y, q = dx * dx + dy * dy;
        if (q < r2) { sim.removeParticle(i); this.drainedTotal++; continue; }
        if (d.pull > 0 && q < reach2) {
          const dist = Math.sqrt(q), f = d.pull * (1 - dist / reach) * 14 * dt;
          vel[2 * i] -= dx / dist * f; vel[2 * i + 1] -= dy / dist * f;
        }
      }
    }
  }

  relax() { for (let k = 0; k < 4; k++) { this.sim.pushApart(2); this.sim.collisions(); } }

  render() {
    const { vel, col } = this.sim, out = this.dispCol;
    for (let p = 0; p < this.sim.numP; p++) {
      const vx = vel[2 * p], vy = vel[2 * p + 1], sp = Math.sqrt(vx * vx + vy * vy), o = 3 * p;
      if (colorMode === 'speed') { speedRamp(sp, out, o); continue; }
      const f = smooth(2.6, 5.5, sp) * 0.55;          // fast water whitens like aerated foam
      out[o] = col[o] + (1 - col[o]) * f;
      out[o + 1] = col[o + 1] + (1 - col[o + 1]) * f;
      out[o + 2] = col[o + 2] + (1 - col[o + 2]) * f;
    }
    const glr = getGLRenderer();
    if (glr) glr.draw(this); else this.canvasRenderer.draw();
  }

  async exportParticles() {
    const n = this.sim.numP;
    return { n, r: this.r, pos: this.sim.pos.slice(0, 2 * n), vel: this.sim.vel.slice(0, 2 * n), col: this.sim.col.slice(0, 3 * n) };
  }

  destroy() {}
}

// ---------------------------------------------------------------------------
// WebGL2 renderer for the CPU engine: particles are splatted as smooth kernels
// into a half-float field, then a full-resolution pass extracts a shaded surface.
// ---------------------------------------------------------------------------
let glrState;   // undefined: not tried yet, null: unavailable
function getGLRenderer() {
  if (glrState === undefined) {
    try { glrState = createGLRenderer(); } catch (err) { console.warn('WebGL2 renderer unavailable:', err); glrState = null; }
  }
  return glrState;
}

function createGLRenderer() {
  const gl = glCanvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl || !gl.getExtension('EXT_color_buffer_float')) return null;

  const shader = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
      const name = gl.getActiveUniform(p, i).name;
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  };

  const QUAD_VS = `#version 300 es
layout(location=0) in vec2 aP; out vec2 vUV;
void main(){ vUV = aP * 0.5 + 0.5; gl_Position = vec4(aP, 0.0, 1.0); }`;
  const POINT_VS = `#version 300 es
layout(location=0) in vec2 aPos; layout(location=1) in vec3 aCol;
uniform vec2 uWorld; uniform float uSize; out vec3 vCol;
void main(){ gl_Position = vec4(aPos / uWorld * 2.0 - 1.0, 0.0, 1.0); gl_PointSize = uSize; vCol = aCol; }`;

  const splat = program(POINT_VS, `#version 300 es
precision highp float; in vec3 vCol; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float d2 = dot(q, q);
  if (d2 >= 1.0) discard;
  float w = 1.0 - d2; w = w * w * w;
  o = vec4(vCol * w, w);
}`);

  const dots = program(POINT_VS, `#version 300 es
precision highp float; in vec3 vCol; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float d2 = dot(q, q);
  float a = 1.0 - smoothstep(0.75, 1.0, d2);
  if (a <= 0.0) discard;
  vec3 c = vCol * (0.8 + 0.3 * (1.0 - d2));
  o = vec4(c * a, a);
}`);

  const surface = program(QUAD_VS, `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uField; uniform vec2 uTexel; uniform float uNorm; uniform float uBump;
const float T = 0.33;
void main(){
  vec4 f = texture(uField, vUV);
  float d = f.a * uNorm;
  float a = clamp((d - T) / max(fwidth(d), 1e-4) + 0.5, 0.0, 1.0);
  if (a <= 0.0) { o = vec4(0.0); return; }
  vec3 col = f.rgb / max(f.a, 1e-5);
  vec2 e = uTexel * 1.5;
  float dl = texture(uField, vUV - vec2(e.x, 0.0)).a, dr = texture(uField, vUV + vec2(e.x, 0.0)).a;
  float db = texture(uField, vUV - vec2(0.0, e.y)).a, dt = texture(uField, vUV + vec2(0.0, e.y)).a;
  float nearSurface = 1.0 - smoothstep(T, T + 0.55, d);   // keep the interior flat; tilt normals only at the surface
  vec3 n = normalize(vec3(-vec2(dr - dl, dt - db) * uNorm * uBump * nearSurface, 1.0));
  float thick = smoothstep(0.45, 1.1, d);
  vec3 base = col * mix(1.04, 0.74, thick);
  float edge = 1.0 - smoothstep(T, T + 0.2, d);
  vec3 L = normalize(vec3(-0.45, 0.75, 0.55));
  float diff = clamp(dot(n, L), 0.0, 1.0);
  float spec = pow(clamp(dot(n, normalize(L + vec3(0.0, 0.0, 1.0))), 0.0, 1.0), 48.0);
  vec3 c = base * (0.70 + 0.40 * diff) + edge * 0.42 * (vec3(1.0) - base) + spec * 0.5;
  float alpha = a * mix(0.80, 0.94, thick);
  o = vec4(min(c, vec3(1.0)) * alpha, alpha);
}`);

  const rock = program(QUAD_VS, `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uSdf; uniform vec2 uWorld; uniform float uPx; uniform vec2 uE; uniform float uBevel;
float S(vec2 uv){ return texture(uSdf, uv).r; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  float d = S(vUV);
  float a = clamp(0.5 - d / uPx, 0.0, 1.0);
  if (a <= 0.0) { o = vec4(0.0); return; }
  vec2 g = vec2(S(vUV + vec2(uE.x, 0.0)) - S(vUV - vec2(uE.x, 0.0)), S(vUV + vec2(0.0, uE.y)) - S(vUV - vec2(0.0, uE.y)));
  g /= max(length(g), 1e-6);
  float bevel = 1.0 - smoothstep(0.0, uBevel, -d);
  float light = dot(g, vec2(-0.5, 0.866)) * bevel;
  vec2 w = vUV * uWorld;
  float grain = hash(floor(w * 220.0)) * 0.6 + hash(floor(w * 45.0)) * 0.4;
  float base = 0.42 + (grain - 0.5) * 0.07 + light * 0.24 - (1.0 - bevel) * 0.035;
  vec3 c = vec3(base, base * 1.03, base * 1.015);
  o = vec4(c * a, a);
}`);

  const quadVAO = gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const ptVAO = gl.createVertexArray();
  gl.bindVertexArray(ptVAO);
  const posBuf = gl.createBuffer(), colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  const maxPoint = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];
  const texParams = (filter) => {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  };

  let fieldTex = null, fbo = null, fw = 0, fh = 0;
  function ensureField(w, h) {
    if (w === fw && h === fh) return;
    if (fieldTex) { gl.deleteTexture(fieldTex); gl.deleteFramebuffer(fbo); }
    fieldTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fieldTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    texParams(gl.LINEAR);
    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fieldTex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) throw new Error('half-float framebuffer unsupported');
    fw = w; fh = h;
  }

  const sdfTex = gl.createTexture();
  let sdfBuf = new Float32Array(0);
  function uploadSDF(e) {
    const { fnx: nx, fny: ny, sdf } = e.obs;
    if (sdfBuf.length !== nx * ny) sdfBuf = new Float32Array(nx * ny);
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) sdfBuf[j * nx + i] = sdf[i * ny + j];
    gl.bindTexture(gl.TEXTURE_2D, sdfTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, nx, ny, 0, gl.RED, gl.FLOAT, sdfBuf);
    texParams(gl.LINEAR);
  }

  function draw(e) {
    const sim = e.sim, n = sim.numP, W = e.width;
    const tyGL = view.ch - (view.ty + view.th);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, view.cw, view.ch);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, sim.pos.subarray(0, 2 * n), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferData(gl.ARRAY_BUFFER, e.dispCol.subarray(0, 3 * n), gl.DYNAMIC_DRAW);

    if (viewMode === 'surface') {
      const w = Math.max(16, Math.round(view.tw / view.dpr * e.q.field)), h = Math.max(16, Math.round(view.th / view.dpr * e.q.field));
      ensureField(w, h);
      const kr = KERNEL * sim.r;
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.viewport(0, 0, w, h);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(splat.p);
      gl.uniform2f(splat.u.uWorld, W, TANK_H);
      gl.uniform1f(splat.u.uSize, Math.min(maxPoint, 2 * kr * w / W));
      gl.bindVertexArray(ptVAO);
      gl.drawArrays(gl.POINTS, 0, n);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(view.tx, tyGL, view.tw, view.th);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(surface.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fieldTex);
      gl.uniform1i(surface.u.uField, 0);
      gl.uniform2f(surface.u.uTexel, 1 / w, 1 / h);
      // field value deep inside water: particle density × ∫(1-q²)³ over the splat disc
      gl.uniform1f(surface.u.uNorm, 1 / (REST_DENSITY / (e.h * e.h) * Math.PI * kr * kr / 4));
      gl.uniform1f(surface.u.uBump, kr * w / W * 0.5);
      gl.bindVertexArray(quadVAO);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    } else {
      gl.viewport(view.tx, tyGL, view.tw, view.th);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(dots.p);
      gl.uniform2f(dots.u.uWorld, W, TANK_H);
      gl.uniform1f(dots.u.uSize, Math.min(maxPoint, Math.max(2, 2 * sim.r * view.s)));
      gl.bindVertexArray(ptVAO);
      gl.drawArrays(gl.POINTS, 0, n);
    }

    gl.viewport(view.tx, tyGL, view.tw, view.th);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(rock.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sdfTex);
    gl.uniform1i(rock.u.uSdf, 0);
    gl.uniform2f(rock.u.uWorld, W, TANK_H);
    gl.uniform1f(rock.u.uPx, 1 / view.s);
    gl.uniform2f(rock.u.uE, 0.5 / e.obs.fnx, 0.5 / e.obs.fny);
    gl.uniform1f(rock.u.uBevel, 0.03);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
  }

  ensureField(64, 64);   // fail early if half-float targets are missing
  return { uploadSDF, draw };
}

// ---------------------------------------------------------------------------
// Canvas 2D fallback renderer for browsers without WebGL2.
// ---------------------------------------------------------------------------
function makeCanvasRenderer(e) {
  const NX = e.nx, NY = e.ny, CELL = e.h, sim = e.sim, obs = e.obs;
  const OF = 4, OW = NX * OF, OH = NY * OF;
  const obsLayer = document.createElement('canvas'); obsLayer.width = OW; obsLayer.height = OH;
  const obsCtx = obsLayer.getContext('2d'), obsImg = obsCtx.createImageData(OW, OH);
  const RF = 3, RW = NX * RF, RH = NY * RF, RN = RW * RH;
  const fD = new Float32Array(RN), fR = new Float32Array(RN), fG = new Float32Array(RN), fB = new Float32Array(RN), fT = new Float32Array(RN);
  const waterLayer = document.createElement('canvas'); waterLayer.width = RW; waterLayer.height = RH;
  const waterCtx = waterLayer.getContext('2d'), waterImg = waterCtx.createImageData(RW, RH);

  function drawObstacles() {
    const data = obsImg.data, tex = CELL / OF, ep = 0.35 * CELL;
    for (let py = 0; py < OH; py++) {
      const y = TANK_H - (py + 0.5) * tex;
      for (let px = 0; px < OW; px++) {
        const x = (px + 0.5) * tex, o = 4 * (py * OW + px);
        const d = obs.sampleSDF(x, y);
        const a = clamp(0.5 - d / tex, 0, 1);
        if (a <= 0) { data[o + 3] = 0; continue; }
        let gx = obs.sampleSDF(x + ep, y) - obs.sampleSDF(x - ep, y);
        let gy = obs.sampleSDF(x, y + ep) - obs.sampleSDF(x, y - ep);
        const len = Math.hypot(gx, gy) || 1; gx /= len; gy /= len;
        const bevel = 1 - smooth(0, 0.03, -d);
        const light = (gx * -0.5 + gy * 0.866) * bevel;
        const hsh = (Math.imul(px, 73856093) ^ Math.imul(py, 19349663)) >>> 0;
        const base = 112 + ((hsh % 1000) / 1000 - 0.5) * 12 + light * 62 - (1 - bevel) * 8;
        data[o] = base; data[o + 1] = base + 4; data[o + 2] = base + 2; data[o + 3] = a * 255;
      }
    }
    obsCtx.putImageData(obsImg, 0, 0);
  }

  function blur(a) {
    for (let j = 0; j < RH; j++) {
      const row = j * RW;
      fT[row] = a[row]; fT[row + RW - 1] = a[row + RW - 1];
      for (let i = 1; i < RW - 1; i++) fT[row + i] = (a[row + i - 1] + 2 * a[row + i] + a[row + i + 1]) * 0.25;
    }
    for (let i = 0; i < RW; i++) { a[i] = fT[i]; a[RN - RW + i] = fT[RN - RW + i]; }
    for (let j = 1; j < RH - 1; j++) {
      const row = j * RW;
      for (let i = 0; i < RW; i++) a[row + i] = (fT[row + i - RW] + 2 * fT[row + i] + fT[row + i + RW]) * 0.25;
    }
  }

  function drawWater() {
    fD.fill(0); fR.fill(0); fG.fill(0); fB.fill(0);
    const pos = sim.pos, k = RF / CELL, dispCol = e.dispCol;
    for (let p = 0; p < sim.numP; p++) {
      const gx = pos[2 * p] * k - 0.5, gy = (TANK_H - pos[2 * p + 1]) * k - 0.5;
      const i0 = clamp(Math.floor(gx), 0, RW - 2), j0 = clamp(Math.floor(gy), 0, RH - 2);
      const tx = clamp(gx - i0, 0, 1), ty = clamp(gy - j0, 0, 1);
      const r = dispCol[3 * p], g = dispCol[3 * p + 1], b = dispCol[3 * p + 2], c0 = j0 * RW + i0;
      const w0 = (1 - tx) * (1 - ty), w1 = tx * (1 - ty), w2 = (1 - tx) * ty, w3 = tx * ty;
      fD[c0] += w0; fD[c0 + 1] += w1; fD[c0 + RW] += w2; fD[c0 + RW + 1] += w3;
      fR[c0] += w0 * r; fR[c0 + 1] += w1 * r; fR[c0 + RW] += w2 * r; fR[c0 + RW + 1] += w3 * r;
      fG[c0] += w0 * g; fG[c0 + 1] += w1 * g; fG[c0 + RW] += w2 * g; fG[c0 + RW + 1] += w3 * g;
      fB[c0] += w0 * b; fB[c0 + 1] += w1 * b; fB[c0 + RW] += w2 * b; fB[c0 + RW + 1] += w3 * b;
    }
    for (let pass = 0; pass < 2; pass++) { blur(fD); blur(fR); blur(fG); blur(fB); }
    const data = waterImg.data, norm = REST_DENSITY / (RF * RF);
    for (let c = 0; c < RN; c++) {
      const o = 4 * c, dens = fD[c], d = dens / norm;
      if (d < 0.12) { data[o + 3] = 0; continue; }
      const inv = 1 / dens, m = (1 - smooth(0.34, 0.62, d)) * 0.42;
      data[o] = (fR[c] * inv + (1 - fR[c] * inv) * m) * 255;
      data[o + 1] = (fG[c] * inv + (1 - fG[c] * inv) * m) * 255;
      data[o + 2] = (fB[c] * inv + (1 - fB[c] * inv) * m) * 255;
      data[o + 3] = smooth(0.14, 0.34, d) * 228;
    }
    waterCtx.putImageData(waterImg, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(waterLayer, view.tx, view.ty, view.tw, view.th);
  }

  function drawParticles() {
    const pos = sim.pos, dispCol = e.dispCol, size = Math.max(1.5, 1.7 * sim.r * view.s), half = size / 2;
    for (let p = 0; p < sim.numP; p++) {
      ctx.fillStyle = `rgb(${dispCol[3 * p] * 255 | 0},${dispCol[3 * p + 1] * 255 | 0},${dispCol[3 * p + 2] * 255 | 0})`;
      ctx.fillRect(sx(pos[2 * p]) - half, sy(pos[2 * p + 1]) - half, size, size);
    }
  }

  function draw() {
    if (viewMode === 'surface') drawWater(); else drawParticles();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(obsLayer, view.tx, view.ty, view.tw, view.th);
  }
  return { draw, drawObstacles };
}

// ---------------------------------------------------------------------------
// WebGPU engine: the whole FLIP step runs in compute shaders.
//   P2G uses fixed-point atomics, the pressure solve is red-black Gauss-Seidel,
//   neighbour search uses fixed-size bins, and dead particles are removed each
//   frame with a prefix-sum compaction, so the particle list stays dense on the GPU.
// ---------------------------------------------------------------------------
const MAX_GPU_DRAINS = 16;
const PRESSURE_ITERS_GPU = 40;

const SIM_WGSL = /* wgsl */`
struct Params {
  nx: u32, ny: u32, pnx: u32, pny: u32,
  fnx: u32, fny: u32, maxP: u32, numDrains: u32,
  h: f32, invH: f32, fh: f32, r: f32,
  dt: f32, gravity: f32, flipRatio: f32, rest: f32,
  worldW: f32, worldH: f32, pInv: f32, overRelax: f32,
  brushMode: u32, numSpawn: u32, frameDt: f32, vmax: f32,
  brush: vec4f,
  brushVel: vec4f,
  drains: array<vec4f, 16>,
};
struct Particle { pos: vec2f, vel: vec2f, col: vec4f };

@group(0) @binding(0) var<uniform> P: Params;
@group(0) @binding(1) var<storage, read_write> parts: array<Particle>;
@group(0) @binding(2) var<storage, read_write> scratch: array<Particle>;
// ctr: [0] particle count, [1] drained total, [2] compacted count, [4..4+maxP) scan flags, then block sums
@group(0) @binding(3) var<storage, read_write> ctr: array<atomic<u32>>;
@group(0) @binding(4) var<storage, read_write> spawnBuf: array<Particle>;
// bins: per-bin counts, then K particle ids per bin
@group(0) @binding(5) var<storage, read_write> bins: array<atomic<u32>>;
// gi sections (n cells each): uSum, uW, vSum, vW, density, fluid flag  (fixed point)
@group(0) @binding(6) var<storage, read_write> gi: array<atomic<i32>>;
// gf sections: u, v, prevU, prevV, density, s (open=1), cellType
@group(0) @binding(7) var<storage, read_write> gf: array<f32>;
@group(0) @binding(8) var<storage, read_write> sdf: array<f32>;

const K: u32 = 8u;
const SCALE: f32 = 65536.0;
const CT_FLUID: f32 = 0.0;
const CT_AIR: f32 = 1.0;
const CT_SOLID: f32 = 2.0;
override PARITY: u32 = 0u;

fn ncell() -> u32 { return P.nx * P.ny; }
fn alive(i: u32) -> bool { return i < atomicLoad(&ctr[0]) && parts[i].col.w > 0.5; }

fn sdfAt(p: vec2f) -> f32 {
  let fx = clamp(p.x / P.fh - 0.5, 0.0, f32(P.fnx) - 1.001);
  let fy = clamp(p.y / P.fh - 0.5, 0.0, f32(P.fny) - 1.001);
  let i = u32(fx); let j = u32(fy);
  let tx = fx - f32(i); let ty = fy - f32(j);
  let c = i * P.fny + j;
  return mix(mix(sdf[c], sdf[c + 1u], ty), mix(sdf[c + P.fny], sdf[c + P.fny + 1u], ty), tx);
}

fn binOf(p: vec2f) -> u32 {
  let xi = u32(clamp(floor(p.x * P.pInv), 0.0, f32(P.pnx - 1u)));
  let yi = u32(clamp(floor(p.y * P.pInv), 0.0, f32(P.pny - 1u)));
  return xi * P.pny + yi;
}

struct W4 { c0: u32, c1: u32, c2: u32, c3: u32, w: vec4f };
fn bilin(px: f32, py: f32) -> W4 {
  let x0 = min(u32(floor(px * P.invH)), P.nx - 2u);
  let tx = (px - f32(x0) * P.h) * P.invH;
  let x1 = min(x0 + 1u, P.nx - 2u);
  let y0 = min(u32(floor(py * P.invH)), P.ny - 2u);
  let ty = (py - f32(y0) * P.h) * P.invH;
  let y1 = min(y0 + 1u, P.ny - 2u);
  let sx = 1.0 - tx; let sy = 1.0 - ty;
  return W4(x0 * P.ny + y0, x1 * P.ny + y0, x1 * P.ny + y1, x0 * P.ny + y1, vec4f(sx * sy, tx * sy, tx * ty, sx * ty));
}

fn clampToGrid(p: vec2f) -> vec2f {
  return vec2f(clamp(p.x, P.h, f32(P.nx - 1u) * P.h), clamp(p.y, P.h, f32(P.ny - 1u) * P.h));
}

fn addFixed(idx: u32, v: f32) { atomicAdd(&gi[idx], i32(round(v * SCALE))); }

@compute @workgroup_size(64) fn spawnParticles(@builtin(global_invocation_id) g: vec3u) {
  let k = g.x;
  if (k >= P.numSpawn) { return; }
  let idx = atomicAdd(&ctr[0], 1u);
  if (idx >= P.maxP) { atomicSub(&ctr[0], 1u); return; }
  parts[idx] = spawnBuf[k];
}

@compute @workgroup_size(64) fn integrate(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  var v = parts[i].vel;
  v.y += P.gravity * P.dt;
  let s = length(v);
  if (s > P.vmax) { v *= P.vmax / s; }
  parts[i].vel = v;
  parts[i].pos += v * P.dt;
}

@compute @workgroup_size(64) fn clearBins(@builtin(global_invocation_id) g: vec3u) {
  if (g.x < P.pnx * P.pny) { atomicStore(&bins[g.x], 0u); }
}

@compute @workgroup_size(64) fn binInsert(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  let b = binOf(parts[i].pos);
  let slot = atomicAdd(&bins[b], 1u);
  if (slot < K) { atomicStore(&bins[P.pnx * P.pny + b * K + slot], i); }
}

// Jacobi version of "push particles apart": each particle moves itself by half of every overlap.
@compute @workgroup_size(64) fn separate(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  let pi = parts[i].pos;
  var ci = parts[i].col;
  let minD = 2.0 * P.r;
  var disp = vec2f(0.0);
  let bx = i32(floor(pi.x * P.pInv));
  let by = i32(floor(pi.y * P.pInv));
  let nb = P.pnx * P.pny;
  for (var dx = -1; dx <= 1; dx++) {
    for (var dy = -1; dy <= 1; dy++) {
      let x = bx + dx; let y = by + dy;
      if (x < 0 || y < 0 || x >= i32(P.pnx) || y >= i32(P.pny)) { continue; }
      let b = u32(x) * P.pny + u32(y);
      let cnt = min(atomicLoad(&bins[b]), K);
      for (var k = 0u; k < cnt; k++) {
        let j = atomicLoad(&bins[nb + b * K + k]);
        if (j == i) { continue; }
        let d = parts[j].pos - pi;
        let d2 = dot(d, d);
        if (d2 >= minD * minD || d2 == 0.0) { continue; }
        let dist = sqrt(d2);
        disp -= d * (0.5 * (minD - dist) / dist);
        ci = vec4f(ci.rgb + (parts[j].col.rgb - ci.rgb) * 0.001, ci.w);
      }
    }
  }
  let len = length(disp);
  if (len > P.r) { disp *= P.r / len; }
  scratch[i].pos = pi + disp;
  scratch[i].col = ci;
}

@compute @workgroup_size(64) fn applySep(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  parts[i].pos = scratch[i].pos;
  parts[i].col = vec4f(scratch[i].col.rgb, 1.0);
}

@compute @workgroup_size(64) fn collide(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  var p = parts[i].pos;
  var v = parts[i].vel;
  let r = P.r; let h = P.h;
  let d = sdfAt(p);
  if (d < r) {
    if (d < -4.0 * h) { parts[i].col.w = 0.0; return; }
    let e = 0.3 * h;
    var gr = vec2f(sdfAt(p + vec2f(e, 0.0)) - sdfAt(p - vec2f(e, 0.0)), sdfAt(p + vec2f(0.0, e)) - sdfAt(p - vec2f(0.0, e)));
    let len = length(gr);
    if (len > 1e-9) {
      gr /= len;
      p += gr * (r - d);
      let vn = dot(v, gr);
      if (vn < 0.0) { v -= vn * gr; }
    }
  }
  let lo = vec2f(h + r);
  let hi = vec2f(f32(P.nx - 1u) * h - r, f32(P.ny - 1u) * h - r);
  if (p.x < lo.x) { p.x = lo.x; v.x = 0.0; }
  if (p.x > hi.x) { p.x = hi.x; v.x = 0.0; }
  if (p.y < lo.y) { p.y = lo.y; v.y = 0.0; }
  if (p.y > hi.y) { p.y = hi.y; v.y = 0.0; }
  parts[i].pos = p;
  parts[i].vel = v;
}

@compute @workgroup_size(64) fn clearGrid(@builtin(global_invocation_id) g: vec3u) {
  if (g.x < 6u * ncell()) { atomicStore(&gi[g.x], 0); }
}

@compute @workgroup_size(64) fn p2g(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  let n = ncell();
  let raw = parts[i].pos;
  let vel = parts[i].vel;
  let ci = u32(clamp(floor(raw.x * P.invH), 0.0, f32(P.nx - 1u)));
  let cj = u32(clamp(floor(raw.y * P.invH), 0.0, f32(P.ny - 1u)));
  atomicStore(&gi[5u * n + ci * P.ny + cj], 1);
  let p = clampToGrid(raw);
  let h2 = 0.5 * P.h;
  // u faces sit at (i*h, (j+0.5)*h), v faces at ((i+0.5)*h, j*h)
  let wu = bilin(p.x, p.y - h2);
  addFixed(wu.c0, vel.x * wu.w.x); addFixed(n + wu.c0, wu.w.x);
  addFixed(wu.c1, vel.x * wu.w.y); addFixed(n + wu.c1, wu.w.y);
  addFixed(wu.c2, vel.x * wu.w.z); addFixed(n + wu.c2, wu.w.z);
  addFixed(wu.c3, vel.x * wu.w.w); addFixed(n + wu.c3, wu.w.w);
  let wv = bilin(p.x - h2, p.y);
  addFixed(2u * n + wv.c0, vel.y * wv.w.x); addFixed(3u * n + wv.c0, wv.w.x);
  addFixed(2u * n + wv.c1, vel.y * wv.w.y); addFixed(3u * n + wv.c1, wv.w.y);
  addFixed(2u * n + wv.c2, vel.y * wv.w.z); addFixed(3u * n + wv.c2, wv.w.z);
  addFixed(2u * n + wv.c3, vel.y * wv.w.w); addFixed(3u * n + wv.c3, wv.w.w);
  let wd = bilin(p.x - h2, p.y - h2);
  addFixed(4u * n + wd.c0, wd.w.x); addFixed(4u * n + wd.c1, wd.w.y);
  addFixed(4u * n + wd.c2, wd.w.z); addFixed(4u * n + wd.c3, wd.w.w);
}

@compute @workgroup_size(64) fn gridNormalize(@builtin(global_invocation_id) g: vec3u) {
  let n = ncell();
  let c = g.x;
  if (c >= n) { return; }
  let i = c / P.ny; let j = c % P.ny;
  let s = gf[5u * n + c];
  let uw = f32(atomicLoad(&gi[n + c]));
  let vw = f32(atomicLoad(&gi[3u * n + c]));
  var u = 0.0; var v = 0.0;
  if (uw > 0.0) { u = f32(atomicLoad(&gi[c])) / uw; }
  if (vw > 0.0) { v = f32(atomicLoad(&gi[2u * n + c])) / vw; }
  var ct = CT_AIR;
  if (s == 0.0) { ct = CT_SOLID; } else if (atomicLoad(&gi[5u * n + c]) != 0) { ct = CT_FLUID; }
  if (s == 0.0 || (i > 0u && gf[5u * n + c - P.ny] == 0.0)) { u = 0.0; }
  if (s == 0.0 || (j > 0u && gf[5u * n + c - 1u] == 0.0)) { v = 0.0; }
  gf[c] = u; gf[n + c] = v;
  gf[2u * n + c] = u; gf[3u * n + c] = v;
  gf[4u * n + c] = f32(atomicLoad(&gi[4u * n + c])) / SCALE;
  gf[6u * n + c] = ct;
}

// Red-black Gauss-Seidel: same-colour cells never share a face, so they can update in parallel.
@compute @workgroup_size(8, 8) fn pressure(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x; let j = g.y;
  if (i < 1u || j < 1u || i >= P.nx - 1u || j >= P.ny - 1u || ((i + j) & 1u) != PARITY) { return; }
  let n = ncell(); let ny = P.ny;
  let c = i * ny + j;
  if (gf[6u * n + c] != CT_FLUID) { return; }
  let s0 = gf[5u * n + c - ny]; let s1 = gf[5u * n + c + ny];
  let s2 = gf[5u * n + c - 1u]; let s3 = gf[5u * n + c + 1u];
  let st = s0 + s1 + s2 + s3;
  if (st == 0.0) { return; }
  var div = gf[c + ny] - gf[c] + gf[n + c + 1u] - gf[n + c];
  let compression = gf[4u * n + c] - P.rest;
  if (compression > 0.0) { div -= compression; }
  let p = -div / st * P.overRelax;
  gf[c] -= s0 * p; gf[c + ny] += s1 * p;
  gf[n + c] -= s2 * p; gf[n + c + 1u] += s3 * p;
}

fn faceValid(c: u32, off: u32, n: u32) -> f32 {
  return select(0.0, 1.0, gf[6u * n + c] != CT_AIR || gf[6u * n + c - off] != CT_AIR);
}

fn gridToParticle(w: W4, cur: f32, sec: u32, prevSec: u32, off: u32) -> f32 {
  let n = ncell();
  let v = vec4f(faceValid(w.c0, off, n), faceValid(w.c1, off, n), faceValid(w.c2, off, n), faceValid(w.c3, off, n)) * w.w;
  let ds = v.x + v.y + v.z + v.w;
  if (ds <= 0.0) { return cur; }
  let f = vec4f(gf[sec + w.c0], gf[sec + w.c1], gf[sec + w.c2], gf[sec + w.c3]);
  let pf = vec4f(gf[prevSec + w.c0], gf[prevSec + w.c1], gf[prevSec + w.c2], gf[prevSec + w.c3]);
  let pic = dot(v, f) / ds;
  let corr = dot(v, f - pf) / ds;
  return mix(pic, cur + corr, P.flipRatio);
}

@compute @workgroup_size(64) fn g2p(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  let n = ncell();
  let p = clampToGrid(parts[i].pos);
  let h2 = 0.5 * P.h;
  var vel = parts[i].vel;
  vel.x = gridToParticle(bilin(p.x, p.y - h2), vel.x, 0u, 2u * n, P.ny);
  vel.y = gridToParticle(bilin(p.x - h2, p.y), vel.y, n, 3u * n, 1u);
  parts[i].vel = vel;
}

@compute @workgroup_size(64) fn drainPass(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (!alive(i)) { return; }
  let p = parts[i].pos;
  var v = parts[i].vel;
  for (var k = 0u; k < P.numDrains; k++) {
    let d = P.drains[k];
    let dv = p - d.xy;
    let q = dot(dv, dv);
    if (q < d.z * d.z) { parts[i].col.w = 0.0; atomicAdd(&ctr[1], 1u); return; }
    let reach = d.z * 2.6;
    if (d.w > 0.0 && q < reach * reach) {
      let dist = sqrt(q);
      v -= dv / dist * (d.w * (1.0 - dist / reach) * 14.0 * P.frameDt);
    }
  }
  if (P.brushMode != 0u) {
    let dv = p - P.brush.xy;
    let q = dot(dv, dv);
    let R = P.brush.z;
    if (q < R * R) {
      if (P.brushMode == 2u) { parts[i].col.w = 0.0; return; }
      v += (P.brushVel.xy - v) * ((1.0 - sqrt(q) / R) * 0.35);
    }
  }
  parts[i].vel = v;
}

// ---- compaction: scan alive flags, then scatter survivors to the front ----
var<workgroup> wg: array<u32, 256>;

@compute @workgroup_size(256) fn scanBlocks(@builtin(global_invocation_id) g: vec3u, @builtin(local_invocation_id) l: vec3u, @builtin(workgroup_id) w: vec3u) {
  let i = g.x;
  var a = 0u;
  if (i < P.maxP && alive(i)) { a = 1u; }
  wg[l.x] = a;
  workgroupBarrier();
  for (var off = 1u; off < 256u; off = off * 2u) {
    var t = 0u;
    if (l.x >= off) { t = wg[l.x - off]; }
    workgroupBarrier();
    wg[l.x] += t;
    workgroupBarrier();
  }
  let incl = wg[l.x];
  if (i < P.maxP) { atomicStore(&ctr[4u + i], (incl - a) | (a << 31u)); }
  if (l.x == 255u) { atomicStore(&ctr[4u + P.maxP + w.x], incl); }
}

@compute @workgroup_size(256) fn scanSums(@builtin(local_invocation_id) l: vec3u) {
  let nb = (P.maxP + 255u) / 256u;
  let chunk = (nb + 255u) / 256u;
  let base = 4u + P.maxP;
  let start = l.x * chunk;
  var sum = 0u;
  for (var k = 0u; k < chunk; k++) {
    let idx = start + k;
    if (idx < nb) { sum += atomicLoad(&ctr[base + idx]); }
  }
  wg[l.x] = sum;
  workgroupBarrier();
  for (var off = 1u; off < 256u; off = off * 2u) {
    var t = 0u;
    if (l.x >= off) { t = wg[l.x - off]; }
    workgroupBarrier();
    wg[l.x] += t;
    workgroupBarrier();
  }
  var run = wg[l.x] - sum;
  for (var k = 0u; k < chunk; k++) {
    let idx = start + k;
    if (idx < nb) {
      let v = atomicLoad(&ctr[base + idx]);
      atomicStore(&ctr[base + idx], run);
      run += v;
    }
  }
  if (l.x == 255u) { atomicStore(&ctr[2], wg[255]); }
}

@compute @workgroup_size(64) fn scatter(@builtin(global_invocation_id) g: vec3u) {
  let i = g.x;
  if (i >= P.maxP) { return; }
  let f = atomicLoad(&ctr[4u + i]);
  if ((f >> 31u) == 0u) { return; }
  let dst = (f & 0x7fffffffu) + atomicLoad(&ctr[4u + P.maxP + i / 256u]);
  scratch[dst] = parts[i];
}

@compute @workgroup_size(1) fn finalize() {
  atomicStore(&ctr[0], atomicLoad(&ctr[2]));
}
`;

const RENDER_WGSL = /* wgsl */`
struct Particle { pos: vec2f, vel: vec2f, col: vec4f };
struct RP {
  world: vec2f, kr: f32, mode: u32,
  norm: f32, bump: f32, showWater: u32, pxWorld: f32,
  texel: vec2f, fh: f32, fnx: u32,
  fny: u32, _a: u32, _b: u32, _c: u32,
};
@group(0) @binding(0) var<uniform> R: RP;
@group(0) @binding(1) var<storage, read> parts: array<Particle>;
@group(0) @binding(2) var<storage, read> ctr: array<u32>;
@group(0) @binding(3) var<storage, read> sdf: array<f32>;
@group(0) @binding(4) var fieldTex: texture_2d<f32>;
@group(0) @binding(5) var samp: sampler;

struct VO { @builtin(position) pos: vec4f, @location(0) q: vec2f, @location(1) col: vec3f };

fn dispColor(p: Particle) -> vec3f {
  let s = length(p.vel);
  if (R.mode == 1u) {
    let t = clamp(s / 4.5, 0.0, 1.0);
    if (t < 0.5) { let k = t / 0.5; return vec3f(0.08 + 0.04 * k, 0.26 + 0.42 * k, 0.62 + 0.24 * k); }
    let k = (t - 0.5) / 0.5;
    return vec3f(0.12 + 0.82 * k, 0.68 + 0.28 * k, 0.86 + 0.13 * k);
  }
  return mix(p.col.rgb, vec3f(1.0), smoothstep(2.6, 5.5, s) * 0.55);   // fast water whitens like foam
}

@vertex fn vsParticle(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VO {
  var corners = array<vec2f, 6>(vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0), vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0));
  var o: VO;
  let p = parts[ii];
  if (ii >= ctr[0] || p.col.w < 0.5) {
    o.pos = vec4f(2.0, 2.0, 0.0, 1.0); o.q = vec2f(0.0); o.col = vec3f(0.0);
    return o;
  }
  let c = corners[vi];
  let wp = p.pos + c * R.kr;
  o.pos = vec4f(wp / R.world * 2.0 - 1.0, 0.0, 1.0);
  o.q = c;
  o.col = dispColor(p);
  return o;
}

@fragment fn fsSplat(i: VO) -> @location(0) vec4f {
  let d2 = dot(i.q, i.q);
  if (d2 >= 1.0) { discard; }
  let w = (1.0 - d2) * (1.0 - d2) * (1.0 - d2);
  return vec4f(i.col * w, w);
}

@fragment fn fsDots(i: VO) -> @location(0) vec4f {
  let d2 = dot(i.q, i.q);
  let a = 1.0 - smoothstep(0.75, 1.0, d2);
  if (a <= 0.0) { discard; }
  return vec4f(i.col * (0.8 + 0.3 * (1.0 - d2)) * a, a);
}

struct QO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vsQuad(@builtin(vertex_index) vi: u32) -> QO {
  var ps = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var o: QO;
  o.pos = vec4f(ps[vi], 0.0, 1.0);
  o.uv = ps[vi] * 0.5 + 0.5;
  return o;
}

fn sdfAt(p: vec2f) -> f32 {
  let fx = clamp(p.x / R.fh - 0.5, 0.0, f32(R.fnx) - 1.001);
  let fy = clamp(p.y / R.fh - 0.5, 0.0, f32(R.fny) - 1.001);
  let i = u32(fx); let j = u32(fy);
  let tx = fx - f32(i); let ty = fy - f32(j);
  let c = i * R.fny + j;
  return mix(mix(sdf[c], sdf[c + 1u], ty), mix(sdf[c + R.fny], sdf[c + R.fny + 1u], ty), tx);
}
fn hash(p: vec2f) -> f32 { return fract(sin(dot(p, vec2f(12.9898, 78.233))) * 43758.5453); }

@fragment fn fsComposite(i: QO) -> @location(0) vec4f {
  let tuv = vec2f(i.uv.x, 1.0 - i.uv.y);
  let f = textureSampleLevel(fieldTex, samp, tuv, 0.0);
  let d = f.a * R.norm;
  let fw = fwidth(d);
  var water = vec4f(0.0);
  if (R.showWater == 1u && d > 0.05) {
    let T = 0.33;
    let a = clamp((d - T) / max(fw, 1e-4) + 0.5, 0.0, 1.0);
    let col = f.rgb / max(f.a, 1e-5);
    let e = R.texel * 1.5;
    let dl = textureSampleLevel(fieldTex, samp, tuv - vec2f(e.x, 0.0), 0.0).a;
    let dr = textureSampleLevel(fieldTex, samp, tuv + vec2f(e.x, 0.0), 0.0).a;
    let dt = textureSampleLevel(fieldTex, samp, tuv - vec2f(0.0, e.y), 0.0).a;
    let db = textureSampleLevel(fieldTex, samp, tuv + vec2f(0.0, e.y), 0.0).a;
    let nearSurface = 1.0 - smoothstep(T, T + 0.55, d);
    let n = normalize(vec3f(-vec2f(dr - dl, dt - db) * R.norm * R.bump * nearSurface, 1.0));
    let thick = smoothstep(0.45, 1.1, d);
    let base = col * mix(1.04, 0.74, thick);
    let edge = 1.0 - smoothstep(T, T + 0.2, d);
    let L = normalize(vec3f(-0.45, 0.75, 0.55));
    let diff = clamp(dot(n, L), 0.0, 1.0);
    let spec = pow(clamp(dot(n, normalize(L + vec3f(0.0, 0.0, 1.0))), 0.0, 1.0), 48.0);
    let c = base * (0.70 + 0.40 * diff) + edge * 0.42 * (vec3f(1.0) - base) + spec * 0.5;
    let alpha = a * mix(0.80, 0.94, thick);
    water = vec4f(min(c, vec3f(1.0)) * alpha, alpha);
  }
  let wp = i.uv * R.world;
  let sd = sdfAt(wp);
  var rock = vec4f(0.0);
  let ra = clamp(0.5 - sd / R.pxWorld, 0.0, 1.0);
  if (ra > 0.0) {
    let e = R.fh * 0.5;
    var g = vec2f(sdfAt(wp + vec2f(e, 0.0)) - sdfAt(wp - vec2f(e, 0.0)), sdfAt(wp + vec2f(0.0, e)) - sdfAt(wp - vec2f(0.0, e)));
    g = g / max(length(g), 1e-6);
    let bevel = 1.0 - smoothstep(0.0, 0.03, -sd);
    let light = dot(g, vec2f(-0.5, 0.866)) * bevel;
    let grain = hash(floor(wp * 220.0)) * 0.6 + hash(floor(wp * 45.0)) * 0.4;
    let b = 0.42 + (grain - 0.5) * 0.07 + light * 0.24 - (1.0 - bevel) * 0.035;
    rock = vec4f(vec3f(b, b * 1.03, b * 1.015) * ra, ra);
  }
  return rock + water * (1.0 - rock.a);
}
`;

let gpuDevicePromise = null;
let gpuContext = null;
function getGPUDevice() {
  if (!gpuDevicePromise) {
    gpuDevicePromise = (async () => {
      if (!navigator.gpu) throw new Error('WebGPU is not available');
      const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
      if (!adapter) throw new Error('No WebGPU adapter');
      const device = await adapter.requestDevice();
      device.lost.then((info) => {
        gpuDevicePromise = null; gpuContext = null;
        if (info.reason !== 'destroyed' && engine && engine.kind === 'gpu') {
          engineNote = 'GPU 連線中斷，已改用 CPU 運算。';
          rebuildEngine('cpu');
        }
      });
      return device;
    })();
    gpuDevicePromise.catch(() => { gpuDevicePromise = null; });
  }
  return gpuDevicePromise;
}

const gpuPipeCache = new WeakMap();
function getGPUPipelines(device) {
  let p = gpuPipeCache.get(device);
  if (p) return p;
  const C = GPUShaderStage.COMPUTE, V = GPUShaderStage.VERTEX, F = GPUShaderStage.FRAGMENT;
  const simModule = device.createShaderModule({ code: SIM_WGSL });
  const simBGL = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: C, buffer: { type: 'uniform' } },
      ...[1, 2, 3, 4, 5, 6, 7, 8].map((b) => ({ binding: b, visibility: C, buffer: { type: 'storage' } }))],
  });
  const simLayout = device.createPipelineLayout({ bindGroupLayouts: [simBGL] });
  const cp = (entryPoint, constants) => device.createComputePipeline({ layout: simLayout, compute: { module: simModule, entryPoint, constants } });

  const format = navigator.gpu.getPreferredCanvasFormat();
  const rmod = device.createShaderModule({ code: RENDER_WGSL });
  const partBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: V | F, buffer: { type: 'uniform' } },
      { binding: 1, visibility: V, buffer: { type: 'read-only-storage' } },
      { binding: 2, visibility: V, buffer: { type: 'read-only-storage' } },
    ],
  });
  const compBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: F, buffer: { type: 'uniform' } },
      { binding: 3, visibility: F, buffer: { type: 'read-only-storage' } },
      { binding: 4, visibility: F, texture: { sampleType: 'float' } },
      { binding: 5, visibility: F, sampler: { type: 'filtering' } },
    ],
  });
  const premult = { color: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' } };
  const additive = { color: { srcFactor: 'one', dstFactor: 'one', operation: 'add' }, alpha: { srcFactor: 'one', dstFactor: 'one', operation: 'add' } };
  const rp = (bgl, vs, fs, fmt, blend) => device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
    vertex: { module: rmod, entryPoint: vs },
    fragment: { module: rmod, entryPoint: fs, targets: [{ format: fmt, blend }] },
    primitive: { topology: 'triangle-list' },
  });

  p = {
    simBGL, format, partBGL, compBGL,
    spawn: cp('spawnParticles'), integrate: cp('integrate'), clearBins: cp('clearBins'), binInsert: cp('binInsert'),
    separate: cp('separate'), applySep: cp('applySep'), collide: cp('collide'), clearGrid: cp('clearGrid'),
    p2g: cp('p2g'), gridNormalize: cp('gridNormalize'), pressure0: cp('pressure', { PARITY: 0 }), pressure1: cp('pressure', { PARITY: 1 }),
    g2p: cp('g2p'), drain: cp('drainPass'), scanBlocks: cp('scanBlocks'), scanSums: cp('scanSums'), scatter: cp('scatter'), finalize: cp('finalize'),
    splat: rp(partBGL, 'vsParticle', 'fsSplat', 'rgba16float', additive),
    dots: rp(partBGL, 'vsParticle', 'fsDots', format, premult),
    composite: rp(compBGL, 'vsQuad', 'fsComposite', format, premult),
    sampler: device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge' }),
  };
  gpuPipeCache.set(device, p);
  return p;
}

class GpuEngine {
  static async create(key) {
    const device = await getGPUDevice();
    device.pushErrorScope('validation');
    const e = new GpuEngine(device, key);
    const err = await device.popErrorScope();
    if (err) { e.destroy(); throw new Error(err.message); }
    return e;
  }

  constructor(device, key) {
    const q = QUALITY.gpu[key];
    this.kind = 'gpu'; this.key = key; this.q = q; this.device = device;
    this.ny = q.ny; this.nx = Math.round(q.ny * ASPECT); this.h = TANK_H / this.ny; this.width = this.nx * this.h;
    this.maxP = q.cap;
    this.obs = new ObstacleField(this.nx, this.ny, this.h);
    this.r = 0.3 * this.h;
    this.restDensity = REST_DENSITY;
    this.particleArea = this.h * this.h / REST_DENSITY;
    this.substeps = clamp(Math.ceil(8 / (3 * this.h * 60)), 1, 4);   // keep up with ~8 m/s at 3 cells per substep
    this.pInv = 1 / (2.2 * this.r);
    this.pnx = Math.floor(this.width * this.pInv) + 1;
    this.pny = Math.floor(TANK_H * this.pInv) + 1;
    this.n = this.nx * this.ny;
    this.nb = Math.ceil(this.maxP / 256);
    this.numP = 0; this.drainedTotal = 0;
    this.pending = 0; this.spawnData = new Float32Array(this.maxP * 8);
    this.lastInput = { gravity: -9.81, flipRatio: 0.9, drains: [], brush: null };
    this.readPending = false;
    this.pipes = getGPUPipelines(device);

    const U = GPUBufferUsage;
    this.buffers = [];
    const buf = (size, usage) => {
      const b = device.createBuffer({ size: Math.max(16, Math.ceil(size / 4) * 4), usage });
      this.buffers.push(b);
      return b;
    };
    this.params = buf(384, U.UNIFORM | U.COPY_DST);
    this.parts = buf(this.maxP * 32, U.STORAGE | U.COPY_DST | U.COPY_SRC);
    this.scratch = buf(this.maxP * 32, U.STORAGE | U.COPY_SRC);
    this.ctr = buf((4 + this.maxP + this.nb) * 4, U.STORAGE | U.COPY_DST | U.COPY_SRC);
    this.spawnBuf = buf(this.maxP * 32, U.STORAGE | U.COPY_DST);
    this.bins = buf(this.pnx * this.pny * 9 * 4, U.STORAGE);
    this.gi = buf(6 * this.n * 4, U.STORAGE);
    this.gf = buf(7 * this.n * 4, U.STORAGE | U.COPY_DST);
    this.sdfBuf = buf(this.obs.fnx * this.obs.fny * 4, U.STORAGE | U.COPY_DST);
    this.readBuf = buf(16, U.MAP_READ | U.COPY_DST);
    this.rparams = buf(64, U.UNIFORM | U.COPY_DST);

    this.paramData = new ArrayBuffer(384);
    this.pu = new Uint32Array(this.paramData); this.pf = new Float32Array(this.paramData);
    this.rpData = new ArrayBuffer(64);
    this.ru = new Uint32Array(this.rpData); this.rf = new Float32Array(this.rpData);

    const entries = [this.params, this.parts, this.scratch, this.ctr, this.spawnBuf, this.bins, this.gi, this.gf, this.sdfBuf]
      .map((b, i) => ({ binding: i, resource: { buffer: b } }));
    this.simBG = device.createBindGroup({ layout: this.pipes.simBGL, entries });
    this.partBG = device.createBindGroup({
      layout: this.pipes.partBGL,
      entries: [{ binding: 0, resource: { buffer: this.rparams } }, { binding: 1, resource: { buffer: this.parts } }, { binding: 2, resource: { buffer: this.ctr } }],
    });
    this.fieldTex = null; this.fw = 0; this.fh = 0; this.compBG = null;

    if (!gpuContext) {
      gpuContext = gpuCanvas.getContext('webgpu');
      gpuContext.configure({ device, format: this.pipes.format, alphaMode: 'premultiplied' });
    }
    this.obstaclesChanged();
  }

  spawn(x, y, vx, vy, r, g, b) {
    if (this.numP + this.pending >= this.maxP) return false;
    const o = this.pending++ * 8, d = this.spawnData;
    d[o] = x; d[o + 1] = y; d[o + 2] = vx; d[o + 3] = vy; d[o + 4] = r; d[o + 5] = g; d[o + 6] = b; d[o + 7] = 1;
    return true;
  }

  clearWater() {
    this.pending = 0; this.numP = 0;
    this.device.queue.writeBuffer(this.ctr, 0, new Uint32Array([0]));
  }

  obstaclesChanged() {
    const q = this.device.queue;
    q.writeBuffer(this.sdfBuf, 0, this.obs.sdf);
    q.writeBuffer(this.gf, 5 * this.n * 4, this.obs.s);
  }

  writeParams(dt, input, numSpawn) {
    const pu = this.pu, pf = this.pf, drains = input.drains.slice(0, MAX_GPU_DRAINS);
    pu[0] = this.nx; pu[1] = this.ny; pu[2] = this.pnx; pu[3] = this.pny;
    pu[4] = this.obs.fnx; pu[5] = this.obs.fny; pu[6] = this.maxP; pu[7] = drains.length;
    pf[8] = this.h; pf[9] = 1 / this.h; pf[10] = this.obs.fh; pf[11] = this.r;
    const sdt = dt / this.substeps;
    pf[12] = sdt; pf[13] = input.gravity; pf[14] = input.flipRatio; pf[15] = REST_DENSITY;
    pf[16] = this.width; pf[17] = TANK_H; pf[18] = this.pInv; pf[19] = 1.9;
    const b = input.brush;
    pu[20] = b ? (b.mode === 'stir' ? 1 : 2) : 0; pu[21] = numSpawn; pf[22] = dt; pf[23] = 3 * this.h / sdt;
    pf[24] = b ? b.x : 0; pf[25] = b ? b.y : 0; pf[26] = b ? b.R : 0; pf[27] = 0;
    pf[28] = b ? b.vx : 0; pf[29] = b ? b.vy : 0; pf[30] = 0; pf[31] = 0;
    drains.forEach((d, k) => { pf[32 + 4 * k] = d.x; pf[33 + 4 * k] = d.y; pf[34 + 4 * k] = d.r; pf[35 + 4 * k] = d.pull; });
    this.device.queue.writeBuffer(this.params, 0, this.paramData);
  }

  // Upload queued particles and append them on the GPU.
  encodeSpawn(pass, numSpawn) {
    this.device.queue.writeBuffer(this.spawnBuf, 0, this.spawnData, 0, numSpawn * 8);
    pass.setPipeline(this.pipes.spawn);
    pass.dispatchWorkgroups(Math.ceil(numSpawn / 64));
    this.numP = Math.min(this.maxP, this.numP + numSpawn);
    this.pending = 0;
  }

  step(dt, input) {
    this.lastInput = input;
    const p = this.pipes, numSpawn = this.pending;
