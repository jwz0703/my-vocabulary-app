<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水流實驗槽</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: one-screen lab bench. The tank fills the left; a narrow control rail sits on the right and stacks under the tank on phones. */
:root {
  --bg: #e7ecea;
  --surface: #f5f7f6;
  --surface-2: #dfe6e3;
  --fg: #16201e;
  --muted: #566562;
  --line: #c9d3d0;
  --accent: #976214;
  --accent-soft: #f0e2c8;
  --on-accent: #ffffff;
  --danger: #b0402e;
  --tank-bezel: #cdd6d3;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1312; --surface: #161d1c; --surface-2: #1f2827; --fg: #e1e8e6; --muted: #8fa09c;
    --line: #2a3533; --accent: #d7a24a; --accent-soft: #3a2f1b; --on-accent: #1a1406; --danger: #e2735e;
    --tank-bezel: #1b2321; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1312; --surface: #161d1c; --surface-2: #1f2827; --fg: #e1e8e6; --muted: #8fa09c;
  --line: #2a3533; --accent: #d7a24a; --accent-soft: #3a2f1b; --on-accent: #1a1406; --danger: #e2735e;
  --tank-bezel: #1b2321; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font-ui);
}

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.bar {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 24px;
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.brand h1 {
  margin: 0;
  font: 700 22px/1.2 var(--font-display);
  letter-spacing: 0.06em;
}
.brand .sub { color: var(--muted); font: 12px/1.4 var(--font-data); letter-spacing: 0.04em; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-left: auto; }
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat .k { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
.stat .v { font: 500 13px/1 var(--font-data); font-variant-numeric: tabular-nums; min-width: 6ch; }
.transport { display: flex; gap: 6px; }

/* ---------- buttons ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font: 500 13px/1 var(--font-ui);
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: background-color 0.12s, border-color 0.12s;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .tool:focus-visible, .seg button:focus-visible, .swatch:focus-visible, .scene:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); min-width: 5.5em; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }

/* ---------- tank ---------- */
.tank-wrap {
  position: relative;
  min-height: 0;
  min-width: 0;
  border-radius: 10px;
  background: var(--tank-bezel);
  overflow: hidden;
}
.tank-wrap canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#bg, #gl { pointer-events: none; }
#tank { touch-action: none; cursor: crosshair; }
.hint {
  position: absolute;
  left: 12px;
  bottom: 12px;
  max-width: calc(100% - 24px);
  padding: 6px 10px;
  border-radius: 6px;
  background: rgba(8, 14, 18, 0.72);
  color: #dbe7ea;
  font-size: 12px;
  pointer-events: none;
}

/* ---------- control rail ---------- */
.rail {
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-right: 2px;
}
.rail section { display: flex; flex-direction: column; gap: 10px; }
.rail h2 {
  margin: 0;
  font: 500 11px/1 var(--font-ui);
  color: var(--muted);
  letter-spacing: 0.18em;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.tools { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.tool {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 9px 2px 7px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--fg);
  font: 500 12px/1.2 var(--font-ui);
  cursor: pointer;
}
.tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tool .key { position: absolute; top: 3px; right: 5px; font: 10px/1 var(--font-data); color: var(--muted); }
.tool:hover { border-color: var(--accent); }
.tool[aria-checked="true"] { background: var(--accent-soft); border-color: var(--accent); }
.tool[aria-checked="true"] svg { stroke: var(--accent); }

.field { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 8px; }
.field label { font-size: 13px; }
.field output { font: 12px/1 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.field input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; accent-color: var(--accent); }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button {
  appearance: none; border: 0; background: var(--surface); color: var(--fg);
  font: 500 12px/1 var(--font-ui); padding: 8px 4px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.seg-label { font-size: 13px; }

.dev { display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.dev-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dev-title { font-weight: 700; }
.dev-row { display: flex; gap: 6px; }
.dev-row .btn { flex: 1; }
.empty { margin: 0; color: var(--muted); font-size: 13px; }
.readout { margin: 0; font-size: 12px; color: var(--muted); }
.readout b { font: 500 13px/1 var(--font-data); color: var(--fg); font-variant-numeric: tabular-nums; }
.swatches { display: flex; gap: 8px; }
.swatch {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line);
  cursor: pointer; padding: 0;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }

.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.scene {
  appearance: none; text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 8px 10px; cursor: pointer; font: 500 13px/1.3 var(--font-ui);
}
.scene small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.scene:hover { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; }
  .tank-wrap { height: 62vh; min-height: 320px; }
  .rail { overflow: visible; }
  .stats { margin-left: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>水流實驗槽</h1>
      <span class="sub" id="gridInfo">FLIP 流體</span>
    </div>
    <div class="stats" aria-live="off">
      <div class="stat"><span class="k">水量</span><span class="v" id="stVol">0 L</span></div>
      <div class="stat"><span class="k">流入</span><span class="v" id="stIn">0.0 L/s</span></div>
      <div class="stat"><span class="k">排出</span><span class="v" id="stOut">0.0 L/s</span></div>
      <div class="stat"><span class="k">粒子</span><span class="v" id="stP">0</span></div>
      <div class="stat"><span class="k">FPS</span><span class="v" id="stFps">–</span></div>
    </div>
    <div class="transport">
      <button class="btn primary" id="btnPlay" aria-pressed="false">暫停</button>
      <button class="btn" id="btnStep" disabled>單步</button>
    </div>
  </header>

  <main class="tank-wrap" id="tankWrap">
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="gl" aria-hidden="true"></canvas>
    <canvas id="tank" aria-label="水槽模擬畫面"></canvas>
    <div class="hint" id="hint"></div>
  </main>

  <aside class="rail">
    <section>
      <h2>工具</h2>
      <div class="tools" role="radiogroup" aria-label="工具">
        <button class="tool" role="radio" data-tool="select" aria-checked="false"><span class="key">1</span>
          <svg viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.5L10 18z"/></svg>移動</button>
        <button class="tool" role="radio" data-tool="wall" aria-checked="true"><span class="key">2</span>
          <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM3 12h18M9 6v6M15 12v6"/></svg>障礙物</button>
        <button class="tool" role="radio" data-tool="erase" aria-checked="false"><span class="key">3</span>
          <svg viewBox="0 0 24 24"><path d="M4 15l9-9 6 6-7 7H7zM9 10l6 6M12 19h8"/></svg>擦除</button>
        <button class="tool" role="radio" data-tool="source" aria-checked="false"><span class="key">4</span>
          <svg viewBox="0 0 24 24"><path d="M3 7h9a4 4 0 0 1 4 4v2M3 4v6M16 17v.5M16 21v.5M13 19v.5"/></svg>出水孔</button>
        <button class="tool" role="radio" data-tool="drain" aria-checked="false"><span class="key">5</span>
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8 9h8M7 12h10M8 15h8"/></svg>排水孔</button>
        <button class="tool" role="radio" data-tool="pour" aria-checked="false"><span class="key">6</span>
          <svg viewBox="0 0 24 24"><path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/></svg>倒水</button>
        <button class="tool" role="radio" data-tool="stir" aria-checked="false"><span class="key">7</span>
          <svg viewBox="0 0 24 24"><path d="M19 13a7 7 0 1 1-2.5-6.4M19 4v4h-4"/></svg>攪動</button>
        <button class="tool" role="radio" data-tool="sponge" aria-checked="false"><span class="key">8</span>
          <svg viewBox="0 0 24 24"><path d="M4 8h16v10H4zM8 12h.01M12 15h.01M16 11h.01M7 8c1-3 9-3 10 0"/></svg>吸水</button>
      </div>
      <div class="field">
        <label for="brush">筆刷大小</label><output id="brushOut" for="brush">12 cm</output>
        <input type="range" id="brush" min="5" max="40" step="1" value="12">
      </div>
    </section>

    <section>
      <h2>裝置</h2>
      <p class="empty" id="devEmpty">用「出水孔」或「排水孔」工具在槽內點一下來放置，或用「移動」點選已放好的裝置來調整。</p>

      <div class="dev" id="srcEdit" hidden>
        <div class="dev-head"><span class="dev-title" id="srcTitle">出水孔</span><button class="btn danger" id="srcDel">刪除</button></div>
        <div class="dev-row"><button class="btn" id="srcOn" aria-pressed="true">出水中</button></div>
        <div class="field">
          <label for="srcSpeed">流速</label><output id="srcSpeedOut" for="srcSpeed">2.5 m/s</output>
          <input type="range" id="srcSpeed" min="0.5" max="6" step="0.1" value="2.5">
        </div>
        <div class="field">
          <label for="srcWidth">口徑</label><output id="srcWidthOut" for="srcWidth">14 cm</output>
          <input type="range" id="srcWidth" min="4" max="40" step="1" value="14">
        </div>
        <div class="field">
          <label for="srcAngle">噴水角度</label><output id="srcAngleOut" for="srcAngle">0°</output>
          <input type="range" id="srcAngle" min="-180" max="180" step="1" value="0">
        </div>
        <div class="seg-label">水的顏色</div>
        <div class="swatches" id="srcColors"></div>
        <p class="readout">流量 <b id="srcFlow">0.0</b> L/s</p>
      </div>

      <div class="dev" id="drnEdit" hidden>
        <div class="dev-head"><span class="dev-title" id="drnTitle">排水孔</span><button class="btn danger" id="drnDel">刪除</button></div>
        <div class="field">
          <label for="drnR">孔徑</label><output id="drnROut" for="drnR">14 cm</output>
          <input type="range" id="drnR" min="5" max="40" step="1" value="14">
        </div>
        <div class="field">
          <label for="drnPull">吸力</label><output id="drnPullOut" for="drnPull">1.0</output>
          <input type="range" id="drnPull" min="0" max="3" step="0.1" value="1">
        </div>
        <p class="readout">排水量 <b id="drnFlow">0.0</b> L/s</p>
      </div>
    </section>

    <section>
      <h2>環境</h2>
      <div class="seg-label">模擬品質</div>
      <div class="seg" id="segQuality">
        <button data-v="low" aria-pressed="false">流暢</button>
        <button data-v="mid" aria-pressed="false">標準</button>
        <button data-v="high" aria-pressed="false">精細</button>
        <button data-v="ultra" aria-pressed="false">極致</button>
      </div>
      <p class="readout" id="qualityInfo"></p>
      <p class="readout" id="rendererInfo">品質越高，水越細緻，但越吃效能；FPS 掉到 30 以下時建議調低一級。</p>
      <div class="field">
        <label for="grav">重力</label><output id="gravOut" for="grav">1.00 g</output>
        <input type="range" id="grav" min="0" max="2" step="0.05" value="1">
      </div>
      <div class="field">
        <label for="flip">水的活潑度</label><output id="flipOut" for="flip">90%</output>
        <input type="range" id="flip" min="0.5" max="0.99" step="0.01" value="0.9">
      </div>
      <div class="seg-label">畫面</div>
      <div class="seg" id="segView">
        <button data-v="surface" aria-pressed="true">水面</button>
        <button data-v="particles" aria-pressed="false">粒子</button>
      </div>
      <div class="seg-label">著色</div>
      <div class="seg" id="segColor">
        <button data-v="source" aria-pressed="true">依來源</button>
        <button data-v="speed" aria-pressed="false">依流速</button>
      </div>
    </section>

    <section>
      <h2>場景</h2>
      <div class="scenes">
        <button class="scene" data-scene="cascade">瀑布階梯<small>水從高處一階一階流下</small></button>
        <button class="scene" data-scene="funnel">漏斗混色<small>兩色水流經過釘陣</small></button>
        <button class="scene" data-scene="dam">潰壩<small>一整塊水瞬間倒下</small></button>
        <button class="scene" data-scene="empty">空水槽<small>只有一個出水孔</small></button>
      </div>
      <div class="row2">
        <button class="btn" id="btnClearWater">清空水</button>
        <button class="btn" id="btnClearWalls">清除障礙物</button>
      </div>
    </section>
  </aside>
</div>

<script>
(() => {
'use strict';

const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const wrap = $('tankWrap');
const bgCanvas = $('bg');
const glCanvas = $('gl');
const canvas = $('tank');
const ctx = canvas.getContext('2d');

// ---------------------------------------------------------------------------
// World: a 3 m tall tank, 10 cm thick (thickness only matters for litre readouts).
// The aspect ratio is fixed at load; the grid resolution comes from the quality setting.
// ---------------------------------------------------------------------------
const TANK_H = 3.0;
const DEPTH = 0.1;
const r0 = wrap.getBoundingClientRect();
const ASPECT = clamp((r0.width || 960) / (r0.height || 600), 0.8, 2.0);
const SMALL = window.innerWidth < 700;

// field: water-surface buffer resolution relative to CSS pixels
const QUALITY = {
  low:   { label: '流暢', ny: 54,  cap: 9000,  field: 0.5 },
  mid:   { label: '標準', ny: 76,  cap: 18000, field: 0.65 },
  high:  { label: '精細', ny: 100, cap: 32000, field: 0.8 },
  ultra: { label: '極致', ny: 130, cap: 56000, field: 1.0 },
};
let qualityKey = SMALL ? 'mid' : 'high';
try { const q = localStorage.getItem('flowtank.quality'); if (q && QUALITY[q]) qualityKey = q; } catch (e) { /* storage unavailable */ }

const FLUID = 0, AIR = 1, SOLID = 2;

// ---------------------------------------------------------------------------
// FLIP fluid: particles carry the water, a MAC grid enforces incompressibility.
// Grid index is i * ny + j, with j pointing up.
// ---------------------------------------------------------------------------
class Flip {
  constructor(nx, ny, h, maxP) {
    this.nx = nx; this.ny = ny; this.h = h; this.invH = 1 / h;
    const n = nx * ny;
    this.nCells = n;
    this.u = new Float32Array(n); this.v = new Float32Array(n);
    this.du = new Float32Array(n); this.dv = new Float32Array(n);
    this.prevU = new Float32Array(n); this.prevV = new Float32Array(n);
    this.s = new Float32Array(n);
    this.cellType = new Int32Array(n);
    this.density = new Float32Array(n);
    this.solid = new Uint8Array(n);
    // Obstacles live in a signed distance field at twice the grid resolution
    // (metres, positive in open water). Brush strokes edit it directly.
    this.F = 2; this.fnx = nx * 2; this.fny = ny * 2; this.fh = h / 2;
    this.sdf = new Float32Array(this.fnx * this.fny);

    this.r = 0.3 * h;
    this.restDensity = 1 / (0.6 * 0.3 * Math.sqrt(3)) * 0.92;
    this.maxP = maxP; this.numP = 0;
    this.pos = new Float32Array(2 * maxP);
    this.vel = new Float32Array(2 * maxP);
    this.col = new Float32Array(3 * maxP);

    this.pInv = 1 / (2.2 * this.r);
    this.pnx = Math.floor(nx * h * this.pInv) + 1;
    this.pny = Math.floor(ny * h * this.pInv) + 1;
    const pc = this.pnx * this.pny;
    this.cellCount = new Int32Array(pc);
    this.firstCell = new Int32Array(pc + 1);
    this.cellIds = new Int32Array(maxP);

    this.gravity = -9.81;
    this.flipRatio = 0.9;
    this.clearSolids();
  }

  borderSDF(x, y) {
    const h = this.h;
    return Math.min(x - h, (this.nx - 1) * h - x, y - h, (this.ny - 1) * h - y);
  }

  clearSolids() {
    const { fnx, fny, fh, sdf } = this;
    for (let i = 0; i < fnx; i++) for (let j = 0; j < fny; j++) sdf[i * fny + j] = this.borderSDF((i + 0.5) * fh, (j + 0.5) * fh);
    this.updateSolids();
  }

  // Grid cells whose centre lies inside an obstacle become solid for the pressure solve.
  updateSolids(x0 = 0, y0 = 0, x1 = Infinity, y1 = Infinity) {
    const { nx, ny, h, solid, s } = this;
    const i0 = Math.max(0, Math.floor(x0 / h) - 1), i1 = Math.min(nx - 1, Math.ceil(x1 / h) + 1);
    const j0 = Math.max(0, Math.floor(y0 / h) - 1), j1 = Math.min(ny - 1, Math.ceil(y1 / h) + 1);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const c = i * ny + j;
      const border = i === 0 || j === 0 || i === nx - 1 || j === ny - 1;
      solid[c] = border || this.sampleSDF((i + 0.5) * h, (j + 0.5) * h) < 0 ? 1 : 0;
      s[c] = solid[c] ? 0 : 1;
    }
  }

  // Union (add) or subtract a disc. Only nodes near the disc are touched.
  stampCircle(x, y, R, add) {
    const { fnx, fny, fh, sdf } = this, m = R + 3 * this.h;
    const i0 = Math.max(0, Math.floor((x - m) / fh)), i1 = Math.min(fnx - 1, Math.ceil((x + m) / fh));
    const j0 = Math.max(0, Math.floor((y - m) / fh)), j1 = Math.min(fny - 1, Math.ceil((y + m) / fh));
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const px = (i + 0.5) * fh, py = (j + 0.5) * fh, d = Math.hypot(px - x, py - y) - R, c = i * fny + j;
      sdf[c] = add ? Math.min(sdf[c], d) : Math.min(Math.max(sdf[c], -d), this.borderSDF(px, py));
    }
    this.updateSolids(x - m, y - m, x + m, y + m);
  }

  stampBox(x0, y0, x1, y1) {
    const { fnx, fny, fh, sdf } = this, m = 3 * this.h;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, hx = (x1 - x0) / 2, hy = (y1 - y0) / 2;
    const i0 = Math.max(0, Math.floor((x0 - m) / fh)), i1 = Math.min(fnx - 1, Math.ceil((x1 + m) / fh));
    const j0 = Math.max(0, Math.floor((y0 - m) / fh)), j1 = Math.min(fny - 1, Math.ceil((y1 + m) / fh));
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
      const qx = Math.abs((i + 0.5) * fh - cx) - hx, qy = Math.abs((j + 0.5) * fh - cy) - hy;
      const d = Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0), c = i * fny + j;
      sdf[c] = Math.min(sdf[c], d);
    }
    this.updateSolids(x0 - m, y0 - m, x1 + m, y1 + m);
  }

  sampleSDF(x, y) {
    const fny = this.fny, sdf = this.sdf, inv = 1 / this.fh;
    const fx = clamp(x * inv - 0.5, 0, this.fnx - 1.001);
    const fy = clamp(y * inv - 0.5, 0, fny - 1.001);
    const i = fx | 0, j = fy | 0, tx = fx - i, ty = fy - j, c = i * fny + j;
    return (1 - tx) * ((1 - ty) * sdf[c] + ty * sdf[c + 1]) + tx * ((1 - ty) * sdf[c + fny] + ty * sdf[c + fny + 1]);
  }

  addParticle(x, y, vx, vy, r, g, b) {
    if (this.numP >= this.maxP) return false;
    const i = this.numP++;
    this.pos[2 * i] = x; this.pos[2 * i + 1] = y;
    this.vel[2 * i] = vx; this.vel[2 * i + 1] = vy;
    this.col[3 * i] = r; this.col[3 * i + 1] = g; this.col[3 * i + 2] = b;
    return true;
  }

  removeParticle(i) {
    const last = --this.numP;
    if (i === last) return;
    this.pos[2 * i] = this.pos[2 * last]; this.pos[2 * i + 1] = this.pos[2 * last + 1];
    this.vel[2 * i] = this.vel[2 * last]; this.vel[2 * i + 1] = this.vel[2 * last + 1];
    this.col[3 * i] = this.col[3 * last]; this.col[3 * i + 1] = this.col[3 * last + 1]; this.col[3 * i + 2] = this.col[3 * last + 2];
  }

  integrate(dt) {
    const { pos, vel } = this;
    const g = this.gravity * dt, vmax = 2 * this.h / dt, vmax2 = vmax * vmax;
    for (let i = 0; i < this.numP; i++) {
      let vx = vel[2 * i], vy = vel[2 * i + 1] + g;
      const s2 = vx * vx + vy * vy;
      if (s2 > vmax2) { const k = vmax / Math.sqrt(s2); vx *= k; vy *= k; }
      vel[2 * i] = vx; vel[2 * i + 1] = vy;
      pos[2 * i] += vx * dt; pos[2 * i + 1] += vy * dt;
    }
  }

  pushApart(iters) {
    const { pos, col, pnx, pny, pInv, cellCount, firstCell, cellIds } = this;
    const numP = this.numP, pc = pnx * pny;
    cellCount.fill(0);
    for (let i = 0; i < numP; i++) {
      const xi = clamp(Math.floor(pos[2 * i] * pInv), 0, pnx - 1);
      const yi = clamp(Math.floor(pos[2 * i + 1] * pInv), 0, pny - 1);
      cellCount[xi * pny + yi]++;
    }
    let first = 0;
    for (let c = 0; c < pc; c++) { first += cellCount[c]; firstCell[c] = first; }
    firstCell[pc] = first;
    for (let i = 0; i < numP; i++) {
      const xi = clamp(Math.floor(pos[2 * i] * pInv), 0, pnx - 1);
      const yi = clamp(Math.floor(pos[2 * i + 1] * pInv), 0, pny - 1);
      const c = xi * pny + yi;
      firstCell[c]--;
      cellIds[firstCell[c]] = i;
    }

    const minDist = 2 * this.r, minDist2 = minDist * minDist, mix = 0.002;
    for (let it = 0; it < iters; it++) {
      for (let i = 0; i < numP; i++) {
        const px = pos[2 * i], py = pos[2 * i + 1];
        const pxi = Math.floor(px * pInv), pyi = Math.floor(py * pInv);
        const x0 = Math.max(pxi - 1, 0), y0 = Math.max(pyi - 1, 0);
        const x1 = Math.min(pxi + 1, pnx - 1), y1 = Math.min(pyi + 1, pny - 1);
        for (let xi = x0; xi <= x1; xi++) {
          for (let yi = y0; yi <= y1; yi++) {
            const c = xi * pny + yi;
            for (let k = firstCell[c], end = firstCell[c + 1]; k < end; k++) {
              const id = cellIds[k];
              if (id === i) continue;
              let dx = pos[2 * id] - pos[2 * i], dy = pos[2 * id + 1] - pos[2 * i + 1];
              const d2 = dx * dx + dy * dy;
              if (d2 > minDist2 || d2 === 0) continue;
              const d = Math.sqrt(d2), s = 0.5 * (minDist - d) / d;
              dx *= s; dy *= s;
              pos[2 * i] -= dx; pos[2 * i + 1] -= dy;
              pos[2 * id] += dx; pos[2 * id + 1] += dy;
              for (let ch = 0; ch < 3; ch++) {
                const a = col[3 * i + ch], b = col[3 * id + ch], m = (a + b) * 0.5;
                col[3 * i + ch] = a + (m - a) * mix;
                col[3 * id + ch] = b + (m - b) * mix;
              }
            }
          }
        }
      }
    }
  }

  collisions() {
    const { pos, vel, r, h } = this;
    const minX = h + r, maxX = (this.nx - 1) * h - r, minY = h + r, maxY = (this.ny - 1) * h - r;
    const e = 0.3 * h;
    for (let i = this.numP - 1; i >= 0; i--) {
      let x = pos[2 * i], y = pos[2 * i + 1];
      const d = this.sampleSDF(x, y);
      if (d < r) {
        if (d < -2.5 * h) { this.removeParticle(i); continue; }
        let gx = this.sampleSDF(x + e, y) - this.sampleSDF(x - e, y);
        let gy = this.sampleSDF(x, y + e) - this.sampleSDF(x, y - e);
        const len = Math.sqrt(gx * gx + gy * gy);
        if (len > 1e-9) {
          gx /= len; gy /= len;
          const push = r - d;
          x += gx * push; y += gy * push;
          const vn = vel[2 * i] * gx + vel[2 * i + 1] * gy;
          if (vn < 0) { vel[2 * i] -= vn * gx; vel[2 * i + 1] -= vn * gy; }
        }
      }
      if (x < minX) { x = minX; vel[2 * i] = 0; }
      if (x > maxX) { x = maxX; vel[2 * i] = 0; }
      if (y < minY) { y = minY; vel[2 * i + 1] = 0; }
      if (y > maxY) { y = maxY; vel[2 * i + 1] = 0; }
      pos[2 * i] = x; pos[2 * i + 1] = y;
    }
  }

  markCells() {
    const { pos, cellType, s, nx, ny, invH } = this;
    for (let c = 0; c < this.nCells; c++) cellType[c] = s[c] === 0 ? SOLID : AIR;
    for (let i = 0; i < this.numP; i++) {
      const xi = clamp(Math.floor(pos[2 * i] * invH), 0, nx - 1);
      const yi = clamp(Math.floor(pos[2 * i + 1] * invH), 0, ny - 1);
      const c = xi * ny + yi;
      if (cellType[c] === AIR) cellType[c] = FLUID;
    }
  }

  transfer(toGrid) {
    const { nx, ny, h, invH, u, v, du, dv, prevU, prevV, cellType, pos, vel } = this;
    const n = ny, h2 = 0.5 * h, numP = this.numP;
    if (toGrid) {
      du.fill(0); dv.fill(0); u.fill(0); v.fill(0);
      this.markCells();
    }
    for (let comp = 0; comp < 2; comp++) {
      const dx = comp === 0 ? 0 : h2, dy = comp === 0 ? h2 : 0;
      const f = comp === 0 ? u : v, pf = comp === 0 ? prevU : prevV, d = comp === 0 ? du : dv;
      const offset = comp === 0 ? n : 1;
      for (let p = 0; p < numP; p++) {
        const x = clamp(pos[2 * p], h, (nx - 1) * h), y = clamp(pos[2 * p + 1], h, (ny - 1) * h);
        const x0 = Math.min(Math.floor((x - dx) * invH), nx - 2), tx = ((x - dx) - x0 * h) * invH, x1 = Math.min(x0 + 1, nx - 2);
        const y0 = Math.min(Math.floor((y - dy) * invH), ny - 2), ty = ((y - dy) - y0 * h) * invH, y1 = Math.min(y0 + 1, ny - 2);
        const sx = 1 - tx, sy = 1 - ty;
        const d0 = sx * sy, d1 = tx * sy, d2 = tx * ty, d3 = sx * ty;
        const n0 = x0 * n + y0, n1 = x1 * n + y0, n2 = x1 * n + y1, n3 = x0 * n + y1;
        if (toGrid) {
          const pv = vel[2 * p + comp];
          f[n0] += pv * d0; d[n0] += d0;
          f[n1] += pv * d1; d[n1] += d1;
          f[n2] += pv * d2; d[n2] += d2;
          f[n3] += pv * d3; d[n3] += d3;
        } else {
          const v0 = cellType[n0] !== AIR || cellType[n0 - offset] !== AIR ? 1 : 0;
          const v1 = cellType[n1] !== AIR || cellType[n1 - offset] !== AIR ? 1 : 0;
          const v2 = cellType[n2] !== AIR || cellType[n2 - offset] !== AIR ? 1 : 0;
          const v3 = cellType[n3] !== AIR || cellType[n3 - offset] !== AIR ? 1 : 0;
          const ds = v0 * d0 + v1 * d1 + v2 * d2 + v3 * d3;
          if (ds > 0) {
            const pic = (v0 * d0 * f[n0] + v1 * d1 * f[n1] + v2 * d2 * f[n2] + v3 * d3 * f[n3]) / ds;
            const corr = (v0 * d0 * (f[n0] - pf[n0]) + v1 * d1 * (f[n1] - pf[n1]) + v2 * d2 * (f[n2] - pf[n2]) + v3 * d3 * (f[n3] - pf[n3])) / ds;
            const flip = vel[2 * p + comp] + corr;
            vel[2 * p + comp] = (1 - this.flipRatio) * pic + this.flipRatio * flip;
          }
        }
      }
      if (toGrid) for (let c = 0; c < this.nCells; c++) if (d[c] > 0) f[c] /= d[c];
    }
    if (toGrid) {
      for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
        const c = i * n + j, sol = cellType[c] === SOLID;
        if (sol || (i > 0 && cellType[c - n] === SOLID)) u[c] = 0;
        if (sol || (j > 0 && cellType[c - 1] === SOLID)) v[c] = 0;
      }
    }
  }

  updateDensity() {
    const { nx, ny, h, invH, pos, density } = this;
    const n = ny, h2 = 0.5 * h;
    density.fill(0);
    for (let p = 0; p < this.numP; p++) {
      const x = clamp(pos[2 * p], h, (nx - 1) * h), y = clamp(pos[2 * p + 1], h, (ny - 1) * h);
      const x0 = Math.floor((x - h2) * invH), tx = ((x - h2) - x0 * h) * invH, x1 = Math.min(x0 + 1, nx - 2);
      const y0 = Math.floor((y - h2) * invH), ty = ((y - h2) - y0 * h) * invH, y1 = Math.min(y0 + 1, ny - 2);
      const sx = 1 - tx, sy = 1 - ty;
      density[x0 * n + y0] += sx * sy;
      density[x1 * n + y0] += tx * sy;
      density[x1 * n + y1] += tx * ty;
      density[x0 * n + y1] += sx * ty;
    }
  }

  solve(iters, overRelax) {
    const { nx, ny, u, v, s, cellType, density, prevU, prevV } = this;
    const n = ny, rest = this.restDensity;
    prevU.set(u); prevV.set(v);
    for (let it = 0; it < iters; it++) {
      for (let i = 1; i < nx - 1; i++) {
        for (let j = 1; j < ny - 1; j++) {
          const c = i * n + j;
          if (cellType[c] !== FLUID) continue;
          const left = c - n, right = c + n, bottom = c - 1, top = c + 1;
          const sx0 = s[left], sx1 = s[right], sy0 = s[bottom], sy1 = s[top];
          const st = sx0 + sx1 + sy0 + sy1;
          if (st === 0) continue;
          let div = u[right] - u[c] + v[top] - v[c];
          const compression = density[c] - rest;
          if (compression > 0) div -= compression;
          const p = -div / st * overRelax;
          u[c] -= sx0 * p; u[right] += sx1 * p;
          v[c] -= sy0 * p; v[top] += sy1 * p;
        }
      }
    }
  }

  step(dt) {
    this.integrate(dt);
    this.pushApart(2);
    this.collisions();
    this.transfer(true);
    this.updateDensity();
    this.solve(32, 1.9);
    this.transfer(false);
  }

  maxSpeed() {
    let m = 0;
    for (let i = 0; i < this.numP; i++) {
      const vx = this.vel[2 * i], vy = this.vel[2 * i + 1], s = vx * vx + vy * vy;
      if (s > m) m = s;
    }
    return Math.sqrt(m);
  }
}

// Grid-dependent globals, rebuilt when the quality changes.
let NX, NY, CELL, TANK_W, MAX_P, sim, PARTICLE_AREA, LITRES_PER_PARTICLE;
let dispCol = new Float32Array(0);   // per-particle display colour for the renderers

function buildWorld(key) {
  const q = QUALITY[key];
  NY = q.ny; NX = Math.round(NY * ASPECT);
  CELL = TANK_H / NY; TANK_W = NX * CELL; MAX_P = q.cap;
  sim = new Flip(NX, NY, CELL, MAX_P);
  sim.gravity = -9.81 * +$('grav').value;
  sim.flipRatio = +$('flip').value;
  PARTICLE_AREA = CELL * CELL / sim.restDensity;
  LITRES_PER_PARTICLE = PARTICLE_AREA * DEPTH * 1000;
  dispCol = new Float32Array(3 * MAX_P);
  $('gridInfo').textContent = `FLIP 流體 · ${NX}×${NY} 格`;
  $('qualityInfo').textContent = `網格 ${NX} × ${NY} · 最多 ${MAX_P.toLocaleString('en-US')} 顆粒子`;
  if (canvasRenderer) canvasRenderer = makeCanvasRenderer();
}

// ---------------------------------------------------------------------------
// Devices
// ---------------------------------------------------------------------------
const PALETTE = [
  { name: '藍', rgb: [0.20, 0.50, 0.93] },
  { name: '青', rgb: [0.10, 0.72, 0.72] },
  { name: '玫瑰', rgb: [0.91, 0.30, 0.55] },
  { name: '琥珀', rgb: [0.96, 0.64, 0.18] },
  { name: '草綠', rgb: [0.42, 0.78, 0.30] },
];
const NOZZLE_LEN = 0.2;
let sources = [], drains = [];
let selected = null;           // { kind: 'source'|'drain', obj }
let nextId = 1;

function makeSource(x, y, angleDeg, opts = {}) {
  return { id: nextId++, x, y, angle: angleDeg * Math.PI / 180, speed: opts.speed ?? 2.5, width: opts.width ?? 0.14, color: opts.color ?? 0, on: true, acc: 0, row: 0 };
}
function makeDrain(x, y, opts = {}) {
  return { id: nextId++, x, y, r: opts.r ?? 0.14, pull: opts.pull ?? 1, flow: 0 };
}
const sourceFlow = (s) => s.width * s.speed * DEPTH * 1000;   // L/s

function emit(dt) {
  // Rows of particles laid across the nozzle at the packing spacing, so the jet leaves as a clean sheet.
  const spacing = 2 * sim.r, rowGap = Math.sqrt(3) * sim.r;
  for (const s of sources) {
    if (!s.on) continue;
    const dx = Math.cos(s.angle), dy = Math.sin(s.angle), nx = -dy, ny = dx;
    const mx = s.x + dx * NOZZLE_LEN * 0.5, my = s.y + dy * NOZZLE_LEN * 0.5;
    const count = Math.max(1, Math.round(s.width / spacing));
    const [cr, cg, cb] = PALETTE[s.color].rgb;
    s.acc += s.speed * dt;
    while (s.acc >= rowGap) {
      s.acc -= rowGap;
      if (sim.numP + count > sim.maxP) { s.acc = 0; break; }
      const shift = (s.row++ & 1) ? 0.25 : -0.25;
      for (let k = 0; k < count; k++) {
        const t = ((k + 0.5 + shift) / count - 0.5) * s.width + (Math.random() - 0.5) * 0.1 * sim.r;
        const px = mx + nx * t + dx * s.acc, py = my + ny * t + dy * s.acc;
        if (sim.sampleSDF(px, py) < sim.r) continue;
        sim.addParticle(px, py, dx * s.speed, dy * s.speed, cr, cg, cb);
      }
    }
  }
}

let drainedThisFrame = 0;
function drainWater(dt) {
  const { pos, vel } = sim;
  for (const d of drains) {
    const r2 = d.r * d.r, reach = d.r * 2.6, reach2 = reach * reach;
    let removed = 0;
    for (let i = sim.numP - 1; i >= 0; i--) {
      const dx = pos[2 * i] - d.x, dy = pos[2 * i + 1] - d.y, q = dx * dx + dy * dy;
      if (q < r2) { sim.removeParticle(i); removed++; continue; }
      if (d.pull > 0 && q < reach2) {
        const dist = Math.sqrt(q), f = d.pull * (1 - dist / reach) * 14 * dt;
        vel[2 * i] -= dx / dist * f; vel[2 * i + 1] -= dy / dist * f;
      }
    }
    d.flow = d.flow * 0.9 + (removed * LITRES_PER_PARTICLE / dt) * 0.1;
    drainedThisFrame += removed;
  }
}

// ---------------------------------------------------------------------------
// Painting helpers (world coordinates, metres)
// ---------------------------------------------------------------------------
let solidsDirty = true;   // obstacle field changed since the renderer last saw it
function refreshSolids() {
  solidsDirty = false;
  if (glr) glr.uploadSDF(); else canvasRenderer.drawObstacles();
}
function paintCircle(x, y, R, val) {
  sim.stampCircle(x, y, R, val === 1);
  solidsDirty = true;
}
function paintSegment(x0, y0, x1, y1, R, val) {
  const len = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.ceil(len / (R * 0.3)));
  for (let k = 0; k <= steps; k++) { const t = k / steps; paintCircle(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, R, val); }
}
function paintRect(x0, y0, x1, y1) {
  sim.stampBox(x0, y0, x1, y1);
  solidsDirty = true;
}
function fillWater(x0, y0, x1, y1, rgb) {
  refreshSolids();
  const r = sim.r, dx = 2 * r, dy = Math.sqrt(3) * r;
  let row = 0;
  for (let y = y0 + r; y < y1; y += dy, row++) {
    for (let x = x0 + r + (row % 2 ? r : 0); x < x1; x += dx) {
      if (sim.sampleSDF(x, y) < r) continue;
      if (!sim.addParticle(x, y, 0, 0, rgb[0], rgb[1], rgb[2])) return;
    }
  }
}

// ---------------------------------------------------------------------------
// Scenes (positions as fractions of the tank so they fit any aspect)
// ---------------------------------------------------------------------------
const SCENES = {
  cascade() {
    const W = TANK_W, H = TANK_H;
    for (let k = 0; k < 4; k++) {
      const x0 = W * (0.04 + k * 0.205), x1 = x0 + W * 0.19, y = H * (0.74 - k * 0.165);
      paintSegment(x0, y + 0.02, x1, y - 0.03, 0.045, 1);
      paintSegment(x1, y - 0.03, x1, y + 0.11, 0.04, 1);
    }
    paintCircle(W * 0.5, 0.12, 0.2, 1);
    sources.push(makeSource(W * 0.07, H * 0.9, -15, { speed: 2.2, width: 0.14, color: 0 }));
    drains.push(makeDrain(W * 0.93, 0.18, { r: 0.13, pull: 1 }));
    fillWater(CELL, CELL, W - CELL, H * 0.1, PALETTE[1].rgb);
  },
  funnel() {
    const W = TANK_W, H = TANK_H;
    paintSegment(W * 0.14, H * 0.66, W * 0.45, H * 0.45, 0.045, 1);
    paintSegment(W * 0.86, H * 0.66, W * 0.55, H * 0.45, 0.045, 1);
    for (let row = 0; row < 3; row++) {
      const cols = 6 - (row % 2), y = H * (0.33 - row * 0.085);
      for (let c = 0; c < cols; c++) paintCircle(W * 0.5 + (c - (cols - 1) / 2) * W * 0.085, y, 0.055, 1);
    }
    sources.push(makeSource(W * 0.06, H * 0.86, -8, { speed: 2.4, width: 0.12, color: 0 }));
    sources.push(makeSource(W * 0.94, H * 0.86, 188, { speed: 2.4, width: 0.12, color: 2 }));
    drains.push(makeDrain(W * 0.5, 0.16, { r: 0.15, pull: 1.2 }));
    fillWater(CELL, CELL, W - CELL, H * 0.06, PALETTE[3].rgb);
  },
  dam() {
    const W = TANK_W, H = TANK_H;
    paintCircle(W * 0.58, 0.28, 0.22, 1);
    paintRect(W * 0.8, CELL, W * 0.84, H * 0.22);
    fillWater(CELL, CELL, W * 0.36, H * 0.72, PALETTE[0].rgb);
  },
  empty() {
    const W = TANK_W, H = TANK_H;
    sources.push(makeSource(W * 0.12, H * 0.8, -30, { speed: 2.6, width: 0.14, color: 0 }));
    fillWater(CELL, CELL, W - CELL, H * 0.12, PALETTE[0].rgb);
  },
};

function loadScene(name) {
  sim.numP = 0;
  sim.u.fill(0); sim.v.fill(0);
  sources = []; drains = []; select(null);
  sim.clearSolids();
  SCENES[name]();
  refreshSolids();
}

// Switch grid resolution, carrying over obstacles, devices and water.
function setQuality(key) {
  if (key === qualityKey) return;
  const old = sim, oldArea = PARTICLE_AREA;
  qualityKey = key;
  try { localStorage.setItem('flowtank.quality', key); } catch (e) { /* storage unavailable */ }
  buildWorld(key);
  // Resample the obstacle field; where the old value only reflects the old tank wall, use the new wall.
  for (let i = 0; i < sim.fnx; i++) for (let j = 0; j < sim.fny; j++) {
    const x = (i + 0.5) * sim.fh, y = (j + 0.5) * sim.fh;
    const v = old.sampleSDF(x, y), wall = old.borderSDF(x, y);
    sim.sdf[i * sim.fny + j] = Math.min(v >= wall - 1e-6 ? Infinity : v, sim.borderSDF(x, y));
  }
  sim.updateSolids();
  const ratio = oldArea / PARTICLE_AREA, whole = Math.floor(ratio), frac = ratio - whole;
  for (let p = 0; p < old.numP && sim.numP < sim.maxP; p++) {
    const n = whole + (Math.random() < frac ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * old.r * 1.2;
      const x = old.pos[2 * p] + Math.cos(a) * rr, y = old.pos[2 * p + 1] + Math.sin(a) * rr;
      if (sim.sampleSDF(x, y) < 0) continue;
      sim.addParticle(x, y, old.vel[2 * p], old.vel[2 * p + 1], old.col[3 * p], old.col[3 * p + 1], old.col[3 * p + 2]);
    }
  }
  for (let k = 0; k < 4; k++) { sim.pushApart(2); sim.collisions(); }
  for (const s of sources) { s.x = clamp(s.x, CELL * 1.5, TANK_W - CELL * 1.5); s.acc = 0; }
  for (const d of drains) d.x = clamp(d.x, CELL * 1.5, TANK_W - CELL * 1.5);
  resize();
  refreshSolids();
  syncQualityUI();
}

// ---------------------------------------------------------------------------
// View: three stacked canvases — background, WebGL (water + obstacles), 2D overlay (devices).
// ---------------------------------------------------------------------------
const view = { dpr: 1, cw: 1, ch: 1, tx: 0, ty: 0, tw: 1, th: 1, s: 1 };
const sx = (x) => view.tx + x * view.s;
const sy = (y) => view.ty + (TANK_H - y) * view.s;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  view.dpr = dpr; view.cw = Math.max(1, Math.round(w * dpr)); view.ch = Math.max(1, Math.round(h * dpr));
  for (const c of [bgCanvas, glCanvas, canvas]) { c.width = view.cw; c.height = view.ch; }
  const pad = 10 * dpr;
  const s = Math.min((view.cw - 2 * pad) / TANK_W, (view.ch - 2 * pad) / TANK_H);
  view.tw = Math.round(TANK_W * s); view.th = Math.round(TANK_H * s);
  view.s = view.th / TANK_H;
  view.tx = Math.round((view.cw - view.tw) / 2); view.ty = Math.round((view.ch - view.th) / 2);
  drawBackground();
}

function drawBackground() {
  const g = bgCanvas.getContext('2d');
  g.clearRect(0, 0, view.cw, view.ch);
  const x0 = view.tx, y0 = view.ty, w = view.tw, h = view.th;
  const grad = g.createLinearGradient(0, y0, 0, y0 + h);
  grad.addColorStop(0, '#16262d'); grad.addColorStop(1, '#0a1419');
  g.fillStyle = grad; g.fillRect(x0, y0, w, h);
  // 10 cm grid, stronger every 50 cm
  const line = Math.max(1, Math.round(view.dpr * 0.6));
  for (let k = 0; k * 0.1 <= TANK_W + 1e-6; k++) {
    g.fillStyle = k % 5 === 0 ? 'rgba(170,210,225,0.075)' : 'rgba(170,210,225,0.03)';
    g.fillRect(Math.round(sx(k * 0.1)), y0, line, h);
  }
  for (let k = 0; k * 0.1 <= TANK_H + 1e-6; k++) {
    g.fillStyle = k % 5 === 0 ? 'rgba(170,210,225,0.075)' : 'rgba(170,210,225,0.03)';
    g.fillRect(x0, Math.round(sy(k * 0.1)), w, line);
  }
  // depth ruler on the inside of the left wall
  const fs = Math.round(10 * view.dpr);
  g.font = `500 ${fs}px "IBM Plex Mono", ui-monospace, monospace`;
  g.textBaseline = 'middle';
  for (let k = 1; k * 0.1 < TANK_H - CELL; k++) {
    const y = sy(k * 0.1), xl = sx(CELL);
    const major = k % 5 === 0;
    g.fillStyle = major ? 'rgba(210,230,236,0.55)' : 'rgba(210,230,236,0.3)';
    g.fillRect(xl, Math.round(y), (major ? 12 : 6) * view.dpr, Math.max(1, view.dpr));
    if (major) g.fillText(`${k * 10}`, xl + 15 * view.dpr, y);
  }
  g.fillStyle = 'rgba(210,230,236,0.45)';
  g.fillText('cm', sx(CELL) + 15 * view.dpr, sy(TANK_H - CELL) + 10 * view.dpr);
}

function speedRamp(sp, out, o) {
  const t = clamp(sp / 4.5, 0, 1);
  if (t < 0.5) { const k = t / 0.5; out[o] = 0.08 + 0.04 * k; out[o + 1] = 0.26 + 0.42 * k; out[o + 2] = 0.62 + 0.24 * k; }
  else { const k = (t - 0.5) / 0.5; out[o] = 0.12 + 0.82 * k; out[o + 1] = 0.68 + 0.28 * k; out[o + 2] = 0.86 + 0.13 * k; }
}

let viewMode = 'surface', colorMode = 'source';
function computeDisplayColors() {
  const { vel, col } = sim;
  for (let p = 0; p < sim.numP; p++) {
    const vx = vel[2 * p], vy = vel[2 * p + 1], sp = Math.sqrt(vx * vx + vy * vy), o = 3 * p;
    if (colorMode === 'speed') { speedRamp(sp, dispCol, o); continue; }
    const f = smooth(2.6, 5.5, sp) * 0.55;          // fast water whitens like aerated foam
    dispCol[o] = col[o] + (1 - col[o]) * f;
    dispCol[o + 1] = col[o + 1] + (1 - col[o + 1]) * f;
    dispCol[o + 2] = col[o + 2] + (1 - col[o + 2]) * f;
  }
}

// ---------------------------------------------------------------------------
// WebGL renderer: particles are splatted as smooth kernels into a half-float
// field, then a full-resolution pass extracts an anti-aliased, shaded surface.
// Obstacles are shaded straight from the signed distance field.
// ---------------------------------------------------------------------------
const KERNEL = 3.2;   // splat radius in particle radii

function createGLRenderer() {
  const gl = glCanvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl || !gl.getExtension('EXT_color_buffer_float')) return null;

  const shader = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
      const name = gl.getActiveUniform(p, i).name;
      u[name] = gl.getUniformLocation(p, name);
    }
    return { p, u };
  };

  const QUAD_VS = `#version 300 es
layout(location=0) in vec2 aP; out vec2 vUV;
void main(){ vUV = aP * 0.5 + 0.5; gl_Position = vec4(aP, 0.0, 1.0); }`;
  const POINT_VS = `#version 300 es
layout(location=0) in vec2 aPos; layout(location=1) in vec3 aCol;
uniform vec2 uWorld; uniform float uSize; out vec3 vCol;
void main(){ gl_Position = vec4(aPos / uWorld * 2.0 - 1.0, 0.0, 1.0); gl_PointSize = uSize; vCol = aCol; }`;

  const splat = program(POINT_VS, `#version 300 es
precision highp float; in vec3 vCol; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float d2 = dot(q, q);
  if (d2 >= 1.0) discard;
  float w = 1.0 - d2; w = w * w * w;
  o = vec4(vCol * w, w);
}`);

  const dots = program(POINT_VS, `#version 300 es
precision highp float; in vec3 vCol; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2.0 - 1.0; float d2 = dot(q, q);
  float a = 1.0 - smoothstep(0.75, 1.0, d2);
  if (a <= 0.0) discard;
  vec3 c = vCol * (0.8 + 0.3 * (1.0 - d2));
  o = vec4(c * a, a);
}`);

  const surface = program(QUAD_VS, `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uField; uniform vec2 uTexel; uniform float uNorm; uniform float uBump;
const float T = 0.33;
void main(){
  vec4 f = texture(uField, vUV);
  float d = f.a * uNorm;
  float a = clamp((d - T) / max(fwidth(d), 1e-4) + 0.5, 0.0, 1.0);
  if (a <= 0.0) { o = vec4(0.0); return; }
  vec3 col = f.rgb / max(f.a, 1e-5);
  vec2 e = uTexel * 1.5;
  float dl = texture(uField, vUV - vec2(e.x, 0.0)).a, dr = texture(uField, vUV + vec2(e.x, 0.0)).a;
  float db = texture(uField, vUV - vec2(0.0, e.y)).a, dt = texture(uField, vUV + vec2(0.0, e.y)).a;
  float nearSurface = 1.0 - smoothstep(T, T + 0.55, d);   // keep the interior flat; tilt normals only at the surface
  vec3 n = normalize(vec3(-vec2(dr - dl, dt - db) * uNorm * uBump * nearSurface, 1.0));
  float thick = smoothstep(0.45, 1.1, d);
  vec3 base = col * mix(1.04, 0.74, thick);
  float edge = 1.0 - smoothstep(T, T + 0.2, d);
  vec3 L = normalize(vec3(-0.45, 0.75, 0.55));
  float diff = clamp(dot(n, L), 0.0, 1.0);
  float spec = pow(clamp(dot(n, normalize(L + vec3(0.0, 0.0, 1.0))), 0.0, 1.0), 48.0);
  vec3 c = base * (0.70 + 0.40 * diff) + edge * 0.42 * (vec3(1.0) - base) + spec * 0.5;
  float alpha = a * mix(0.80, 0.94, thick);
  o = vec4(min(c, vec3(1.0)) * alpha, alpha);
}`);

  const rock = program(QUAD_VS, `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o;
uniform sampler2D uSdf; uniform vec2 uWorld; uniform float uPx; uniform vec2 uE; uniform float uBevel;
float S(vec2 uv){ return texture(uSdf, uv).r; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  float d = S(vUV);
  float a = clamp(0.5 - d / uPx, 0.0, 1.0);
  if (a <= 0.0) { o = vec4(0.0); return; }
  vec2 g = vec2(S(vUV + vec2(uE.x, 0.0)) - S(vUV - vec2(uE.x, 0.0)), S(vUV + vec2(0.0, uE.y)) - S(vUV - vec2(0.0, uE.y)));
  g /= max(length(g), 1e-6);
  float bevel = 1.0 - smoothstep(0.0, uBevel, -d);
  float light = dot(g, vec2(-0.5, 0.866)) * bevel;
  vec2 w = vUV * uWorld;
  float grain = hash(floor(w * 220.0)) * 0.6 + hash(floor(w * 45.0)) * 0.4;
  float base = 0.42 + (grain - 0.5) * 0.07 + light * 0.24 - (1.0 - bevel) * 0.035;
  vec3 c = vec3(base, base * 1.03, base * 1.015);
  o = vec4(c * a, a);
}`);

  const quadVAO = gl.createVertexArray();
  gl.bindVertexArray(quadVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const ptVAO = gl.createVertexArray();
  gl.bindVertexArray(ptVAO);
  const posBuf = gl.createBuffer(), colBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  const maxPoint = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];
  const texParams = (filter) => {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  };

  let fieldTex = null, fbo = null, fw = 0, fh = 0;
  function ensureField(w, h) {
    if (w === fw && h === fh) return;
    if (fieldTex) { gl.deleteTexture(fieldTex); gl.deleteFramebuffer(fbo); }
    fieldTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, fieldTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    texParams(gl.LINEAR);
    fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fieldTex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    if (!ok) throw new Error('half-float framebuffer unsupported');
    fw = w; fh = h;
  }

  const sdfTex = gl.createTexture();
  let sdfBuf = new Float32Array(0);
  function uploadSDF() {
    const { fnx: nx, fny: ny, sdf } = sim;
    if (sdfBuf.length !== nx * ny) sdfBuf = new Float32Array(nx * ny);
    for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) sdfBuf[j * nx + i] = sdf[i * ny + j];
    gl.bindTexture(gl.TEXTURE_2D, sdfTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, nx, ny, 0, gl.RED, gl.FLOAT, sdfBuf);
    texParams(gl.LINEAR);
  }

  function draw() {
    const n = sim.numP;
    const tyGL = view.ch - (view.ty + view.th);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, view.cw, view.ch);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, sim.pos.subarray(0, 2 * n), gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferData(gl.ARRAY_BUFFER, dispCol.subarray(0, 3 * n), gl.DYNAMIC_DRAW);

    if (viewMode === 'surface') {
      const q = QUALITY[qualityKey].field;
      const w = Math.max(16, Math.round(view.tw / view.dpr * q)), h = Math.max(16, Math.round(view.th / view.dpr * q));
      ensureField(w, h);
      const kr = KERNEL * sim.r;                       // world radius of a splat
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.viewport(0, 0, w, h);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(splat.p);
      gl.uniform2f(splat.u.uWorld, TANK_W, TANK_H);
      gl.uniform1f(splat.u.uSize, Math.min(maxPoint, 2 * kr * w / TANK_W));
      gl.bindVertexArray(ptVAO);
      gl.drawArrays(gl.POINTS, 0, n);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(view.tx, tyGL, view.tw, view.th);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(surface.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fieldTex);
      gl.uniform1i(surface.u.uField, 0);
      gl.uniform2f(surface.u.uTexel, 1 / w, 1 / h);
      // field value deep inside water: particle density × ∫(1-q²)³ over the splat disc
      gl.uniform1f(surface.u.uNorm, 1 / (sim.restDensity / (CELL * CELL) * Math.PI * kr * kr / 4));
      gl.uniform1f(surface.u.uBump, kr * w / TANK_W * 0.5);
      gl.bindVertexArray(quadVAO);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    } else {
      gl.viewport(view.tx, tyGL, view.tw, view.th);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(dots.p);
      gl.uniform2f(dots.u.uWorld, TANK_W, TANK_H);
      gl.uniform1f(dots.u.uSize, Math.min(maxPoint, Math.max(2, 2 * sim.r * view.s)));
      gl.bindVertexArray(ptVAO);
      gl.drawArrays(gl.POINTS, 0, n);
    }

    gl.viewport(view.tx, tyGL, view.tw, view.th);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(rock.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sdfTex);
    gl.uniform1i(rock.u.uSdf, 0);
    gl.uniform2f(rock.u.uWorld, TANK_W, TANK_H);
    gl.uniform1f(rock.u.uPx, 1 / view.s);
    gl.uniform2f(rock.u.uE, 0.5 / sim.fnx, 0.5 / sim.fny);
    gl.uniform1f(rock.u.uBevel, 0.03);
    gl.bindVertexArray(quadVAO);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.bindVertexArray(null);
  }

  ensureField(64, 64);   // fail early if half-float targets are missing
  return { uploadSDF, draw };
}

// ---------------------------------------------------------------------------
// Canvas 2D fallback renderer for browsers without WebGL2.
// ---------------------------------------------------------------------------
function makeCanvasRenderer() {
  const OF = 4, OW = NX * OF, OH = NY * OF;
  const obsLayer = document.createElement('canvas'); obsLayer.width = OW; obsLayer.height = OH;
  const obsCtx = obsLayer.getContext('2d'), obsImg = obsCtx.createImageData(OW, OH);
  const RF = 3, RW = NX * RF, RH = NY * RF, RN = RW * RH;
  const fD = new Float32Array(RN), fR = new Float32Array(RN), fG = new Float32Array(RN), fB = new Float32Array(RN), fT = new Float32Array(RN);
  const waterLayer = document.createElement('canvas'); waterLayer.width = RW; waterLayer.height = RH;
  const waterCtx = waterLayer.getContext('2d'), waterImg = waterCtx.createImageData(RW, RH);

  function drawObstacles() {
    const data = obsImg.data, tex = CELL / OF, e = 0.35 * CELL;
    for (let py = 0; py < OH; py++) {
      const y = TANK_H - (py + 0.5) * tex;
      for (let px = 0; px < OW; px++) {
        const x = (px + 0.5) * tex, o = 4 * (py * OW + px);
        const d = sim.sampleSDF(x, y);
        const a = clamp(0.5 - d / tex, 0, 1);
        if (a <= 0) { data[o + 3] = 0; continue; }
        let gx = sim.sampleSDF(x + e, y) - sim.sampleSDF(x - e, y);
        let gy = sim.sampleSDF(x, y + e) - sim.sampleSDF(x, y - e);
        const len = Math.hypot(gx, gy) || 1; gx /= len; gy /= len;
        const bevel = 1 - smooth(0, 0.03, -d);
        const light = (gx * -0.5 + gy * 0.866) * bevel;
        const hsh = (Math.imul(px, 73856093) ^ Math.imul(py, 19349663)) >>> 0;
        const base = 112 + ((hsh % 1000) / 1000 - 0.5) * 12 + light * 62 - (1 - bevel) * 8;
        data[o] = base; data[o + 1] = base + 4; data[o + 2] = base + 2; data[o + 3] = a * 255;
      }
    }
    obsCtx.putImageData(obsImg, 0, 0);
  }

  function blur(a) {
    for (let j = 0; j < RH; j++) {
      const row = j * RW;
      fT[row] = a[row]; fT[row + RW - 1] = a[row + RW - 1];
      for (let i = 1; i < RW - 1; i++) fT[row + i] = (a[row + i - 1] + 2 * a[row + i] + a[row + i + 1]) * 0.25;
    }
    for (let i = 0; i < RW; i++) { a[i] = fT[i]; a[RN - RW + i] = fT[RN - RW + i]; }
    for (let j = 1; j < RH - 1; j++) {
      const row = j * RW;
      for (let i = 0; i < RW; i++) a[row + i] = (fT[row + i - RW] + 2 * fT[row + i] + fT[row + i + RW]) * 0.25;
    }
  }

  function drawWater() {
    fD.fill(0); fR.fill(0); fG.fill(0); fB.fill(0);
    const pos = sim.pos, k = RF / CELL;
    for (let p = 0; p < sim.numP; p++) {
      const gx = pos[2 * p] * k - 0.5, gy = (TANK_H - pos[2 * p + 1]) * k - 0.5;
      const i0 = clamp(Math.floor(gx), 0, RW - 2), j0 = clamp(Math.floor(gy), 0, RH - 2);
      const tx = clamp(gx - i0, 0, 1), ty = clamp(gy - j0, 0, 1);
      const r = dispCol[3 * p], g = dispCol[3 * p + 1], b = dispCol[3 * p + 2], c0 = j0 * RW + i0;
      const w0 = (1 - tx) * (1 - ty), w1 = tx * (1 - ty), w2 = (1 - tx) * ty, w3 = tx * ty;
      fD[c0] += w0; fD[c0 + 1] += w1; fD[c0 + RW] += w2; fD[c0 + RW + 1] += w3;
      fR[c0] += w0 * r; fR[c0 + 1] += w1 * r; fR[c0 + RW] += w2 * r; fR[c0 + RW + 1] += w3 * r;
      fG[c0] += w0 * g; fG[c0 + 1] += w1 * g; fG[c0 + RW] += w2 * g; fG[c0 + RW + 1] += w3 * g;
      fB[c0] += w0 * b; fB[c0 + 1] += w1 * b; fB[c0 + RW] += w2 * b; fB[c0 + RW + 1] += w3 * b;
    }
    for (let pass = 0; pass < 2; pass++) { blur(fD); blur(fR); blur(fG); blur(fB); }
    const data = waterImg.data, norm = sim.restDensity / (RF * RF);
    for (let c = 0; c < RN; c++) {
      const o = 4 * c, dens = fD[c], d = dens / norm;
      if (d < 0.12) { data[o + 3] = 0; continue; }
      const inv = 1 / dens, m = (1 - smooth(0.34, 0.62, d)) * 0.42;
      data[o] = (fR[c] * inv + (1 - fR[c] * inv) * m) * 255;
      data[o + 1] = (fG[c] * inv + (1 - fG[c] * inv) * m) * 255;
      data[o + 2] = (fB[c] * inv + (1 - fB[c] * inv) * m) * 255;
      data[o + 3] = smooth(0.14, 0.34, d) * 228;
    }
    waterCtx.putImageData(waterImg, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(waterLayer, view.tx, view.ty, view.tw, view.th);
  }

  function drawParticles() {
    const pos = sim.pos, size = Math.max(1.5, 1.7 * sim.r * view.s), half = size / 2;
    for (let p = 0; p < sim.numP; p++) {
      ctx.fillStyle = `rgb(${dispCol[3 * p] * 255 | 0},${dispCol[3 * p + 1] * 255 | 0},${dispCol[3 * p + 2] * 255 | 0})`;
      ctx.fillRect(sx(pos[2 * p]) - half, sy(pos[2 * p + 1]) - half, size, size);
    }
  }

  function draw() {
    if (viewMode === 'surface') drawWater(); else drawParticles();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(obsLayer, view.tx, view.ty, view.tw, view.th);
  }
  return { draw, drawObstacles };
}

// ---------------------------------------------------------------------------
// Devices on the 2D overlay
// ---------------------------------------------------------------------------
function drawSource(s, isSel) {
  const px = sx(s.x), py = sy(s.y), S = view.s, dpr = view.dpr;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-s.angle);
  const L = NOZZLE_LEN * S, Wd = (s.width + 0.05) * S, lip = Math.max(3 * dpr, 0.025 * S);
  const body = ctx.createLinearGradient(0, -Wd / 2, 0, Wd / 2);
  body.addColorStop(0, s.on ? '#e5b664' : '#97948d');
  body.addColorStop(0.45, s.on ? '#b8812c' : '#6d6a64');
  body.addColorStop(1, s.on ? '#7a531a' : '#4a4844');
  ctx.fillStyle = body;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = dpr;
  ctx.beginPath(); ctx.roundRect(-L * 0.5, -Wd * 0.5, L, Wd, Math.min(Wd * 0.3, 6 * dpr)); ctx.fill(); ctx.stroke();
  ctx.fillStyle = s.on ? '#e9b960' : '#8d8a83';
  ctx.fillRect(L * 0.5 - lip, -Wd * 0.5 - lip * 0.6, lip, Wd + lip * 1.2);
  const c = PALETTE[s.color].rgb;
  ctx.fillStyle = `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`;
  ctx.fillRect(-L * 0.2, -Wd * 0.5 + dpr, Math.max(3 * dpr, L * 0.14), Wd - 2 * dpr);
  ctx.restore();
  if (isSel) {
    const hx = sx(s.x + Math.cos(s.angle) * 0.42), hy = sy(s.y + Math.sin(s.angle) * 0.42);
    ctx.save();
    ctx.strokeStyle = '#f0c46e'; ctx.lineWidth = 1.5 * dpr; ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.arc(px, py, (NOZZLE_LEN * 0.5 + 0.08) * S, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(sx(s.x + Math.cos(s.angle) * NOZZLE_LEN * 0.5), sy(s.y + Math.sin(s.angle) * NOZZLE_LEN * 0.5)); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = '#f0c46e'; ctx.beginPath(); ctx.arc(hx, hy, 6 * dpr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawDrain(d, isSel) {
  const px = sx(d.x), py = sy(d.y), R = d.r * view.s, dpr = view.dpr;
  ctx.save();
  ctx.fillStyle = 'rgba(2,5,7,0.92)';
  ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(200,170,110,0.55)'; ctx.lineWidth = Math.max(1, 1.5 * dpr);
  for (let k = -3; k <= 3; k++) { const y = py + k * R * 0.28; ctx.beginPath(); ctx.moveTo(px - R, y); ctx.lineTo(px + R, y); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = '#c99442'; ctx.lineWidth = Math.max(2, 3 * dpr);
  ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.stroke();
  if (isSel) {
    ctx.strokeStyle = '#f0c46e'; ctx.lineWidth = 1.5 * dpr; ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.arc(px, py, d.r * 2.6 * view.s, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
let tool = 'wall';
let brushR = 0.12;
const pointer = { x: 0, y: 0, lx: 0, ly: 0, vx: 0, vy: 0, down: false, over: false, t: 0 };
let drag = null;   // { kind, obj, mode: 'move'|'aim'|'rotate', ox, oy }

function toWorld(e) {
  const rc = canvas.getBoundingClientRect();
  const px = (e.clientX - rc.left) * view.dpr, py = (e.clientY - rc.top) * view.dpr;
  return [(px - view.tx) / view.s, TANK_H - (py - view.ty) / view.s];
}
const inside = (x, y) => x > CELL && x < TANK_W - CELL && y > CELL && y < TANK_H - CELL;

function hitDevice(x, y, kinds) {
  const tol = 10 * view.dpr / view.s;
  if (selected && selected.kind === 'source' && kinds.includes('source')) {
    const s = selected.obj, hx = s.x + Math.cos(s.angle) * 0.42, hy = s.y + Math.sin(s.angle) * 0.42;
    if (Math.hypot(x - hx, y - hy) < 0.05 + tol) return { kind: 'source', obj: s, mode: 'rotate' };
  }
  if (kinds.includes('source')) for (let k = sources.length - 1; k >= 0; k--) {
    const s = sources[k];
    if (Math.hypot(x - s.x, y - s.y) < NOZZLE_LEN * 0.5 + s.width * 0.5 + tol) return { kind: 'source', obj: s, mode: 'move' };
  }
  if (kinds.includes('drain')) for (let k = drains.length - 1; k >= 0; k--) {
    const d = drains[k];
    if (Math.hypot(x - d.x, y - d.y) < d.r + tol) return { kind: 'drain', obj: d, mode: 'move' };
  }
  return null;
}

canvas.addEventListener('pointerdown', (e) => {
  const [x, y] = toWorld(e);
  canvas.setPointerCapture(e.pointerId);
  pointer.down = true; pointer.x = pointer.lx = x; pointer.y = pointer.ly = y; pointer.vx = pointer.vy = 0; pointer.t = performance.now();
  drag = null;
  if (tool === 'select' || tool === 'source' || tool === 'drain') {
    const kinds = tool === 'select' ? ['source', 'drain'] : [tool];
    const hit = hitDevice(x, y, kinds);
    if (hit) {
      select({ kind: hit.kind, obj: hit.obj });
      drag = { ...hit, ox: x - hit.obj.x, oy: y - hit.obj.y };
    } else if (tool === 'source' && inside(x, y)) {
      const s = makeSource(x, y, -20, { color: sources.length % PALETTE.length });
      sources.push(s); select({ kind: 'source', obj: s });
      drag = { kind: 'source', obj: s, mode: 'aim', ox: 0, oy: 0 };
    } else if (tool === 'drain' && inside(x, y)) {
      const d = makeDrain(x, y);
      drains.push(d); select({ kind: 'drain', obj: d });
      drag = { kind: 'drain', obj: d, mode: 'move', ox: 0, oy: 0 };
    } else {
      select(null);
    }
  } else if (tool === 'wall' || tool === 'erase') {
    paintCircle(x, y, brushR, tool === 'wall' ? 1 : 0);
  }
});

canvas.addEventListener('pointermove', (e) => {
  const [x, y] = toWorld(e);
  const now = performance.now(), dt = Math.max(1, now - pointer.t) / 1000;
  if (pointer.down) {
    const k = 0.5;
    pointer.vx = pointer.vx * (1 - k) + clamp((x - pointer.x) / dt, -8, 8) * k;
    pointer.vy = pointer.vy * (1 - k) + clamp((y - pointer.y) / dt, -8, 8) * k;
  }
  pointer.lx = pointer.x; pointer.ly = pointer.y;
  pointer.x = x; pointer.y = y; pointer.t = now; pointer.over = true;
  if (!pointer.down) return;
  if (drag) {
    const o = drag.obj;
    if (drag.mode === 'move') {
      o.x = clamp(x - drag.ox, CELL * 1.5, TANK_W - CELL * 1.5);
      o.y = clamp(y - drag.oy, CELL * 1.5, TANK_H - CELL * 1.5);
    } else {
      const dx = x - o.x, dy = y - o.y;
      if (Math.hypot(dx, dy) > 0.06) o.angle = Math.atan2(dy, dx);
    }
    syncDevicePanel();
  } else if (tool === 'wall' || tool === 'erase') {
    paintSegment(pointer.lx, pointer.ly, x, y, brushR, tool === 'wall' ? 1 : 0);
  }
});

const endPointer = () => { pointer.down = false; drag = null; pointer.vx = pointer.vy = 0; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { pointer.over = false; });

const pourColor = () => (selected && selected.kind === 'source' ? selected.obj.color : 0);
function applyBrushTools() {
  if (!pointer.down || drag) return;
  const { pos, vel } = sim, R = brushR, R2 = R * R, x = pointer.x, y = pointer.y;
  if (tool === 'pour') {
    const count = Math.ceil(R2 * Math.PI / PARTICLE_AREA * 0.06);
    const [cr, cg, cb] = PALETTE[pourColor()].rgb;
    for (let k = 0; k < count; k++) {
      const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * R;
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
      if (!inside(px, py) || sim.sampleSDF(px, py) < sim.r) continue;
      if (!sim.addParticle(px, py, pointer.vx * 0.5, pointer.vy * 0.5 - 0.5, cr, cg, cb)) break;
    }
  } else if (tool === 'stir') {
    for (let i = 0; i < sim.numP; i++) {
      const dx = pos[2 * i] - x, dy = pos[2 * i + 1] - y, q = dx * dx + dy * dy;
      if (q > R2) continue;
      const w = (1 - Math.sqrt(q) / R) * 0.35;
      vel[2 * i] += (pointer.vx - vel[2 * i]) * w;
      vel[2 * i + 1] += (pointer.vy - vel[2 * i + 1]) * w;
    }
    pointer.vx *= 0.9; pointer.vy *= 0.9;
  } else if (tool === 'sponge') {
    for (let i = sim.numP - 1; i >= 0; i--) {
      const dx = pos[2 * i] - x, dy = pos[2 * i + 1] - y;
      if (dx * dx + dy * dy < R2) sim.removeParticle(i);
    }
  }
}

// ---------------------------------------------------------------------------
// Panel bindings
// ---------------------------------------------------------------------------
const HINTS = {
  select: '拖曳出水孔或排水孔來移動；拖曳出水孔前方的圓點可以轉方向',
  wall: '按住拖曳，畫出障礙物',
  erase: '按住拖曳，擦掉障礙物',
  source: '點一下放置出水孔，按住拖曳設定噴水方向',
  drain: '點一下放置排水孔，水碰到就會被排掉',
  pour: '按住在槽內倒水（顏色跟著選取的出水孔）',
  stir: '按住拖曳，攪動水流',
  sponge: '按住把水吸走',
};
const toolButtons = [...document.querySelectorAll('.tool')];
function setTool(t) {
  tool = t;
  for (const b of toolButtons) b.setAttribute('aria-checked', b.dataset.tool === t ? 'true' : 'false');
  $('hint').textContent = HINTS[t];
  canvas.style.cursor = t === 'select' ? 'grab' : 'crosshair';
}
for (const b of toolButtons) b.addEventListener('click', () => setTool(b.dataset.tool));

const brushIn = $('brush');
brushIn.addEventListener('input', () => { brushR = brushIn.value / 100; $('brushOut').textContent = `${brushIn.value} cm`; });

const swatchWrap = $('srcColors');
PALETTE.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = `rgb(${c.rgb.map((v) => v * 255 | 0).join(',')})`;
  b.setAttribute('aria-label', `${c.name}色`);
  b.setAttribute('aria-pressed', 'false');
  b.addEventListener('click', () => { if (selected?.kind === 'source') { selected.obj.color = i; syncDevicePanel(); } });
  swatchWrap.appendChild(b);
});

function select(sel) { selected = sel; syncDevicePanel(); }
function syncDevicePanel() {
  const isSrc = selected?.kind === 'source', isDrn = selected?.kind === 'drain';
  $('devEmpty').hidden = isSrc || isDrn;
  $('srcEdit').hidden = !isSrc;
  $('drnEdit').hidden = !isDrn;
  if (isSrc) {
    const s = selected.obj;
    $('srcTitle').textContent = `出水孔 #${sources.indexOf(s) + 1}`;
    $('srcSpeed').value = s.speed; $('srcSpeedOut').textContent = `${s.speed.toFixed(1)} m/s`;
    $('srcWidth').value = Math.round(s.width * 100); $('srcWidthOut').textContent = `${Math.round(s.width * 100)} cm`;
    const deg = Math.round(s.angle * 180 / Math.PI);
    $('srcAngle').value = deg; $('srcAngleOut').textContent = `${deg}°`;
    $('srcOn').setAttribute('aria-pressed', s.on ? 'true' : 'false');
    $('srcOn').textContent = s.on ? '出水中 · 點一下關閉' : '已關閉 · 點一下打開';
    $('srcFlow').textContent = sourceFlow(s).toFixed(1);
    [...swatchWrap.children].forEach((b, i) => b.setAttribute('aria-pressed', i === s.color ? 'true' : 'false'));
  }
  if (isDrn) {
    const d = selected.obj;
    $('drnTitle').textContent = `排水孔 #${drains.indexOf(d) + 1}`;
    $('drnR').value = Math.round(d.r * 100); $('drnROut').textContent = `${Math.round(d.r * 100)} cm`;
    $('drnPull').value = d.pull; $('drnPullOut').textContent = d.pull.toFixed(1);
  }
}
const onSrc = (id, fn) => $(id).addEventListener('input', (e) => { if (selected?.kind === 'source') { fn(selected.obj, +e.target.value); syncDevicePanel(); } });
const onDrn = (id, fn) => $(id).addEventListener('input', (e) => { if (selected?.kind === 'drain') { fn(selected.obj, +e.target.value); syncDevicePanel(); } });
onSrc('srcSpeed', (s, v) => { s.speed = v; });
onSrc('srcWidth', (s, v) => { s.width = v / 100; });
onSrc('srcAngle', (s, v) => { s.angle = v * Math.PI / 180; });
onDrn('drnR', (d, v) => { d.r = v / 100; });
onDrn('drnPull', (d, v) => { d.pull = v; });
$('srcOn').addEventListener('click', () => { if (selected?.kind === 'source') { selected.obj.on = !selected.obj.on; syncDevicePanel(); } });
function deleteSelected() {
  if (!selected) return;
  if (selected.kind === 'source') sources = sources.filter((s) => s !== selected.obj);
  else drains = drains.filter((d) => d !== selected.obj);
  select(null);
}
$('srcDel').addEventListener('click', deleteSelected);
$('drnDel').addEventListener('click', deleteSelected);

const gravIn = $('grav'), flipIn = $('flip');
gravIn.addEventListener('input', () => { sim.gravity = -9.81 * gravIn.value; $('gravOut').textContent = `${(+gravIn.value).toFixed(2)} g`; });
flipIn.addEventListener('input', () => { sim.flipRatio = +flipIn.value; $('flipOut').textContent = `${Math.round(flipIn.value * 100)}%`; });

function bindSeg(id, set) {
  const btns = [...$(id).querySelectorAll('button')];
  for (const b of btns) b.addEventListener('click', () => {
    for (const o of btns) o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    set(b.dataset.v);
  });
}
bindSeg('segView', (v) => { viewMode = v; });
bindSeg('segColor', (v) => { colorMode = v; });
bindSeg('segQuality', (v) => setQuality(v));
function syncQualityUI() {
  for (const b of $('segQuality').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.v === qualityKey ? 'true' : 'false');
}

for (const b of document.querySelectorAll('.scene')) b.addEventListener('click', () => loadScene(b.dataset.scene));
$('btnClearWater').addEventListener('click', () => { sim.numP = 0; });
$('btnClearWalls').addEventListener('click', () => { sim.clearSolids(); refreshSolids(); });

let paused = false;
const playBtn = $('btnPlay'), stepBtn = $('btnStep');
function setPaused(p) {
  paused = p;
  playBtn.textContent = p ? '繼續' : '暫停';
  playBtn.setAttribute('aria-pressed', p ? 'true' : 'false');
  stepBtn.disabled = !p;
}
playBtn.addEventListener('click', () => setPaused(!paused));
let stepOnce = false;
stepBtn.addEventListener('click', () => { stepOnce = true; });

window.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' && e.target.type !== 'range') return;
  if (e.key >= '1' && e.key <= '8') { setTool(toolButtons[+e.key - 1].dataset.tool); e.preventDefault(); }
  else if (e.code === 'Space' && tag !== 'BUTTON') { setPaused(!paused); e.preventDefault(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selected && tag !== 'INPUT') { deleteSelected(); e.preventDefault(); }
});

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const DT = 1 / 60;
let acc = 0, last = performance.now();
let statT = 0, inEMA = 0, outEMA = 0, frames = 0, fps = 0;

function simFrame() {
  if (solidsDirty) refreshSolids();
  drainedThisFrame = 0;
  const before = sim.numP;
  emit(DT);
  const emitted = sim.numP - before;
  applyBrushTools();
  const sub = clamp(Math.ceil(sim.maxSpeed() * DT / (2 * CELL)), 1, 3);
  for (let k = 0; k < sub; k++) sim.step(DT / sub);
  drainWater(DT);
  inEMA = inEMA * 0.95 + emitted * LITRES_PER_PARTICLE / DT * 0.05;
  outEMA = outEMA * 0.95 + drainedThisFrame * LITRES_PER_PARTICLE / DT * 0.05;
}

function render() {
  computeDisplayColors();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, view.cw, view.ch);
  if (glr) glr.draw(); else canvasRenderer.draw();
  for (const d of drains) drawDrain(d, selected?.obj === d);
  for (const s of sources) drawSource(s, selected?.obj === s);
  if (pointer.over && ['wall', 'erase', 'pour', 'stir', 'sponge'].includes(tool)) {
    ctx.save();
    ctx.strokeStyle = tool === 'erase' || tool === 'sponge' ? 'rgba(255,170,150,0.8)' : 'rgba(230,240,245,0.75)';
    ctx.lineWidth = 1.5 * view.dpr; ctx.setLineDash(tool === 'erase' ? [4 * view.dpr, 3 * view.dpr] : []);
    ctx.beginPath(); ctx.arc(sx(pointer.x), sy(pointer.y), brushR * view.s, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function updateStats(now) {
  frames++;
  if (now - statT < 500) return;
  fps = frames * 1000 / (now - statT);
  frames = 0; statT = now;
  $('stVol').textContent = `${(sim.numP * LITRES_PER_PARTICLE).toFixed(0)} L`;
  $('stIn').textContent = `${inEMA.toFixed(1)} L/s`;
  $('stOut').textContent = `${outEMA.toFixed(1)} L/s`;
  $('stP').textContent = `${sim.numP.toLocaleString('en-US')} / ${MAX_P.toLocaleString('en-US')}`;
  $('stFps').textContent = `${Math.round(fps)}`;
  if (selected?.kind === 'drain') $('drnFlow').textContent = selected.obj.flow.toFixed(1);
}

function frame(now) {
  const elapsed = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!paused) {
    acc += elapsed;
    // At most one step per display frame: slow machines run in slow motion instead of falling behind.
    if (acc >= DT) { simFrame(); acc = Math.min(acc - DT, DT); }
  } else if (stepOnce) {
    simFrame(); stepOnce = false;
  } else {
    if (solidsDirty) refreshSolids();
    if (pointer.down && (tool === 'pour' || tool === 'sponge')) applyBrushTools();
  }
  render();
  updateStats(now);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
let canvasRenderer = null;
let glr = null;
buildWorld(qualityKey);
try { glr = createGLRenderer(); } catch (err) { console.warn('WebGL2 renderer unavailable, using Canvas 2D:', err); glr = null; }
if (!glr) {
  canvasRenderer = makeCanvasRenderer();
  $('rendererInfo').textContent = '這個瀏覽器不支援 WebGL2，水面改用較粗的備援畫法。';
}
glCanvas.addEventListener('webglcontextlost', () => {
  glr = null;
  canvasRenderer = makeCanvasRenderer();
  canvasRenderer.drawObstacles();
});

new ResizeObserver(resize).observe(wrap);
resize();
setTool('wall');
syncQualityUI();
loadScene('cascade');
if (document.fonts) document.fonts.ready.then(drawBackground);
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
</html>
