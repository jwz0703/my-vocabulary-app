    this.writeParams(dt, input, numSpawn);
    const enc = this.device.createCommandEncoder();
    const pass = enc.beginComputePass();
    pass.setBindGroup(0, this.simBG);
    if (numSpawn > 0) this.encodeSpawn(pass, numSpawn);
    const PW = Math.ceil(this.maxP / 64), GW = Math.ceil(this.n / 64);
    const gx = Math.ceil(this.nx / 8), gy = Math.ceil(this.ny / 8);
    const run = (pipe, x, y = 1) => { pass.setPipeline(pipe); pass.dispatchWorkgroups(x, y); };
    for (let s = 0; s < this.substeps; s++) {
      run(p.integrate, PW);
      run(p.clearBins, Math.ceil(this.pnx * this.pny / 64));
      run(p.binInsert, PW);
      for (let k = 0; k < 2; k++) { run(p.separate, PW); run(p.applySep, PW); }
      run(p.collide, PW);
      run(p.clearGrid, Math.ceil(6 * this.n / 64));
      run(p.p2g, PW);
      run(p.gridNormalize, GW);
      for (let it = 0; it < PRESSURE_ITERS_GPU; it++) { run(p.pressure0, gx, gy); run(p.pressure1, gx, gy); }
      run(p.g2p, PW);
    }
    run(p.drain, PW);
    run(p.scanBlocks, this.nb);
    run(p.scanSums, 1);
    run(p.scatter, PW);
    run(p.finalize, 1);
    pass.end();
    enc.copyBufferToBuffer(this.scratch, 0, this.parts, 0, this.maxP * 32);
    this.submitWithReadback(enc);
  }

  submitWithReadback(enc) {
    const doRead = !this.readPending;
    if (doRead) enc.copyBufferToBuffer(this.ctr, 0, this.readBuf, 0, 16);
    this.device.queue.submit([enc.finish()]);
    if (!doRead) return;
    this.readPending = true;
    const rb = this.readBuf;
    rb.mapAsync(GPUMapMode.READ).then(() => {
      const a = new Uint32Array(rb.getMappedRange());
      this.numP = a[0]; this.drainedTotal = a[1];
      rb.unmap();
      this.readPending = false;
    }).catch(() => { this.readPending = false; });
  }

  ensureField(w, h) {
    if (w === this.fw && h === this.fh) return;
    if (this.fieldTex) this.fieldTex.destroy();
    this.fieldTex = this.device.createTexture({ size: [w, h], format: 'rgba16float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    this.fieldView = this.fieldTex.createView();
    this.compBG = this.device.createBindGroup({
      layout: this.pipes.compBGL,
      entries: [
        { binding: 0, resource: { buffer: this.rparams } },
        { binding: 3, resource: { buffer: this.sdfBuf } },
        { binding: 4, resource: this.fieldView },
        { binding: 5, resource: this.pipes.sampler },
      ],
    });
    this.fw = w; this.fh = h;
  }

  render() {
    const device = this.device, p = this.pipes;
    if (!gpuContext || view.tw < 1 || view.th < 1) return;
    const enc = device.createCommandEncoder();
    if (this.pending > 0) {
      // While paused, queued water (scene loads, pouring) still has to reach the GPU.
      this.writeParams(DT, this.lastInput, this.pending);
      const pass = enc.beginComputePass();
      pass.setBindGroup(0, this.simBG);
      this.encodeSpawn(pass, this.pending);
      pass.end();
    }
    const surface = viewMode === 'surface';
    const w = Math.max(16, Math.round(view.tw / view.dpr * this.q.field)), h = Math.max(16, Math.round(view.th / view.dpr * this.q.field));
    this.ensureField(w, h);
    const kr = surface ? KERNEL * this.r : 0.95 * this.r;
    const rf = this.rf, ru = this.ru;
    rf[0] = this.width; rf[1] = TANK_H; rf[2] = kr; ru[3] = colorMode === 'speed' ? 1 : 0;
    rf[4] = 1 / (REST_DENSITY / (this.h * this.h) * Math.PI * kr * kr / 4); rf[5] = kr * w / this.width * 0.5;
    ru[6] = surface ? 1 : 0; rf[7] = 1 / view.s;
    rf[8] = 1 / w; rf[9] = 1 / h; rf[10] = this.obs.fh; ru[11] = this.obs.fnx; ru[12] = this.obs.fny;
    device.queue.writeBuffer(this.rparams, 0, this.rpData);

    if (surface) {
      const fp = enc.beginRenderPass({ colorAttachments: [{ view: this.fieldView, loadOp: 'clear', clearValue: { r: 0, g: 0, b: 0, a: 0 }, storeOp: 'store' }] });
      fp.setPipeline(p.splat); fp.setBindGroup(0, this.partBG); fp.draw(6, this.maxP);
      fp.end();
    }
    const out = enc.beginRenderPass({ colorAttachments: [{ view: gpuContext.getCurrentTexture().createView(), loadOp: 'clear', clearValue: { r: 0, g: 0, b: 0, a: 0 }, storeOp: 'store' }] });
    out.setViewport(view.tx, view.ty, view.tw, view.th, 0, 1);
    if (!surface) { out.setPipeline(p.dots); out.setBindGroup(0, this.partBG); out.draw(6, this.maxP); }
    out.setPipeline(p.composite); out.setBindGroup(0, this.compBG); out.draw(3);
    out.end();
    this.submitWithReadback(enc);
  }

  relax() {}

  async exportParticles() {
    const device = this.device, bytes = this.maxP * 32;
    const st = device.createBuffer({ size: 16 + bytes, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
    const enc = device.createCommandEncoder();
    enc.copyBufferToBuffer(this.ctr, 0, st, 0, 16);
    enc.copyBufferToBuffer(this.parts, 0, st, 16, bytes);
    device.queue.submit([enc.finish()]);
    await st.mapAsync(GPUMapMode.READ);
    const count = Math.min(new Uint32Array(st.getMappedRange(0, 16))[0], this.maxP);
    const f = new Float32Array(st.getMappedRange(16, bytes));
    const pos = new Float32Array(2 * count), vel = new Float32Array(2 * count), col = new Float32Array(3 * count);
    let n = 0;
    for (let i = 0; i < count; i++) {
      const o = i * 8;
      if (f[o + 7] < 0.5) continue;
      pos[2 * n] = f[o]; pos[2 * n + 1] = f[o + 1]; vel[2 * n] = f[o + 2]; vel[2 * n + 1] = f[o + 3];
      col[3 * n] = f[o + 4]; col[3 * n + 1] = f[o + 5]; col[3 * n + 2] = f[o + 6];
      n++;
    }
    st.unmap(); st.destroy();
    return { n, r: this.r, pos, vel, col };
  }

  destroy() {
    for (const b of this.buffers) b.destroy();
    if (this.fieldTex) this.fieldTex.destroy();
  }
}

// ---------------------------------------------------------------------------
// Active engine and the globals the app code reads from it.
// ---------------------------------------------------------------------------
let engine = null;
let CELL = 0.04, TANK_W = 4;
let engineNote = '';
let switching = false;

function importParticles(e, data, oldArea) {
  const ratio = oldArea / e.particleArea, whole = Math.floor(ratio), frac = ratio - whole;
  for (let p = 0; p < data.n; p++) {
    const n = whole + (Math.random() < frac ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * data.r * 1.2;
      const x = data.pos[2 * p] + Math.cos(a) * rr, y = data.pos[2 * p + 1] + Math.sin(a) * rr;
      if (e.obs.sampleSDF(x, y) < 0) continue;
      if (!e.spawn(x, y, data.vel[2 * p], data.vel[2 * p + 1], data.col[3 * p], data.col[3 * p + 1], data.col[3 * p + 2])) { e.relax(); return; }
    }
  }
  e.relax();
}

// Build a new engine (or the same kind at another quality), carrying over obstacles, devices and water.
async function rebuildEngine(kind) {
  if (switching) return;
  switching = true;
  setEngineBusy(true);
  const old = engine;
  let data = null;
  if (old) { try { data = await old.exportParticles(); } catch (err) { data = null; } }
  let ne = null;
  if (kind === 'gpu') {
    try { ne = await GpuEngine.create(prefs.quality.gpu); }
    catch (err) { console.warn('WebGPU engine unavailable:', err); engineNote = '這個瀏覽器無法啟動 WebGPU，已改用 CPU 運算。'; }
  }
  if (!ne) ne = new CpuEngine(prefs.quality.cpu);
  if (old) ne.obs.resampleFrom(old.obs);
  engine = ne;
  CELL = ne.h; TANK_W = ne.width;
  ne.obstaclesChanged();
  solidsDirty = false;
  if (old) {
    if (data) importParticles(ne, data, old.particleArea);
    for (const s of sources) { s.x = clamp(s.x, CELL * 1.5, TANK_W - CELL * 1.5); s.acc = 0; }
    for (const d of drains) d.x = clamp(d.x, CELL * 1.5, TANK_W - CELL * 1.5);
    old.destroy();
  }
  totalsAt = { t: simTime, in: totalIn, out: ne.drainedTotal };
  gpuCanvas.hidden = ne.kind !== 'gpu';
  glCanvas.hidden = ne.kind !== 'cpu';
  resize();
  syncEngineUI();
  setEngineBusy(false);
  switching = false;
}

// ---------------------------------------------------------------------------
// Devices
// ---------------------------------------------------------------------------
const PALETTE = [
  { name: '藍', rgb: [0.20, 0.50, 0.93] },
  { name: '青', rgb: [0.10, 0.72, 0.72] },
  { name: '玫瑰', rgb: [0.91, 0.30, 0.55] },
  { name: '琥珀', rgb: [0.96, 0.64, 0.18] },
  { name: '草綠', rgb: [0.42, 0.78, 0.30] },
];
const NOZZLE_LEN = 0.2;
let sources = [], drains = [];
let selected = null;           // { kind: 'source'|'drain', obj }
let nextId = 1;
let totalIn = 0, simTime = 0;

function makeSource(x, y, angleDeg, opts = {}) {
  return { id: nextId++, x, y, angle: angleDeg * Math.PI / 180, speed: opts.speed ?? 2.5, width: opts.width ?? 0.14, color: opts.color ?? 0, on: true, acc: 0, row: 0 };
}
function makeDrain(x, y, opts = {}) {
  return { id: nextId++, x, y, r: opts.r ?? 0.14, pull: opts.pull ?? 1 };
}
const sourceFlow = (s) => s.width * s.speed * DEPTH * 1000;   // L/s

function emit(dt) {
  // Rows of particles laid across the nozzle at the packing spacing, so the jet leaves as a clean sheet.
  const r = engine.r, spacing = 2 * r, rowGap = Math.sqrt(3) * r, obs = engine.obs;
  for (const s of sources) {
    if (!s.on) continue;
    const dx = Math.cos(s.angle), dy = Math.sin(s.angle), nx = -dy, ny = dx;
    const mx = s.x + dx * NOZZLE_LEN * 0.5, my = s.y + dy * NOZZLE_LEN * 0.5;
    const count = Math.max(1, Math.round(s.width / spacing));
    const [cr, cg, cb] = PALETTE[s.color].rgb;
    s.acc += s.speed * dt;
    while (s.acc >= rowGap) {
      s.acc -= rowGap;
      const shift = (s.row++ & 1) ? 0.25 : -0.25;
      let full = false;
      for (let k = 0; k < count; k++) {
        const t = ((k + 0.5 + shift) / count - 0.5) * s.width + (Math.random() - 0.5) * 0.1 * r;
        const px = mx + nx * t + dx * s.acc, py = my + ny * t + dy * s.acc;
        if (obs.sampleSDF(px, py) < r) continue;
        if (!engine.spawn(px, py, dx * s.speed, dy * s.speed, cr, cg, cb)) { full = true; break; }
        totalIn++;
      }
      if (full) { s.acc = 0; break; }
    }
  }
}

// ---------------------------------------------------------------------------
// Painting helpers (world coordinates, metres)
// ---------------------------------------------------------------------------
let solidsDirty = false;   // obstacle field changed since the engine last saw it
function paintCircle(x, y, R, val) {
  engine.obs.stampCircle(x, y, R, val === 1);
  solidsDirty = true;
}
function paintSegment(x0, y0, x1, y1, R, val) {
  const len = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.ceil(len / (R * 0.3)));
  for (let k = 0; k <= steps; k++) { const t = k / steps; paintCircle(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, R, val); }
}
function paintRect(x0, y0, x1, y1) {
  engine.obs.stampBox(x0, y0, x1, y1);
  solidsDirty = true;
}
function fillWater(x0, y0, x1, y1, rgb) {
  const r = engine.r, dx = 2 * r, dy = Math.sqrt(3) * r, obs = engine.obs;
  let row = 0;
  for (let y = y0 + r; y < y1; y += dy, row++) {
    for (let x = x0 + r + (row % 2 ? r : 0); x < x1; x += dx) {
      if (obs.sampleSDF(x, y) < r) continue;
      if (!engine.spawn(x, y, 0, 0, rgb[0], rgb[1], rgb[2])) return;
    }
  }
}

// ---------------------------------------------------------------------------
// Scenes (positions as fractions of the tank so they fit any aspect)
// ---------------------------------------------------------------------------
const SCENES = {
  cascade() {
    const W = TANK_W, H = TANK_H;
    for (let k = 0; k < 4; k++) {
      const x0 = W * (0.04 + k * 0.205), x1 = x0 + W * 0.19, y = H * (0.74 - k * 0.165);
      paintSegment(x0, y + 0.02, x1, y - 0.03, 0.045, 1);
      paintSegment(x1, y - 0.03, x1, y + 0.11, 0.04, 1);
    }
    paintCircle(W * 0.5, 0.12, 0.2, 1);
    sources.push(makeSource(W * 0.07, H * 0.9, -15, { speed: 2.2, width: 0.14, color: 0 }));
    drains.push(makeDrain(W * 0.93, 0.18, { r: 0.13, pull: 1 }));
    fillWater(CELL, CELL, W - CELL, H * 0.1, PALETTE[1].rgb);
  },
  funnel() {
    const W = TANK_W, H = TANK_H;
    paintSegment(W * 0.14, H * 0.66, W * 0.45, H * 0.45, 0.045, 1);
    paintSegment(W * 0.86, H * 0.66, W * 0.55, H * 0.45, 0.045, 1);
    for (let row = 0; row < 3; row++) {
      const cols = 6 - (row % 2), y = H * (0.33 - row * 0.085);
      for (let c = 0; c < cols; c++) paintCircle(W * 0.5 + (c - (cols - 1) / 2) * W * 0.085, y, 0.055, 1);
    }
    sources.push(makeSource(W * 0.06, H * 0.86, -8, { speed: 2.4, width: 0.12, color: 0 }));
    sources.push(makeSource(W * 0.94, H * 0.86, 188, { speed: 2.4, width: 0.12, color: 2 }));
    drains.push(makeDrain(W * 0.5, 0.16, { r: 0.15, pull: 1.2 }));
    fillWater(CELL, CELL, W - CELL, H * 0.06, PALETTE[3].rgb);
  },
  dam() {
    const W = TANK_W, H = TANK_H;
    paintCircle(W * 0.58, 0.28, 0.22, 1);
    paintRect(W * 0.8, CELL, W * 0.84, H * 0.22);
    fillWater(CELL, CELL, W * 0.36, H * 0.72, PALETTE[0].rgb);
  },
  empty() {
    const W = TANK_W, H = TANK_H;
    sources.push(makeSource(W * 0.12, H * 0.8, -30, { speed: 2.6, width: 0.14, color: 0 }));
    fillWater(CELL, CELL, W - CELL, H * 0.12, PALETTE[0].rgb);
  },
};

function loadScene(name) {
  if (!engine || switching) return;
  engine.clearWater();
  sources = []; drains = []; select(null);
  engine.obs.clear();
  SCENES[name]();
  engine.obstaclesChanged();
  solidsDirty = false;
}

// ---------------------------------------------------------------------------
// View: stacked canvases — background, WebGL or WebGPU (water + obstacles), 2D overlay (devices).
// ---------------------------------------------------------------------------
const view = { dpr: 1, cw: 1, ch: 1, tx: 0, ty: 0, tw: 1, th: 1, s: 1 };
const sx = (x) => view.tx + x * view.s;
const sy = (y) => view.ty + (TANK_H - y) * view.s;

function resize() {
  if (!engine) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = wrap.clientHeight;
  view.dpr = dpr; view.cw = Math.max(1, Math.round(w * dpr)); view.ch = Math.max(1, Math.round(h * dpr));
  for (const c of [bgCanvas, glCanvas, gpuCanvas, canvas]) { c.width = view.cw; c.height = view.ch; }
  const pad = 10 * dpr;
  const s = Math.min((view.cw - 2 * pad) / TANK_W, (view.ch - 2 * pad) / TANK_H);
  view.tw = Math.max(1, Math.round(TANK_W * s)); view.th = Math.max(1, Math.round(TANK_H * s));
  view.s = view.th / TANK_H;
  view.tx = Math.round((view.cw - view.tw) / 2); view.ty = Math.round((view.ch - view.th) / 2);
  drawBackground();
}

function drawBackground() {
  const g = bgCanvas.getContext('2d');
  g.clearRect(0, 0, view.cw, view.ch);
  const x0 = view.tx, y0 = view.ty, w = view.tw, h = view.th;
  const grad = g.createLinearGradient(0, y0, 0, y0 + h);
  grad.addColorStop(0, '#16262d'); grad.addColorStop(1, '#0a1419');
  g.fillStyle = grad; g.fillRect(x0, y0, w, h);
  // 10 cm grid, stronger every 50 cm
  const line = Math.max(1, Math.round(view.dpr * 0.6));
  for (let k = 0; k * 0.1 <= TANK_W + 1e-6; k++) {
    g.fillStyle = k % 5 === 0 ? 'rgba(170,210,225,0.075)' : 'rgba(170,210,225,0.03)';
    g.fillRect(Math.round(sx(k * 0.1)), y0, line, h);
  }
  for (let k = 0; k * 0.1 <= TANK_H + 1e-6; k++) {
    g.fillStyle = k % 5 === 0 ? 'rgba(170,210,225,0.075)' : 'rgba(170,210,225,0.03)';
    g.fillRect(x0, Math.round(sy(k * 0.1)), w, line);
  }
  // depth ruler on the inside of the left wall
  const fs = Math.round(10 * view.dpr);
  g.font = `500 ${fs}px "IBM Plex Mono", ui-monospace, monospace`;
  g.textBaseline = 'middle';
  for (let k = 1; k * 0.1 < TANK_H - CELL; k++) {
    const y = sy(k * 0.1), xl = sx(CELL);
    const major = k % 5 === 0;
    g.fillStyle = major ? 'rgba(210,230,236,0.55)' : 'rgba(210,230,236,0.3)';
    g.fillRect(xl, Math.round(y), (major ? 12 : 6) * view.dpr, Math.max(1, view.dpr));
    if (major) g.fillText(`${k * 10}`, xl + 15 * view.dpr, y);
  }
  g.fillStyle = 'rgba(210,230,236,0.45)';
  g.fillText('cm', sx(CELL) + 15 * view.dpr, sy(TANK_H - CELL) + 10 * view.dpr);
}

// ---------------------------------------------------------------------------
// Devices on the 2D overlay
// ---------------------------------------------------------------------------
function drawSource(s, isSel) {
  const px = sx(s.x), py = sy(s.y), S = view.s, dpr = view.dpr;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(-s.angle);
  const L = NOZZLE_LEN * S, Wd = (s.width + 0.05) * S, lip = Math.max(3 * dpr, 0.025 * S);
  const body = ctx.createLinearGradient(0, -Wd / 2, 0, Wd / 2);
  body.addColorStop(0, s.on ? '#e5b664' : '#97948d');
  body.addColorStop(0.45, s.on ? '#b8812c' : '#6d6a64');
  body.addColorStop(1, s.on ? '#7a531a' : '#4a4844');
  ctx.fillStyle = body;
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = dpr;
  ctx.beginPath(); ctx.roundRect(-L * 0.5, -Wd * 0.5, L, Wd, Math.min(Wd * 0.3, 6 * dpr)); ctx.fill(); ctx.stroke();
  ctx.fillStyle = s.on ? '#e9b960' : '#8d8a83';
  ctx.fillRect(L * 0.5 - lip, -Wd * 0.5 - lip * 0.6, lip, Wd + lip * 1.2);
  const c = PALETTE[s.color].rgb;
  ctx.fillStyle = `rgb(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0})`;
  ctx.fillRect(-L * 0.2, -Wd * 0.5 + dpr, Math.max(3 * dpr, L * 0.14), Wd - 2 * dpr);
  ctx.restore();
  if (isSel) {
    const hx = sx(s.x + Math.cos(s.angle) * 0.42), hy = sy(s.y + Math.sin(s.angle) * 0.42);
    ctx.save();
    ctx.strokeStyle = '#f0c46e'; ctx.lineWidth = 1.5 * dpr; ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.arc(px, py, (NOZZLE_LEN * 0.5 + 0.08) * S, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(sx(s.x + Math.cos(s.angle) * NOZZLE_LEN * 0.5), sy(s.y + Math.sin(s.angle) * NOZZLE_LEN * 0.5)); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = '#f0c46e'; ctx.beginPath(); ctx.arc(hx, hy, 6 * dpr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawDrain(d, isSel) {
  const px = sx(d.x), py = sy(d.y), R = d.r * view.s, dpr = view.dpr;
  ctx.save();
  ctx.fillStyle = 'rgba(2,5,7,0.92)';
  ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(200,170,110,0.55)'; ctx.lineWidth = Math.max(1, 1.5 * dpr);
  for (let k = -3; k <= 3; k++) { const y = py + k * R * 0.28; ctx.beginPath(); ctx.moveTo(px - R, y); ctx.lineTo(px + R, y); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle = '#c99442'; ctx.lineWidth = Math.max(2, 3 * dpr);
  ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.stroke();
  if (isSel) {
    ctx.strokeStyle = '#f0c46e'; ctx.lineWidth = 1.5 * dpr; ctx.setLineDash([4 * dpr, 4 * dpr]);
    ctx.beginPath(); ctx.arc(px, py, d.r * 2.6 * view.s, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
let tool = 'wall';
let brushR = 0.12;
const pointer = { x: 0, y: 0, lx: 0, ly: 0, vx: 0, vy: 0, down: false, over: false, t: 0 };
let drag = null;   // { kind, obj, mode: 'move'|'aim'|'rotate', ox, oy }

function toWorld(e) {
  const rc = canvas.getBoundingClientRect();
  const px = (e.clientX - rc.left) * view.dpr, py = (e.clientY - rc.top) * view.dpr;
  return [(px - view.tx) / view.s, TANK_H - (py - view.ty) / view.s];
}
const inside = (x, y) => x > CELL && x < TANK_W - CELL && y > CELL && y < TANK_H - CELL;

function hitDevice(x, y, kinds) {
  const tol = 10 * view.dpr / view.s;
  if (selected && selected.kind === 'source' && kinds.includes('source')) {
    const s = selected.obj, hx = s.x + Math.cos(s.angle) * 0.42, hy = s.y + Math.sin(s.angle) * 0.42;
    if (Math.hypot(x - hx, y - hy) < 0.05 + tol) return { kind: 'source', obj: s, mode: 'rotate' };
  }
  if (kinds.includes('source')) for (let k = sources.length - 1; k >= 0; k--) {
    const s = sources[k];
    if (Math.hypot(x - s.x, y - s.y) < NOZZLE_LEN * 0.5 + s.width * 0.5 + tol) return { kind: 'source', obj: s, mode: 'move' };
  }
  if (kinds.includes('drain')) for (let k = drains.length - 1; k >= 0; k--) {
    const d = drains[k];
    if (Math.hypot(x - d.x, y - d.y) < d.r + tol) return { kind: 'drain', obj: d, mode: 'move' };
  }
  return null;
}

canvas.addEventListener('pointerdown', (e) => {
  if (!engine || switching) return;
  const [x, y] = toWorld(e);
  canvas.setPointerCapture(e.pointerId);
  pointer.down = true; pointer.x = pointer.lx = x; pointer.y = pointer.ly = y; pointer.vx = pointer.vy = 0; pointer.t = performance.now();
  drag = null;
  if (tool === 'select' || tool === 'source' || tool === 'drain') {
    const kinds = tool === 'select' ? ['source', 'drain'] : [tool];
    const hit = hitDevice(x, y, kinds);
    if (hit) {
      select({ kind: hit.kind, obj: hit.obj });
      drag = { ...hit, ox: x - hit.obj.x, oy: y - hit.obj.y };
    } else if (tool === 'source' && inside(x, y)) {
      const s = makeSource(x, y, -20, { color: sources.length % PALETTE.length });
      sources.push(s); select({ kind: 'source', obj: s });
      drag = { kind: 'source', obj: s, mode: 'aim', ox: 0, oy: 0 };
    } else if (tool === 'drain' && inside(x, y)) {
      const d = makeDrain(x, y);
      drains.push(d); select({ kind: 'drain', obj: d });
      drag = { kind: 'drain', obj: d, mode: 'move', ox: 0, oy: 0 };
    } else {
      select(null);
    }
  } else if (tool === 'wall' || tool === 'erase') {
    paintCircle(x, y, brushR, tool === 'wall' ? 1 : 0);
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!engine) return;
  const [x, y] = toWorld(e);
  const now = performance.now(), dt = Math.max(1, now - pointer.t) / 1000;
  if (pointer.down) {
    const k = 0.5;
    pointer.vx = pointer.vx * (1 - k) + clamp((x - pointer.x) / dt, -8, 8) * k;
    pointer.vy = pointer.vy * (1 - k) + clamp((y - pointer.y) / dt, -8, 8) * k;
  }
  pointer.lx = pointer.x; pointer.ly = pointer.y;
  pointer.x = x; pointer.y = y; pointer.t = now; pointer.over = true;
  if (!pointer.down || switching) return;
  if (drag) {
    const o = drag.obj;
    if (drag.mode === 'move') {
      o.x = clamp(x - drag.ox, CELL * 1.5, TANK_W - CELL * 1.5);
      o.y = clamp(y - drag.oy, CELL * 1.5, TANK_H - CELL * 1.5);
    } else {
      const dx = x - o.x, dy = y - o.y;
      if (Math.hypot(dx, dy) > 0.06) o.angle = Math.atan2(dy, dx);
    }
    syncDevicePanel();
  } else if (tool === 'wall' || tool === 'erase') {
    paintSegment(pointer.lx, pointer.ly, x, y, brushR, tool === 'wall' ? 1 : 0);
  }
});

const endPointer = () => { pointer.down = false; drag = null; pointer.vx = pointer.vy = 0; };
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { pointer.over = false; });

const pourColor = () => (selected && selected.kind === 'source' ? selected.obj.color : 0);
function pour() {
  const R = brushR, x = pointer.x, y = pointer.y, obs = engine.obs;
  const count = Math.ceil(R * R * Math.PI / engine.particleArea * 0.06);
  const [cr, cg, cb] = PALETTE[pourColor()].rgb;
  for (let k = 0; k < count; k++) {
    const a = Math.random() * Math.PI * 2, rr = Math.sqrt(Math.random()) * R;
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    if (!inside(px, py) || obs.sampleSDF(px, py) < engine.r) continue;
    if (!engine.spawn(px, py, pointer.vx * 0.5, pointer.vy * 0.5 - 0.5, cr, cg, cb)) break;
  }
}
function brushInput() {
  if (!pointer.down || drag || (tool !== 'stir' && tool !== 'sponge')) return null;
  return { mode: tool, x: pointer.x, y: pointer.y, R: brushR, vx: pointer.vx, vy: pointer.vy };
}

};

function select(sel) { selected = sel; syncDevicePanel(); }
function syncDevicePanel() {

const onSrc = (id, fn) => $(id).addEventListener('input', (e) => { if (selected?.kind === 'source') { fn(selected.obj, +e.target.value); syncDevicePanel(); } });
const onDrn = (id, fn) => $(id).addEventListener('input', (e) => { if (selected?.kind === 'drain') { fn(selected.obj, +e.target.value); syncDevicePanel(); } });
onSrc('srcSpeed', (s, v) => { s.speed = v; });
onSrc('srcWidth', (s, v) => { s.width = v / 100; });

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const DT = 1 / 60;
let acc = 0, last = performance.now();
let statT = 0, frames = 0, fps = 0, inRate = 0, outRate = 0;
let totalsAt = { t: 0, in: 0, out: 0 };

function simFrame() {
  if (solidsDirty) { engine.obstaclesChanged(); solidsDirty = false; }
  emit(DT);
  if (pointer.down && !drag && tool === 'pour') pour();
  engine.step(DT, { drains, brush: brushInput(), gravity: -9.81 * +gravIn.value, flipRatio: +flipIn.value });
  if (tool === 'stir') { pointer.vx *= 0.9; pointer.vy *= 0.9; }
  simTime += DT;
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, view.cw, view.ch);
  engine.render();
  for (const d of drains) drawDrain(d, selected?.obj === d);
  for (const s of sources) drawSource(s, selected?.obj === s);
  if (pointer.over && ['wall', 'erase', 'pour', 'stir', 'sponge'].includes(tool)) {
    ctx.save();
    ctx.strokeStyle = tool === 'erase' || tool === 'sponge' ? 'rgba(255,170,150,0.8)' : 'rgba(230,240,245,0.75)';
    ctx.lineWidth = 1.5 * view.dpr; ctx.setLineDash(tool === 'erase' ? [4 * view.dpr, 3 * view.dpr] : []);
    ctx.beginPath(); ctx.arc(sx(pointer.x), sy(pointer.y), brushR * view.s, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function updateStats(now) {
  frames++;
  if (now - statT < 500) return;
  fps = frames * 1000 / (now - statT);
  frames = 0; statT = now;
  const lpp = engine.particleArea * DEPTH * 1000;   // litres per particle
  const dt = simTime - totalsAt.t;
  if (dt > 0) {
    inRate = inRate * 0.5 + (totalIn - totalsAt.in) * lpp / dt * 0.5;
    outRate = outRate * 0.5 + Math.max(0, engine.drainedTotal - totalsAt.out) * lpp / dt * 0.5;
  }
  totalsAt = { t: simTime, in: totalIn, out: engine.drainedTotal };
  $('stVol').textContent = `${(engine.numP * lpp).toFixed(0)} L`;
  $('stIn').textContent = `${inRate.toFixed(1)} L/s`;
  $('stOut').textContent = `${outRate.toFixed(1)} L/s`;
  $('stP').textContent = `${engine.numP.toLocaleString('en-US')} / ${engine.maxP.toLocaleString('en-US')}`;
  $('stFps').textContent = `${Math.round(fps)}`;
}

function frame(now) {
  const elapsed = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!switching) {
    if (!paused) {
      acc += elapsed;
      // At most one step per display frame: slow machines run in slow motion instead of falling behind.
      if (acc >= DT) { simFrame(); acc = Math.min(acc - DT, DT); }
    } else if (stepOnce) {
      simFrame(); stepOnce = false;
    } else if (solidsDirty) {
      engine.obstaclesChanged(); solidsDirty = false;
    }
  }
  render();
  updateStats(now);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
new ResizeObserver(resize).observe(wrap);
setTool('wall');
(async () => {
  await rebuildEngine(prefs.engine);
  loadScene('cascade');
  if (document.fonts) document.fonts.ready.then(() => { if (engine) drawBackground(); });
  requestAnimationFrame((t) => { last = t; statT = t; frame(t); });
})();
})();
</script>
</body>
</html>
