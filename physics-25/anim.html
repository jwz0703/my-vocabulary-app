<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:NotoTC;font-weight:700;src:url(fonts/tc-latin-700.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:NotoTC;font-weight:900;src:url(fonts/tc-latin-900.woff2);unicode-range:U+0000-00FF,U+2000-206F,U+2212}
@font-face{font-family:NotoTC;font-weight:500;src:url(fonts/tc-500.woff2)}
@font-face{font-family:NotoTC;font-weight:700;src:url(fonts/tc-700.woff2)}
@font-face{font-family:NotoTC;font-weight:900;src:url(fonts/tc-900.woff2)}
html,body{margin:0;background:#000}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Problem 25 explainer. renderFrame(f) draws frame f; CUES lists every sound hit for audio.py.
const W = 1920, H = 1080, FPS = 60, DUR = 82;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = 'NotoTC, "WenQuanYi Zen Hei", "DejaVu Sans", sans-serif';
const C = { bg0: '#060a18', bg1: '#16245a', yel: '#FFD23F', cyan: '#3DDCFF', red: '#FF5D73', grn: '#4CF2A0',
  wht: '#F4F6FF', dim: '#8E9AC8', rope: '#E0B36A', brown: '#8B5A2B', dbrown: '#6B4220', beige: '#F5CFA0', pur: '#B69CFF', lcyan: '#9BEFFF' };

// ---- problem numbers
const M = 14.6, G = 9.8, TH = 11.0 * Math.PI / 180;
const WT = M * G;                       // 143.08 N
const TEN = WT / (2 * Math.sin(TH));    // 374.9 N

// ---- scene boundaries
const S = { hook: 0, prob: 6, setup: 16, fbd: 26, dec: 36, calc: 46, cmp: 58, why: 66, end: 76 };
const BOUNDS = [6, 16, 26, 36, 46, 58, 66, 76];

// ---- utils
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIn = t => t * t * t;
const eIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// pop-in: returns {a, s} for an element appearing at t0 (and leaving at t1)
function pop(t, t0, t1 = 1e9, d = .4) {
  const i = P(t, t0, t0 + d), o = 1 - P(t, t1 - .25, t1);
  return { a: Math.min(clamp(i * 3), o), s: (i < 1 ? eBack(i) : 1) * lerp(.9, 1, o) };
}

// ---- cues (sound design), built statically so audio.py can read them
const CUES = [];
const cue = (t, type, o = {}) => CUES.push(Object.assign({ t: +t.toFixed(3), type }, o));

// ---- drawing helpers
function font(size, weight = 900) { return `${weight} ${size}px ${FONT}`; }
function txt(s, x, y, o = {}) {
  const { size = 48, color = C.wht, weight = 900, align = 'center', alpha = 1, scale = 1, glow = 0, stroke = null, rot = 0 } = o;
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = font(size, weight); ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = stroke[1]; ctx.strokeStyle = stroke[0]; ctx.lineJoin = 'round'; ctx.strokeText(s, 0, 0); }
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color; ctx.fillText(s, 0, 0);
  ctx.restore();
}
function measureRich(parts, size, weight = 900) {
  return parts.map(p => { ctx.font = font(p[2]?.size || size, p[2]?.weight || weight); return ctx.measureText(p[0]).width; });
}
// parts: [[text, color, {size, weight}], ...]
function rich(parts, x, y, o = {}) {
  const { size = 48, weight = 900, alpha = 1, scale = 1, glow = 0, align = 'center', rot = 0 } = o;
  if (alpha <= 0 || scale <= 0) return 0;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const ws = measureRich(parts, size, weight), tot = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? -tot / 2 : align === 'right' ? -tot : 0;
  parts.forEach((p, i) => {
    ctx.font = font(p[2]?.size || size, p[2]?.weight || weight);
    const col = p[1] || C.wht;
    ctx.shadowColor = col; ctx.shadowBlur = glow && col !== C.wht ? glow : 0;
    ctx.fillStyle = col; ctx.fillText(p[0], cx, 0); cx += ws[i];
  });
  ctx.restore(); return tot;
}
function rrect(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
// caption pill at the bottom of the screen
function caption(parts, t, t0, t1, o = {}) {
  const { y = 968, size = 46 } = o;
  const p = pop(t, t0, t1, .35); if (p.a <= 0) return;
  const w = measureRich(parts, size).reduce((a, b) => a + b, 0) + 90;
  ctx.save(); ctx.globalAlpha *= p.a; ctx.translate(W / 2, y); ctx.scale(p.s, p.s);
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 30;
  rrect(-w / 2, -44, w, 88, 44, 'rgba(10,14,36,.88)', null);
  ctx.shadowBlur = 0;
  rrect(-w / 2, -44, w, 88, 44, null, 'rgba(255,210,63,.75)', 3);
  ctx.fillStyle = C.yel; ctx.beginPath(); ctx.arc(-w / 2 + 34, 0, 8, 0, 7); ctx.fill();
  ctx.restore();
  rich(parts, W / 2 + 14, y + 2, { size, alpha: p.a, scale: p.s, glow: 12 });
}
// small label tag (e.g. section titles)
function tag(s, x, y, t, t0, color = C.yel, o = {}) {
  const { size = 38, t1 = 1e9 } = o;
  const p = pop(t, t0, t1); if (p.a <= 0) return;
  ctx.font = font(size); const w = ctx.measureText(s).width + 56;
  ctx.save(); ctx.globalAlpha *= p.a; ctx.translate(x, y); ctx.scale(p.s, p.s);
  ctx.shadowColor = color; ctx.shadowBlur = 24;
  rrect(0, -size * .8, w, size * 1.6, 12, color, null);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#0a0f24'; ctx.font = font(size); ctx.textBaseline = 'middle'; ctx.fillText(s, 28, 2);
  ctx.restore();
}
function arrow(x1, y1, x2, y2, color, o = {}) {
  const { w = 10, head = 36, alpha = 1, prog = 1, glow = 22, dash = null } = o;
  if (prog <= 0 || alpha <= 0) return;
  const x = lerp(x1, x2, prog), y = lerp(y1, y2, prog);
  const ang = Math.atan2(y - y1, x - x1), len = Math.hypot(x - x1, y - y1);
  const hl = Math.min(head, len * .7);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = glow;
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x - Math.cos(ang) * hl * .7, y - Math.sin(ang) * hl * .7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - Math.cos(ang - .45) * hl, y - Math.sin(ang - .45) * hl);
  ctx.lineTo(x - Math.cos(ang + .45) * hl, y - Math.sin(ang + .45) * hl);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function dashLine(x1, y1, x2, y2, color, o = {}) {
  const { w = 3, alpha = 1, prog = 1, dash = [14, 12] } = o;
  if (prog <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(lerp(x1, x2, prog), lerp(y1, y2, prog)); ctx.stroke(); ctx.restore();
}
function check(x, y, s, color, prog) {
  if (prog <= 0) return;
  const pts = [[-.5, 0], [-.15, .35], [.55, -.4]];
  const l1 = Math.hypot(.35, .35), l2 = Math.hypot(.7, .75), tot = l1 + l2, d = prog * tot;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.lineWidth = .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 20 / s;
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  if (d < l1) ctx.lineTo(lerp(pts[0][0], pts[1][0], d / l1), lerp(pts[0][1], pts[1][1], d / l1));
  else { ctx.lineTo(...pts[1]); const u = (d - l1) / l2; ctx.lineTo(lerp(pts[1][0], pts[2][0], u), lerp(pts[1][1], pts[2][1], u)); }
  ctx.stroke(); ctx.restore();
}
function rope(x1, y1, x2, y2, o = {}) {
  const { w = 9, alpha = 1, prog = 1 } = o;
  if (prog <= 0 || alpha <= 0) return;
  const x = lerp(x1, x2, prog), y = lerp(y1, y2, prog);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 6;
  ctx.strokeStyle = C.rope; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(120,70,20,.55)'; ctx.lineWidth = w * .5; ctx.setLineDash([w * .7, w * .9]);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  ctx.restore();
}
function post(x, yTop, yBot, dy = 0) {
  ctx.save(); ctx.translate(0, dy);
  const g = ctx.createLinearGradient(x - 24, 0, x + 24, 0);
  g.addColorStop(0, '#3a4470'); g.addColorStop(.5, '#6c78b0'); g.addColorStop(1, '#2c3458');
  ctx.fillStyle = g; ctx.fillRect(x - 22, yTop, 44, yBot - yTop);
  rrect(x - 34, yTop - 22, 68, 30, 8, '#8a96d0', null);
  ctx.fillStyle = C.yel; ctx.beginPath(); ctx.arc(x, yTop, 9, 0, 7); ctx.fill();
  ctx.restore();
}
// Cartoon monkey. (x, y) is where its hands grip; it hangs below that point.
function monkey(x, y, s = 1, o = {}) {
  const { alpha = 1, t = 0, rot = 0, sq = 0, wave = false } = o;
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s * (1 + sq * .6), s * (1 - sq));
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // tail
  ctx.strokeStyle = C.dbrown; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(26, 190); ctx.bezierCurveTo(95, 215, 115, 150, 82, 135); ctx.bezierCurveTo(62, 127, 58, 150, 72, 155); ctx.stroke();
  // arms
  ctx.strokeStyle = C.brown; ctx.lineWidth = 20;
  ctx.beginPath(); ctx.moveTo(-12, 4); ctx.quadraticCurveTo(-46, 50, -34, 128); ctx.stroke();
  if (wave) {
    const a = Math.sin(t * 9) * .5;
    ctx.save(); ctx.translate(34, 128); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(40, -40, 56, -120); ctx.stroke();
    ctx.fillStyle = C.beige; ctx.beginPath(); ctx.arc(56, -124, 13, 0, 7); ctx.fill();
    ctx.restore();
  } else { ctx.beginPath(); ctx.moveTo(12, 4); ctx.quadraticCurveTo(46, 50, 34, 128); ctx.stroke(); }
  // legs
  ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(-20, 200); ctx.quadraticCurveTo(-40, 230, -30, 250); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, 200); ctx.quadraticCurveTo(40, 230, 30, 250); ctx.stroke();
  ctx.fillStyle = C.beige;
  ctx.beginPath(); ctx.ellipse(-34, 254, 15, 9, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(34, 254, 15, 9, 0, 0, 7); ctx.fill();
  // body
  ctx.fillStyle = C.brown; ctx.beginPath(); ctx.ellipse(0, 165, 44, 50, 0, 0, 7); ctx.fill();
  ctx.fillStyle = C.beige; ctx.beginPath(); ctx.ellipse(0, 172, 28, 34, 0, 0, 7); ctx.fill();
  // hands
  ctx.fillStyle = C.beige;
  ctx.beginPath(); ctx.arc(-11, 2, 12, 0, 7); ctx.fill();
  if (!wave) { ctx.beginPath(); ctx.arc(11, 2, 12, 0, 7); ctx.fill(); }
  // head
  ctx.fillStyle = C.brown;
  ctx.beginPath(); ctx.arc(-52, 82, 20, 0, 7); ctx.arc(52, 82, 20, 0, 7); ctx.fill();
  ctx.fillStyle = C.beige;
  ctx.beginPath(); ctx.arc(-52, 82, 11, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(52, 82, 11, 0, 7); ctx.fill();
  ctx.fillStyle = C.brown; ctx.beginPath(); ctx.arc(0, 82, 52, 0, 7); ctx.fill();
  ctx.fillStyle = C.beige;
  ctx.beginPath(); ctx.ellipse(0, 100, 36, 27, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(-17, 74, 19, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(17, 74, 19, 0, 7); ctx.fill();
  // eyes (blink every ~3 s)
  const blink = ((t + .7) % 3.1) < .12 ? .12 : 1;
  ctx.fillStyle = '#1a1020';
  ctx.beginPath(); ctx.ellipse(-16, 74, 7, 8 * blink, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, 74, 7, 8 * blink, 0, 0, 7); ctx.fill();
  if (blink === 1) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-13, 71, 2.6, 0, 7); ctx.arc(19, 71, 2.6, 0, 7); ctx.fill(); }
  // nose + smile + cheeks
  ctx.fillStyle = '#5a3418'; ctx.beginPath(); ctx.arc(-5, 94, 2.8, 0, 7); ctx.arc(5, 94, 2.8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#5a3418'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 100, 15, .25, Math.PI - .25); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,120,.35)'; ctx.beginPath(); ctx.arc(-28, 98, 7, 0, 7); ctx.arc(28, 98, 7, 0, 7); ctx.fill();
  ctx.restore();
}

// ---- background, grain, vignette
const rnd = mulberry(42);
const DOTS = [...Array(80)].map(() => ({ x: rnd() * W, y: rnd() * H, r: .8 + rnd() * 2.4, sp: 8 + rnd() * 28, ph: rnd() * 6.28 }));
const GRAIN = [0, 1, 2, 3].map(k => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const im = g.createImageData(256, 256), r = mulberry(100 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = r() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});
function background(t, hue = 0) {
  const g = ctx.createRadialGradient(W / 2, H * .42, 60, W / 2, H / 2, 1250);
  g.addColorStop(0, hue ? '#2a1846' : C.bg1); g.addColorStop(1, C.bg0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(120,150,255,.07)'; ctx.lineWidth = 1;
  const off = (t * 14) % 80;
  ctx.beginPath();
  for (let x = -80 + off; x < W + 80; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -80 + off; y < H + 80; y += 80) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  for (const d of DOTS) {
    const y = ((d.y - t * d.sp) % H + H) % H;
    ctx.fillStyle = `rgba(160,190,255,${.12 + .18 * (.5 + .5 * Math.sin(t * 2 + d.ph))})`;
    ctx.beginPath(); ctx.arc(d.x + Math.sin(t * .5 + d.ph) * 12, y, d.r, 0, 7); ctx.fill();
  }
}
function postFX(f) {
  const v = ctx.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1200);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(GRAIN[f % 4], 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ---- impacts drive camera shake + flash
const IMPACTS = [];
const impact = (t, amp = 14, sfx = 'impact') => { IMPACTS.push({ t, amp }); cue(t, sfx, { amp }); };
function shake(t) {
  let dx = 0, dy = 0;
  for (const i of IMPACTS) {
    const u = t - i.t; if (u < 0 || u > .6) continue;
    const e = i.amp * Math.exp(-u * 9);
    dx += e * Math.sin(u * 83 + i.t); dy += e * Math.cos(u * 71 + i.t * 3);
  }
  return [dx, dy];
}
function flash(t) {
  let a = 0;
  for (const i of IMPACTS) { const u = t - i.t; if (u >= 0 && u < .3 && i.amp >= 18) a = Math.max(a, .35 * (1 - u / .3)); }
  return a;
}

// ---- scene transitions: three skewed panels sweep across each boundary
for (const b of BOUNDS) cue(b - .42, 'whoosh', { dur: .7 });
function transition(t) {
  for (const b of BOUNDS) {
    const u = (t - (b - .42)) / .84; if (u <= 0 || u >= 1) continue;
    [[C.yel, .1], [C.cyan, .05], ['#0b1130', 0]].forEach(([col, lead]) => {
      const p = clamp(u + lead);
      const x = p < .5 ? lerp(-2700, -300, eIO(p * 2)) : lerp(-300, 2400, eIO(p * 2 - 1));
      ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(x, 0); ctx.lineTo(x + 2500, 0); ctx.lineTo(x + 2200, H); ctx.lineTo(x - 300, H); ctx.closePath(); ctx.fill();
    });
  }
}

// =====================================================================
// SCENE 1 — hook (0–6)
// =====================================================================
cue(0, 'swell', { dur: .3 }); impact(.3, 26, 'boom');
cue(1.0, 'pop', { n: 0 }); cue(1.35, 'pop', { n: 2 });
cue(2.3, 'glitch'); cue(3.6, 'slideup'); cue(4.4, 'pop', { n: 4 }); cue(3.8, 'riser', { dur: 2.2 });
function sHook(t) {
  // speed rays
  const ra = (1 - P(t, .3, 1.6)) * (t > .3 ? 1 : 0);
  if (ra > 0) {
    ctx.save(); ctx.translate(W / 2, 380); ctx.globalAlpha = ra * .5;
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * Math.PI * 2 + t * .2, r0 = 200 + 900 * eOut(P(t, .3, 1.2));
      ctx.strokeStyle = i % 2 ? C.yel : C.cyan; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0 * .55, Math.sin(a) * r0 * .55); ctx.lineTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.stroke();
    }
    ctx.restore();
  }
  const ti = P(t, .25, .45);
  txt('應用題 · 力的平衡', W / 2, 225, { size: 40, color: C.dim, weight: 700, alpha: P(t, .7, 1.1) });
  txt('第 25 題', W / 2, 380, { size: 210, color: C.yel, scale: lerp(3.2, 1, eOut(ti)), alpha: ti, glow: 40 + 30 * Math.sin(t * 4) });
  const p1 = pop(t, 1.0), p2 = pop(t, 1.35);
  txt('一隻猴子', 720, 570, { size: 92, alpha: p1.a, scale: p1.s });
  txt('×', 960, 570, { size: 70, color: C.dim, alpha: p2.a });
  txt('一條繩子', 1200, 570, { size: 92, alpha: p2.a, scale: p2.s });
  // glitchy question
  if (t > 2.3) {
    const g = t < 2.75, r = mulberry(Math.floor(t * 60));
    const jx = g ? (r() - .5) * 40 : 0, jy = g ? (r() - .5) * 10 : 0;
    if (g) {
      txt('繩子到底要承受多大的力？', W / 2 + jx - 8, 715 + jy, { size: 78, color: '#ff2a6d', alpha: .8 });
      txt('繩子到底要承受多大的力？', W / 2 - jx + 8, 715 - jy, { size: 78, color: '#05d9e8', alpha: .8 });
    }
    txt('繩子到底要承受多大的力？', W / 2 + jx * .3, 715, { size: 78, color: C.yel, glow: 26 });
  }
  const p3 = pop(t, 4.4);
  txt('答案會讓你嚇一跳！', W / 2, 850, { size: 54, weight: 700, alpha: p3.a, scale: p3.s });
  // monkey peeks in from the bottom right
  const mk = eBack(P(t, 3.6, 4.2));
  monkey(1640, lerp(1250, 790, mk), .95, { t, rot: -.15 + Math.sin(t * 3) * .05, wave: true });
  const q = pop(t, 4.0);
  txt('?', 1780, 700 + Math.sin(t * 5) * 8, { size: 110, color: C.yel, alpha: q.a, scale: q.s, glow: 30, rot: .2 });
}

// =====================================================================
// SCENE 2 — problem (6–16)
// =====================================================================
const LINES = [
  [['一隻 '], ['14.6 kg', 'm'], [' 的猴子懸吊在一條'], ['輕質繩子', 'l'], ['的中間，']],
  [['兩邊的繩子與水平線的夾角皆為 '], ['11.0°', 'a'], ['，']],
  [['求繩子的'], ['張力', 't'], ['並與猴子的'], ['重量', 'w'], ['相比較。']],
];
const HL = { m: [12.0, C.yel], a: [12.6, C.yel], l: [13.2, C.cyan], t: [13.8, C.cyan], w: [13.8, C.red] };
const NCH = LINES.flat().reduce((a, s) => a + [...s[0]].length, 0);
const TYPE0 = S.prob + .7, TYPE1 = S.prob + 5.4;

function sCmp(t) {

  });
  const fp = pop(lt, 4.6);
  rich([['T / W = 1 / (2 sin 11.0°) ≈ ', C.wht], ['2.62', C.yel]], W / 2, 195, { size: 46, alpha: fp.a, scale: fp.s, glow: 12 });
  // slam banner

    ctx.fillStyle = C.yel; ctx.fillRect(-1100, -105, 2200, 8); ctx.fillRect(-1100, 97, 2200, 8);
    ctx.restore();
    rich([['張力 ≈ ', C.wht], ['2.6 倍', C.yel], [' 猴子的重量！', C.wht]], W / 2, 518, { size: 110, scale: lerp(2.5, 1, eOut(sb)), alpha: sb, glow: 30, rot: -.05 });
  }

}

// =====================================================================
// SCENE 8 — why so big? θ sweep (66–76)
// =====================================================================
const T8 = S.why, GX = 1060, GY = 820, GW = 720, GH = 520;
const thAt = lt => (lt < 1.2 ? 45 : lt > 6.0 ? 5 : lerp(45, 5, eIO(P(lt, 1.2, 6.0))));
const ratio = d => 1 / (2 * Math.sin(d * Math.PI / 180));
cue(T8 + .2, 'pop', { n: 0 }); cue(T8 + .6, 'swish', { dur: 1 }); cue(T8 + 1.8, 'pop', { n: 4 });
// pitch-follow sweep: sample T/W at 100 Hz so the tone tracks the picture exactly
cue(T8 + 1.2, 'sweep', { rate: 100, vals: [...Array(481)].map((_, i) => +ratio(thAt(1.2 + i / 100)).toFixed(4)) });
impact(T8 + 6.4, 18); cue(T8 + 8.0, 'pop', { n: 5 });
const gx = d => GX + d / 60 * GW, gy = r => GY - r / 6 * GH;
function sWhy(t) {
  const lt = t - T8;

  const L = Math.min(40 * r, 330), over = 40 * r > 330;
  arrow(mx, my, mx - L * Math.cos(thr), my - L * Math.sin(thr), over ? C.red : C.cyan, { w: 9, head: 28, glow: over ? 40 : 20 });
  arrow(mx, my, mx + L * Math.cos(thr), my - L * Math.sin(thr), over ? C.red : C.cyan, { w: 9, head: 28, glow: over ? 40 : 20 });
  ctx.restore();
  rich([['θ = ', C.wht], [th.toFixed(0) + '°', C.yel]], 520, 230, { size: 52, alpha: a0 });
  // graph (right)
  const ga = P(lt, .5, .9);
  ctx.save(); ctx.globalAlpha = ga; ctx.strokeStyle = 'rgba(220,228,255,.7)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(GX, GY - GH - 20); ctx.lineTo(GX, GY); ctx.lineTo(GX + GW + 20, GY); ctx.stroke();
  ctx.strokeStyle = 'rgba(220,228,255,.12)'; ctx.lineWidth = 1;
  for (let k = 1; k <= 6; k++) { ctx.beginPath(); ctx.moveTo(GX, gy(k)); ctx.lineTo(GX + GW, gy(k)); ctx.stroke(); }
  ctx.restore();
  for (let k = 0; k <= 60; k += 15) txt(k + '°', gx(k), GY + 34, { size: 28, color: C.dim, weight: 700, alpha: ga });
  for (let k = 1; k <= 6; k++) txt(String(k), GX - 26, gy(k), { size: 28, color: C.dim, weight: 700, alpha: ga });
  txt('T / W', GX, GY - GH - 50, { size: 34, color: C.cyan, alpha: ga });
  txt('θ', GX + GW + 50, GY, { size: 38, color: C.yel, alpha: ga });
  const cp = eOut(P(lt, .6, 1.6));
  if (cp > 0) {
    const d0 = 60 - (60 - 4.8) * cp;
    ctx.save(); ctx.strokeStyle = C.cyan; ctx.lineWidth = 6; ctx.shadowColor = C.cyan; ctx.shadowBlur = 18; ctx.beginPath();
    for (let d = 60; d >= d0; d -= .2) { const x = gx(d), y = gy(ratio(d)); d === 60 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke(); ctx.restore();
  }
  // this problem's point
  const mp = pop(lt, 1.8);
  if (mp.a > 0) {
    ctx.save(); ctx.globalAlpha = mp.a; ctx.fillStyle = C.yel; ctx.shadowColor = C.yel; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(gx(11), gy(ratio(11)), 12 * mp.s, 0, 7); ctx.fill(); ctx.restore();
    dashLine(gx(11), gy(ratio(11)), gx(11), GY, C.yel, { alpha: mp.a * .6, w: 2 });
    txt('本題：11.0° → 2.62 W', gx(11) + 30, gy(ratio(11)) - 10, { size: 34, color: C.yel, align: 'left', alpha: mp.a, scale: mp.s });
  }

    ctx.save(); ctx.fillStyle = C.wht; ctx.shadowColor = C.cyan; ctx.shadowBlur = 30; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fill(); ctx.restore();

  const inf = pop(lt, 8.0);
  rich([['θ → 0°   ⇒   ', C.wht], ['T → ∞', C.red]], 1420, 210, { size: 50, alpha: inf.a, scale: inf.s, glow: 18 });
}

// =====================================================================
// SCENE 9 — answer card (76–82)
// =====================================================================
const T9 = S.end;
cue(T9 + .3, 'pop', { n: 0 }); cue(T9 + .6, 'ding', { n: 2 }); cue(T9 + 1.0, 'pop', { n: 2 }); cue(T9 + 1.8, 'pop', { n: 4 });

const SCENES = [[0, sHook], [6, sProb], [16, sSetup], [26, sFbd], [36, sDec], [46, sCalc], [58, sCmp], [66, sWhy], [76, sEnd]];

}
CUES.sort((a, b) => a.t - b.t);
