<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Water Reel</title>
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/Anton.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; src: url('fonts/Inter-var.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JBM'; src: url('fonts/JetBrainsMono.woff2') format('woff2'); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   WATER REEL — 15s motion design showreel, 1920x1080 @ 60fps.
   Every frame is rendered deterministically by renderFrame(f).
   ===================================================================== */
const W = 1920, H = 1080, FPS = 60, DUR = 15, NF = DUR * FPS;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');

/* ---------------------------------------------------------------- math */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const Ez = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outQuint: t => 1 - Math.pow(1 - t, 5),
};
const spring = (t, w = 18, z = 6) => t <= 0 ? 0 : 1 - Math.exp(-z * t) * Math.cos(w * t);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ------------------------------------------------------------ GL utils */
const VS = `#version 300 es
in vec2 aP; void main(){ gl_Position = vec4(aP,0.,1.); }`;
const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    const lines = src.split('\n').map((l, i) => (i + 1) + ': ' + l).join('\n');
    throw new Error(log + '\n' + lines.slice(0, 200000));
  }
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'aP'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  p.loc = {}; return p;
}
function U(p, name) { if (!(name in p.loc)) p.loc[name] = gl.getUniformLocation(p, name); return p.loc[name]; }
function fbo(w, h, fmt = gl.RGBA16F, type = gl.HALF_FLOAT) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, fmt, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}
function draw(p, target, uniforms, textures) {
  gl.useProgram(p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.f : null);
  gl.viewport(0, 0, target ? target.w : W, target ? target.h : H);
  let unit = 0;
  for (const k in (textures || {})) {
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, textures[k]);
    gl.uniform1i(U(p, k), unit); unit++;
  }
  for (const k in uniforms) {
    const v = uniforms[k], l = U(p, k); if (l === null) continue;
    if (typeof v === 'number') gl.uniform1f(l, v);
    else if (v.kind === 'v4a') gl.uniform4fv(l, v.data);
    else if (v.kind === 'fa') gl.uniform1fv(l, v.data);
    else if (v.length === 2) gl.uniform2fv(l, v);
    else if (v.length === 3) gl.uniform3fv(l, v);
    else if (v.length === 4) gl.uniform4fv(l, v);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
const V4A = (arr, n) => { const d = new Float32Array(n * 4); arr.forEach((v, i) => { if (i < n) d.set(v, i * 4); }); return { kind: 'v4a', data: d }; };
const FA = (arr, n = 16) => { const d = new Float32Array(n); arr.forEach((v, i) => d[i] = v); return { kind: 'fa', data: d }; };

/* ============================================================ GLSL ==== */
const HEAD = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uT;
uniform sampler2D uSim, uTx0;
uniform vec4 uWord;              // cx, cy, width, aspect
uniform vec4 uP[48]; uniform vec4 uQ[48];
uniform float uF[16];
out vec4 outC;
#define PI 3.14159265359
vec3 srgb(vec3 c){ return pow(c, vec3(2.2)); }
float h21(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+1.),u.x), u.y); }
float fbm(vec2 p){ float a=.5, s=0.; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){ s+=a*vnoise(p); p=m*p; a*=.5; } return s; }
vec2 P(){ return (gl_FragCoord.xy - .5*uRes)/uRes.y; }
float sbox(vec2 p, vec2 b, float s){ vec2 d=abs(p)-b; float e=length(max(d,0.))+min(max(d.x,d.y),0.); return smoothstep(s,-s,e); }
float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
vec4 word(vec2 p){
  vec2 t = vec2((p.x-uWord.x)/uWord.z + .5, (p.y-uWord.y)/(uWord.z/uWord.w) + .5);
  if (t.x<0.||t.y<0.||t.x>1.||t.y>1.) return vec4(0);
  return texture(uTx0, t);
}
// studio environment (reflection direction -> radiance)
vec3 env(vec3 r){
  vec2 q = r.xy/(1.+abs(r.z));
  vec3 c = vec3(.002,.004,.009) + vec3(.01,.03,.055)*smoothstep(-.5,.5,q.y);
  c += vec3(30.,33.,36.)*sbox(q-vec2(-.25,.23), vec2(.12,.035), .012);
  c += vec3(10.,20.,28.)*sbox(q-vec2(.31,-.04), vec2(.012,.17), .008);
  c += vec3(2.,5.,8.)*smoothstep(.02,0.,abs(length(q)-.36));
  return c;
}
float caustic(vec2 uv, float time){
  vec2 p = mod(uv*6.28318, 6.28318) - 250.;
  vec2 i = p; float c = 1.; float inten = .005;
  for (int n=0;n<5;n++){ float t = time*(1.-(3.5/float(n+1)));
    i = p + vec2(cos(t-i.x)+sin(t+i.y), sin(t-i.y)+cos(t+i.x));
    c += 1./length(vec2(p.x/(sin(i.x+t)/inten), p.y/(cos(i.y+t)/inten))); }
  c /= 5.; c = 1.17 - pow(c, 1.4); return pow(abs(c), 8.);
}
`;

/* ---- ripple simulation (2D wave equation on a float grid) ---- */
const FS_SIM = HEAD + `
uniform vec2 uPx; uniform float uAsp; uniform float uDamp; uniform float uInj; uniform float uND;
void main(){
  vec2 uv = gl_FragCoord.xy*uPx;
  vec4 c = texture(uSim, uv);
  float s = texture(uSim, uv+vec2(uPx.x,0)).r + texture(uSim, uv-vec2(uPx.x,0)).r
          + texture(uSim, uv+vec2(0,uPx.y)).r + texture(uSim, uv-vec2(0,uPx.y)).r;
  float nh = (s*.5 - c.g)*uDamp;
  vec2 p = (uv-.5)*vec2(uAsp,1.);
  for (int i=0;i<8;i++){ if(float(i)>=uND) break; vec4 d=uP[i]; vec2 q=p-d.xy; nh -= d.w*exp(-dot(q,q)/(d.z*d.z)); }
  if (uInj != 0.) { vec4 w = word(p); nh += uInj*(w.g*.5+w.b*.5); }
  outC = vec4(nh, c.r, 0., 1.);
}`;

/* ---- 01 / 08 : mirror water (ripple sim + liquid type rising) ---- */
const FS_MIRROR = HEAD + `
// uF: 0 textAmp, 1 dropR, 2 dropX, 3 dropY, 4 glow, 5 flash, 6 flashX, 7 flashY, 8 K, 9 warm
float textH(vec2 p){ vec4 w=word(p); return w.b*.7 + w.a*.3; }
vec3 floorCol(vec2 p, float lap){
  vec3 c = vec3(.0025,.005,.011);
  vec2 g = abs(fract(p*8.+.5)-.5)/8.; c += vec3(.004,.012,.02)*smoothstep(.0016,0.,min(g.x,g.y));
  vec3 glowC = mix(srgb(vec3(.25,.85,1.)), srgb(vec3(1.,.55,.35)), uF[9]);
  c += clamp(-lap*14., 0., 3.)*glowC*.55;
  vec4 w = word(p);
  c += glowC*(w.r*2.2 + w.b*.5 + w.a*.25)*uF[4];
  return c;
}
void main(){
  vec2 p = P(); vec2 uv = gl_FragCoord.xy/uRes;
  vec2 px = 1./vec2(textureSize(uSim,0));
  float hc=texture(uSim,uv).r, hl=texture(uSim,uv-vec2(px.x,0)).r, hr=texture(uSim,uv+vec2(px.x,0)).r,
        hd=texture(uSim,uv-vec2(0,px.y)).r, hu=texture(uSim,uv+vec2(0,px.y)).r;
  vec2 g = vec2(hr-hl, hu-hd)*uF[8];
  float lap = hl+hr+hu+hd-4.*hc;
  float e = 1.5/uRes.y;
  vec2 tg = vec2(textH(p+vec2(e,0))-textH(p-vec2(e,0)), textH(p+vec2(0,e))-textH(p-vec2(0,e)))/(2.*e);
  tg *= uF[0]*.012;
  vec3 n = normalize(vec3(-(g+tg), 1.));
  vec3 V = normalize(vec3(-p*.55, 1.));
  float ndv = clamp(dot(n,V),0.,1.);
  float F = .02 + .98*pow(1.-ndv, 5.);
  vec3 R = reflect(-V, n);
  vec2 off = -n.xy*.035;
  vec3 fl = vec3(floorCol(p+off*1.0, lap).r, floorCol(p+off*1.04, lap).g, floorCol(p+off*1.08, lap).b);
  vec3 col = fl*(1.-F) + env(R)*F;
  // falling drop (top-down: shrinking glossy sphere)
  if (uF[1] > 0.) {
    vec2 q = (p-vec2(uF[2],uF[3]))/uF[1]; float r2 = dot(q,q);
    // soft contact shadow / reflection on water
    col += vec3(.2,.5,.7)*.04*exp(-r2*.25)/max(uF[1]*20.,.3);
    if (r2 < 1.2) {
      vec3 ns = normalize(vec3(q, sqrt(max(1.-r2,0.))));
      float Fs = .04 + .96*pow(1.-clamp(dot(ns,V),0.,1.),5.);
      vec3 inner = floorCol(vec2(uF[2],uF[3]) - q*uF[1]*1.8, 0.)*2. + vec3(.02,.08,.12)*(1.-r2);
      vec3 dc = mix(inner, env(reflect(-V,ns))*1.2, Fs);
      float a = smoothstep(1., .9, sqrt(r2));
      col = mix(col, dc, a);
    }
  }
  col += uF[5]*srgb(vec3(.6,.9,1.))*exp(-length(p-vec2(uF[6],uF[7]))*14.)*1.5;
  outC = vec4(col, 1.);
}`;

/* ---- 02 : metaball typography ---- */
const FS_META = HEAD + `
// uF: 0 nballs, 1 textW, 2 wobble, 3 wobT
float field(vec2 p){
  float f = 0.; int n = int(uF[0]);
  for (int i=0;i<48;i++){ if(i>=n) break; vec4 b=uP[i]; vec2 d=p-b.xy; float R=b.z*2.2;
    float x = 1.-dot(d,d)/(R*R+1e-6); if (x>0.) f += x*x*x; }
  if (uF[1] > 0.) { vec2 q = p + uF[2]*vec2(sin(p.y*19.+uF[3]*17.), sin(p.x*14.-uF[3]*13.))*.011;
    f += uF[1]*word(q).g; }
  return f;
}
float hgt(float f){ return sqrt(clamp((f-.5)/.55, 0., 1.)); }
vec3 bg(vec2 p){
  vec3 c = mix(srgb(vec3(.02,.03,.07)), srgb(vec3(.09,.035,.14)), smoothstep(-.7,.9,p.x+p.y*.5));
  vec2 g = abs(fract(p*12.5+.5)-.5)/12.5; c += vec3(.04,.07,.11)*smoothstep(.0013,0.,min(g.x,g.y));
  vec2 g2 = abs(fract(p*2.5+.5)-.5)/2.5; c += vec3(.05,.1,.14)*smoothstep(.0016,0.,min(g2.x,g2.y));
  c += srgb(vec3(1.,.36,.24))*.3*exp(-length(p-vec2(.75,.42))*2.3);
  c += srgb(vec3(.15,.6,1.))*.22*exp(-length(p-vec2(-.85,-.5))*2.);
  return c;
}
void main(){
  vec2 p = P(); float e = 1.5/uRes.y;
  float f = field(p), fx = field(p+vec2(e,0)), fy = field(p+vec2(0,e));
  float h = hgt(f);
  vec2 gr = vec2(hgt(fx)-h, hgt(fy)-h)/e;
  vec3 n = normalize(vec3(-gr*.035, 1.));
  float aa = max(fwidth(f), 1e-4);
  float cov = smoothstep(.5-aa, .5+aa, f);
  // shadow + focused caustic on the backdrop
  float fs = field(p - vec2(.03,-.04));
  vec3 b = bg(p);
  b *= 1. - .6*smoothstep(.25,.6,fs);
  b += srgb(vec3(.4,.85,1.))*smoothstep(.8,1.6,fs)*.5;
  // water
  vec3 V = normalize(vec3(-p*.4, 1.));
  float F = .02 + .98*pow(1.-clamp(dot(n,V),0.,1.), 5.);
  vec2 off = -n.xy*.11;
  vec3 refr = vec3(bg(p+off).r, bg(p+off*1.07).g, bg(p+off*1.14).b);
  refr *= srgb(vec3(.78,.95,1.))*1.15;
  vec3 R = reflect(-V, n);
  vec3 w = mix(refr, env(R), F);
  float nl = length(n.xy);
  w += srgb(vec3(.5,.9,1.))*smoothstep(.2,.9, dot(n.xy/(nl+1e-5), vec2(.6,-.8)))*nl*smoothstep(1.,.3,h)*.9;
  w *= mix(.25, 1., smoothstep(0.,.4,h));
  vec3 col = mix(b, w, cov);
  outC = vec4(col, cov);
}`;

/* ---- 03 : elastic shape morph ---- */
const FS_MORPH = HEAD + `
// uF: 0 shapeA,1 shapeB,2 mix,3 rot,4 scale,5 sx,6 sy,7 wobA,8 wobPh,9 wobK,10 nsat
float shapeR(float s, float a){
  if (s < .5) return 1.;
  if (s < 1.5) { float c=abs(cos(a)), si=abs(sin(a)); return pow(pow(c,5.)+pow(si,5.),-.2)*.86; }
  if (s < 2.5) { float k=PI/3.; float m = mod(a+PI/2.+k, 2.*k)-k; float r = .56/cos(m); return mix(r, .8, .18); }
  if (s < 3.5) { float c = .5+.5*cos(5.*(a-PI/2.)); return .66 + .42*pow(c, 1.6); }
  return .95 + .07*cos(8.*a);
}
float blob(vec2 p0){
  vec2 p = vec2(p0.x/uF[5], p0.y/uF[6]);
  float r = length(p); float a = atan(p.y,p.x) - uF[3];
  float R = mix(shapeR(uF[0],a), shapeR(uF[1],a), uF[2]);
  R += uF[7]*sin(uF[9]*a + uF[8]);
  R *= uF[4];
  float d = (r-R)*.85;
  int n = int(uF[10]);
  for (int i=0;i<8;i++){ if(i>=n) break; d = smin(d, length(p0-uP[i].xy)-uP[i].z, .06); }
  return d;
}
float hgt(float d){ float x = clamp(-d/.13, 0., 1.); return sqrt(x*(2.-x)); }
vec3 paper(vec2 p){
  vec3 c = srgb(vec3(.925,.91,.885));
  c *= 1. - .07*length(p*vec2(.7,1.));
  vec2 g = abs(fract(p*10.+.5)-.5)/10.; c = mix(c, srgb(vec3(.55,.53,.5)), .45*smoothstep(.0014,0.,min(g.x,g.y)));
  float t = word(p).r; c = mix(c, srgb(vec3(.06,.06,.07)), t);
  // halftone dots, bottom-right
  vec2 hp = p*42.; vec2 hc = fract(hp)-.5; float rr = .38*smoothstep(.2,1.1, p.x-p.y);
  c = mix(c, srgb(vec3(1.,.32,.18)), smoothstep(rr, rr-.08, length(hc))*.85);
  return c;
}
void main(){
  vec2 p = P(); float e = 1.5/uRes.y;
  float d = blob(p), dx = blob(p+vec2(e,0)), dy = blob(p+vec2(0,e));
  float h = hgt(d);
  vec2 gr = vec2(hgt(dx)-h, hgt(dy)-h)/e;
  vec3 n = normalize(vec3(-gr*.06, 1.));
  float cov = smoothstep(e, -e, d);
  float ds = blob(p - vec2(.035,-.05));
  vec3 b = paper(p);
  b *= 1. - .32*smoothstep(.05,-.07,ds);
  b += srgb(vec3(.45,.85,.95))*pow(clamp(-ds/.22,0.,1.),2.5)*1.3;
  vec3 V = normalize(vec3(-p*.4, 1.));
  float F = .02 + .98*pow(1.-clamp(dot(n,V),0.,1.), 5.);
  vec2 off = -n.xy*.09;
  vec3 refr = vec3(paper(p+off).r, paper(p+off*1.06).g, paper(p+off*1.12).b);
  refr *= srgb(vec3(.8,.94,1.));
  vec3 R = reflect(-V, n);
  vec3 envL = mix(srgb(vec3(.8,.82,.85)), vec3(1.4), smoothstep(-.3,.6,R.y)) + env(R)*.8;
  vec3 w = mix(refr, envL, F);
  w *= mix(.3, 1., smoothstep(0.,.22,h));
  w += vec3(1.6)*pow(max(dot(R, normalize(vec3(-.45,.55,.7))),0.),90.);
  float nl = length(n.xy);
  w += vec3(.9,1.,1.)*smoothstep(.3,.95,dot(n.xy/(nl+1e-5), vec2(.6,-.8)))*nl*smoothstep(1.,.4,h)*.5;
  outC = vec4(mix(b, w, cov), cov);
}`;

/* ---- 04 : caustics pool ---- */
const FS_POOL = HEAD + `
// uF: 0 camZ, 1 roll, 2 pitch, 3 textZ, 4 textW, 5 camY
void main(){
  vec2 p = P(); float t = uT;
  float cr = cos(uF[1]), sr = sin(uF[1]); p = mat2(cr,-sr,sr,cr)*p;
  vec3 ro = vec3(0., uF[5], uF[0]);
  vec3 rd = normalize(vec3(p.x, p.y, 1.15));
  float cp = cos(uF[2]), sp = sin(uF[2]);
  rd = vec3(rd.x, rd.y*cp - rd.z*sp, rd.y*sp + rd.z*cp);
  vec3 fogC = srgb(vec3(.0,.3,.42));
  vec3 col = fogC;
  if (rd.y < -.001) {
    float th = (-1.-ro.y)/rd.y; vec3 hp = ro + rd*th; vec2 fp = hp.xz;
    fp += .022*vec2(sin(fp.y*3.+t*2.)+sin(fp.x*2.3-t*1.7), cos(fp.x*2.7+t*1.6)+sin(fp.y*1.9+t*2.2));
    vec2 tq = fp*2.; vec2 tw = fwidth(tq);
    vec2 tg = abs(fract(tq)-.5);
    float grout = smoothstep(.5-tw.x*1.5-.02, .5-.02+tw.x*.5, tg.x) + smoothstep(.5-tw.y*1.5-.02, .5-.02+tw.y*.5, tg.y);
    vec3 tile = srgb(vec3(.6,.86,.9)) * (.92+.08*h21(floor(tq)));
    tile = mix(tile, srgb(vec3(.28,.52,.6)), clamp(grout,0.,1.)*.75);
    float lane = smoothstep(.2,.18,abs(fp.x-1.9)) + smoothstep(.2,.18,abs(fp.x+1.9));
    tile = mix(tile, srgb(vec3(.02,.12,.32)), lane);
    vec2 tuv = vec2(fp.x/uF[4]+.5, (fp.y-uF[3])/(uF[4]/uWord.w)+.5);
    float tm = (tuv.x>0.&&tuv.x<1.&&tuv.y>0.&&tuv.y<1.) ? texture(uTx0, tuv).r : 0.;
    tile = mix(tile, srgb(vec3(.01,.06,.2)), tm);
    float ct = t*.9 + 23.;
    vec2 cu = fp*.42;
    vec3 cc = vec3(caustic(cu,ct), caustic(cu+vec2(.006,.003),ct), caustic(cu+vec2(.012,.006),ct));
    vec3 light = vec3(.32,.38,.42) + cc*2.6;
    col = tile*light;
    col = mix(col, fogC, 1.-exp(-th*.17));
  }
  // god rays from the surface
  vec2 lp = vec2(.25, 1.4);
  float ang = atan(p.x-lp.x, lp.y-p.y);

  if (key === 'A' || key === 'H') {
    const def = key === 'A' ? SIM_A : SIM_H;
    const f = Math.round(t * FPS);
    simTo(def, Math.max(f, Math.round(def.start * FPS)));
    draw(PR.mirror, target, { ...base, ...mirrorU(def, t) }, { uSim: simA.t, uTx0: WORDS[def.word].tex });
  } else if (key === 'B') draw(PR.meta, target, { ...base, ...metaU(lt) }, { uTx0: WORDS.FLUID.tex });
  else if (key === 'C') draw(PR.morph, target, { ...base, ...morphU(lt) }, { uTx0: WORDS.ELASTIC.tex });
  else if (key === 'D') draw(PR.pool, target, { ...base, ...poolU(lt) }, { uTx0: WORDS.REFRACTION.tex });
  else if (key === 'E') draw(PR.splash, target, { ...base, ...splashU(lt) }, { uTx0: WORDS.TIME.tex });
  else if (key === 'F') draw(PR.tanks, target, { ...base, ...tanksU(lt) }, { uTx0: WORDS.TIMING.tex });

    c.font = '800 30px Inter'; c.letterSpacing = '16px'; c.textAlign = 'left';
    const tw = c.measureText(word).width;
    let x = W / 2 - tw / 2 + 8;
    for (let i = 0; i < word.length; i++) {
      const ch = word[i], cw = c.measureText(ch).width;
      const p = Ez.outExpo(clamp(k1 * 1.8 - i * .05));
      c.fillStyle = A(p);
      c.fillText(ch, x, 742 + (1 - p) * 26);
      x += cw;
    }
    c.textAlign = 'center';
    c.font = '500 15px JBM'; c.letterSpacing = '3px'; c.fillStyle = A(.65);
    c.fillText(scramble('SHOWREEL 2026  ·  15 SECONDS  ·  ONE MATERIAL: WATER', k2, f, 6), W / 2, 792);
    c.fillStyle = cyan(.9); const lw = 120 * Ez.outExpo(k1);
    c.fillRect(W / 2 - lw / 2, 768, lw, 2);
    c.textAlign = 'left';
  }
}
function graphBox(x, y, w, h, a, label) {
  const c = ui;
  c.strokeStyle = `rgba(236,248,255,${.25 * a})`; c.lineWidth = 1;
  c.strokeRect(x, y, w, h);
  c.font = '500 11px JBM'; c.letterSpacing = '2px'; c.fillStyle = `rgba(236,248,255,${.6 * a})`;
  c.fillText(label, x, y - 10);
}
function drawSpringGraph(lt, a) {
  if (a <= 0) return;
  const c = ui, w = 250, h = 130, x = W - 64 - w, y = H - 64 - 92 - h;
  graphBox(x, y, w, h, a, 'SPRING  x(t) = 1 − e^(−ζt)·cos(ωt)');
  const s = morphState(lt);
  const map = (u, v) => [x + 10 + u * (w - 20), y + h - 18 - v * (h - 46)];
  c.strokeStyle = `rgba(236,248,255,${.25 * a})`; c.setLineDash([3, 4]);
  c.beginPath(); let q = map(0, 1); c.moveTo(q[0], q[1]); q = map(1, 1); c.lineTo(q[0], q[1]); c.stroke(); c.setLineDash([]);
  c.strokeStyle = `rgba(90,220,255,${a})`; c.lineWidth = 2; c.beginPath();
  for (let i = 0; i <= 80; i++) { const u = i / 80, v = spring(u * .5, C_SPR.w, C_SPR.z); const p = map(u, v); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
  c.stroke();
  const u = clamp(s.tau / .5), p = map(u, spring(u * .5, C_SPR.w, C_SPR.z));
  c.fillStyle = `rgba(255,90,60,${a})`; c.beginPath(); c.arc(p[0], p[1], 5, 0, 7); c.fill();
  c.font = '500 11px JBM'; c.fillStyle = `rgba(236,248,255,${.7 * a})`;
  c.fillText(`x = ${s.m.toFixed(3)}`, x + 10, y + 18);
}
function drawSpeedGraph(lt, a) {
  if (a <= 0) return;
  const c = ui, w = 250, h = 130, x = W - 64 - w, y = H - 64 - 92 - h;
  graphBox(x, y, w, h, a, 'SPEED RAMP');
  const map = (u, v) => [x + 10 + u * (w - 20), y + h - 14 - v * (h - 40)];
  c.strokeStyle = `rgba(90,220,255,${a})`; c.lineWidth = 2; c.beginPath();
  for (let i = 0; i <= 100; i++) { const u = i / 100, p = map(u, E_SPEED(u * 2)); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); }
  c.stroke();
  const ph = map(clamp(lt / 2), E_SPEED(lt));
  c.strokeStyle = `rgba(255,90,60,${a})`; c.beginPath(); c.moveTo(ph[0], y + 6); c.lineTo(ph[0], y + h - 6); c.stroke();
  c.fillStyle = `rgba(255,90,60,${a})`; c.beginPath(); c.arc(ph[0], ph[1], 5, 0, 7); c.fill();
  c.textAlign = 'right'; c.font = '800 30px Inter'; c.letterSpacing = '0px'; c.fillStyle = `rgba(236,248,255,${a})`;
  c.fillText(`${Math.round(E_SPEED(lt) * 100)}%`, x + w - 10, y + 36);
  c.textAlign = 'left';
}

/* ============================================================ FRAME === */
function post(t) {
  // shake & chromatic punches on hits
  const hits = [.5, 1.84, 4.0, 4.5, 5.0, 5.5, 8.16, 10.0, 10.5, 11.0, 13.64];
  let sh = 0, ca = .4;
  for (const h of hits) { const k = t - h; if (k >= 0 && k < .35) { sh += Math.exp(-k * 18); ca += 1.4 * Math.exp(-k * 16); } }
  const r = rng(Math.floor(t * FPS) + 5);
  const shake = [(r() - .5) * .006 * sh, (r() - .5) * .006 * sh];
  let fade = 1;
  fade *= Ez.outCubic(inv(0, .12, t));
  fade *= 1 - Ez.inCubic(inv(14.88, 15.0, t));
  const sc = sceneAt(t);
  const uiDiff = sc === 'C' && t < 5.92 ? 1 : 0;
  const expo = sc === 'C' ? .95 : 1.0;
  return { shake, ca, fade, uiDiff, expo };
}
function renderFrame(f) {
  const t = f / FPS;
  const tr = TR.find(x => t >= x.s && t < x.e);
  let mode = 0, prog = 0, center = [0, 0];
  if (tr) {
    renderScene(tr.a, t, fbS1);
    renderScene(tr.b, t, fbS2);
    mode = tr.mode; prog = inv(tr.s, tr.e, t); center = tr.c || [0, 0];
  } else {
    renderScene(sceneAt(t), t, fbS1);
  }
  draw(PR.comp, fbComp, { uRes: [W, H], uT: t, uMode: mode, uProg: prog, uC: center }, { uA: fbS1.t, uB: fbS2.t });
  draw(PR.bright, fbB1, { uRes: [BW, BH], uSrc: [W, H] }, { uA: fbComp.t });
  for (let i = 0; i < 2; i++) {
    draw(PR.blur, fbB2, { uRes: [BW, BH], uDir: [1 + i * 1.5, 0] }, { uA: fbB1.t });
    draw(PR.blur, fbB1, { uRes: [BW, BH], uDir: [0, 1 + i * 1.5] }, { uA: fbB2.t });
  }
  drawUI(t, f);
  gl.bindTexture(gl.TEXTURE_2D, uiTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, uiCanvas);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  const P = post(t);
  draw(PR.fin, null, {
    uRes: [W, H], uCA: P.ca, uGrain: .035, uFade: P.fade, uUIDiff: P.uiDiff, uExpo: P.expo, uSeed: f * 7.13 % 100,
    uVig: .9, uShake: P.shake,
  }, { uC: fbComp.t, uBl: fbB1.t, uUI: uiTex });
}

  makeWord('CLAUDE', 'CLAUDE', anton, 16);
  initB(); initE();
  return true;
})();
window.renderFrame = renderFrame;
