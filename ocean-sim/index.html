<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>海洋天空模擬</title>
<style>
  :root {
    --panel: rgba(10, 16, 28, 0.62);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #e8eef7;
    --muted: #9fb0c6;
    --accent: #ffcf6e;
    --accent2: #8fc8ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #02040a; color: var(--text); overflow: hidden;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas#c:active { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px 12px; }
  #info { top: 12px; left: 12px; min-width: 230px; }
  #info h1 { font-size: 14px; margin: 0 0 6px; font-weight: 600; letter-spacing: .02em; }
  #info .row { display: flex; justify-content: space-between; gap: 14px; color: var(--muted); }
  #info .row b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  #info .sep { height: 1px; background: var(--panel-border); margin: 6px 0; }
  #moonIcon { width: 34px; height: 34px; float: right; margin: -2px 0 0 8px; }
  #settings { top: 12px; right: 12px; width: 250px; max-height: calc(100% - 190px); overflow: auto; }
  #settings summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; }
  #settings summary::after { content: " ▾"; color: var(--muted); }
  #settings details:not([open]) summary::after { content: " ▸"; }
  .field { margin-top: 8px; }
  .field label { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 2px; }
  .field label span { color: var(--text); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent2); }
  select, input[type=number], input[type=date], button {
    background: rgba(255,255,255,0.08); color: var(--text); border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 5px 8px; font: inherit; }
  select option { background: #111a2a; }
  button { cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.16); }
  button.on { background: rgba(255, 207, 110, 0.25); border-color: rgba(255, 207, 110, 0.6); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid2 input { width: 100%; }
  #timebar { left: 50%; transform: translateX(-50%); bottom: 12px; width: min(920px, calc(100% - 24px)); }
  #timebar .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #clock { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .03em; min-width: 98px; }
  #tzlabel { color: var(--muted); }
  .spacer { flex: 1; }
  .slider-wrap { position: relative; margin-top: 8px; }
  .slider-wrap .cap { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .track { position: relative; height: 26px; }
  .track .grad { position: absolute; left: 0; right: 0; top: 9px; height: 8px; border-radius: 4px; }
  .track .marks { position: absolute; inset: 0; pointer-events: none; }
  .track .mk { position: absolute; top: 0; width: 1px; height: 26px; transform: translateX(-0.5px); }
  .track .mk i { position: absolute; top: -1px; left: 3px; font-style: normal; font-size: 10px; white-space: nowrap; color: var(--muted); }
  .track input[type=range] { position: absolute; left: 0; right: 0; top: 0; height: 26px; margin: 0; background: transparent;
    -webkit-appearance: none; appearance: none; }
  .track input[type=range]::-webkit-slider-runnable-track { height: 26px; background: transparent; }
  .track input[type=range]::-moz-range-track { height: 26px; background: transparent; }
  .track input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 26px; border-radius: 7px;
    background: #fff; border: 2px solid #0b1424; box-shadow: 0 0 0 1px rgba(255,255,255,.5), 0 2px 8px rgba(0,0,0,.5); }
  .track input[type=range]::-moz-range-thumb { width: 12px; height: 24px; border-radius: 7px; background: #fff; border: 2px solid #0b1424; }
  #hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); color: rgba(255,255,255,.55); font-size: 12px;
    pointer-events: none; transition: opacity 1s; text-shadow: 0 1px 3px #000; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 15px; }
  @media (max-width: 720px) {
    #info { min-width: 0; width: calc(50% - 18px); font-size: 11px; padding: 8px; }
    #info h1 { font-size: 12px; }
    #moonIcon { display: none; }
    #settings { width: calc(50% - 18px); font-size: 11px; padding: 8px; max-height: calc(100% - 260px); }
    #clock { font-size: 18px; min-width: 80px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">拖曳旋轉視角 · 滾輪縮放 · 空白鍵播放/暫停</div>

<div id="info" class="panel">
  <svg id="moonIcon" viewBox="-1 -1 2 2"><circle r="1" fill="#1d2433"/><path id="moonPath" fill="#f3efe2"/></svg>
  <h1>天文資訊</h1>
  <div class="row">太陽高度 <b id="sunAlt">–</b></div>
  <div class="row">太陽方位 <b id="sunAz">–</b></div>
  <div class="row">日出 / 日落 <b id="sunRS">–</b></div>
  <div class="sep"></div>
  <div class="row">月相 <b id="moonPhase">–</b></div>
  <div class="row">照亮比例 <b id="moonIllum">–</b></div>
  <div class="row">月齡 <b id="moonAge">–</b></div>
  <div class="row">月球高度 <b id="moonAlt">–</b></div>
  <div class="row">月球方位 <b id="moonAz">–</b></div>
  <div class="row">月出 / 月落 <b id="moonRS">–</b></div>
  <div class="sep"></div>
  <div class="row">天空狀態 <b id="skyState">–</b></div>
  <div class="row">地方恆星時 <b id="lst">–</b></div>
</div>

<div id="settings" class="panel">
  <details open>
    <summary>設定</summary>
    <div class="field">
      <label>地點</label>
      <select id="preset" style="width:100%"></select>
    </div>
    <div class="field grid2">
      <div><label>緯度</label><input id="lat" type="number" step="0.01" min="-89.9" max="89.9"></div>
      <div><label>經度</label><input id="lon" type="number" step="0.01" min="-180" max="180"></div>
    </div>
    <div class="field">
      <label>時區 (UTC±) <span id="tzv"></span></label>
      <input id="tz" type="range" min="-12" max="14" step="0.5">
    </div>
    <div class="field">
      <label>浪高 <span id="ampv"></span></label>
      <input id="amp" type="range" min="0.1" max="3" step="0.05" value="0.7">
    </div>
    <div class="field">
      <label>浪尖銳度 <span id="chopv"></span></label>
      <input id="chop" type="range" min="1" max="4" step="0.1" value="2.2">
    </div>
    <div class="field">
      <label>風向 <span id="windv"></span></label>
      <input id="wind" type="range" min="0" max="359" step="1" value="200">
    </div>
    <div class="field">
      <label>視角高度 <span id="camhv"></span></label>
      <input id="camh" type="range" min="1.5" max="60" step="0.5" value="4">
    </div>
    <div class="field">
      <label>視野 (FOV) <span id="fovv"></span></label>
      <input id="fov" type="range" min="4" max="100" step="1" value="62">
    </div>
    <div class="field">
      <label>日月顯示大小 <span id="diskv"></span></label>
      <input id="disk" type="range" min="1" max="6" step="0.1" value="1">
    </div>
    <div class="field">
      <label>畫質</label>
      <select id="quality" style="width:100%">
        <option value="1">高</option>
        <option value="0.75" selected>中</option>
        <option value="0.5">低</option>
      </select>
    </div>
    <div class="field grid2">
      <button id="lookSun">看太陽</button>
      <button id="lookMoon">看月亮</button>
    </div>
  </details>
</div>

<div id="timebar" class="panel">
  <div class="top">
    <div id="clock">--:--</div>
    <div id="tzlabel"></div>
    <input id="date" type="date">
    <button id="dayPrev" title="前一天">◀ 日</button>
    <button id="dayNext" title="後一天">日 ▶</button>
    <div class="spacer"></div>
    <button id="play" title="播放 / 暫停 (空白鍵)">▶ 播放</button>
    <select id="speed" title="時間流速">
      <option value="1">1× 真實時間</option>
      <option value="60">60× (1 秒 = 1 分)</option>
      <option value="600" selected>600× (1 秒 = 10 分)</option>
      <option value="3600">3600× (1 秒 = 1 時)</option>
      <option value="21600">21600× (1 秒 = 6 時)</option>
      <option value="86400">86400× (1 秒 = 1 天)</option>
    </select>
    <button id="now">現在</button>
  </div>
  <div class="slider-wrap">
    <div class="cap"><span>時間控制桿</span><span id="timeCap"></span></div>
    <div class="track">
      <div class="grad" id="timeGrad"></div>
      <div class="marks" id="timeMarks"></div>
      <input id="time" type="range" min="0" max="1439" step="1" value="720" aria-label="時間控制桿">
    </div>
  </div>
  <div class="slider-wrap">
    <div class="cap"><span>日期控制桿（一年）</span><span id="dateCap"></span></div>
    <div class="track">
      <div class="grad" id="dateGrad"></div>
      <div class="marks" id="dateMarks"></div>
      <input id="doy" type="range" min="0" max="364" step="1" value="0" aria-label="日期控制桿">
    </div>
  </div>
</div>

<div id="err" class="panel"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════
//  Photometric scale (shared by CPU + GPU). Units are arbitrary but every
//  light source keeps its real ratio to the Sun.
// ════════════════════════════════════════════════════════════════════════
const E_SUN = 20.0;                        // solar irradiance
const OMEGA_DISK = 6.8e-5;                 // solid angle of sun / moon disk (sr)
const SUN_RAD = E_SUN / OMEGA_DISK;        // radiance of the solar disk
const MOON_RATIO = 2.5e-6;                 // full moon / sun illuminance (≈ 14 mag)
const MOON_FULL_RAD = SUN_RAD * MOON_RATIO;
const NIGHT_BASE = 6e-8;                   // airglow + unresolved starlight
const MILKY_RAD = 2.4e-7;

// ════════════════════════════════════════════════════════════════════════
//  Astronomy (low-precision analytical theories; ~0.01° sun, ~0.3° moon)
//  World frame: +x east, +y up, +z south.
// ════════════════════════════════════════════════════════════════════════
const RAD = Math.PI / 180, DEG = 180 / Math.PI;
const OBLIQ = 23.4397 * RAD;
const daysJ2000 = ms => ms / 86400000 + 2440587.5 - 2451545.0;

function sunEcl(d) {
  const M = RAD * (357.5291 + 0.98560028 * d);
  const C = RAD * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  return { lon: M + C + RAD * 102.9372 + Math.PI, lat: 0, dist: 1.496e8 };
}
function moonEcl(d) {
  const L = RAD * (218.316 + 13.176396 * d);
  const M = RAD * (134.963 + 13.064993 * d);
  const F = RAD * (93.272 + 13.229350 * d);
  const D = RAD * (297.850 + 12.190749 * d);
  const Ms = RAD * (357.529 + 0.98560028 * d);
  const lon = L + RAD * (6.289 * Math.sin(M) + 1.274 * Math.sin(2 * D - M) + 0.658 * Math.sin(2 * D)
    + 0.214 * Math.sin(2 * M) - 0.186 * Math.sin(Ms) - 0.114 * Math.sin(2 * F));
  const lat = RAD * (5.128 * Math.sin(F) + 0.281 * Math.sin(M + F) + 0.278 * Math.sin(M - F) + 0.173 * Math.sin(2 * D - F));
  const dist = 385001 - 20905 * Math.cos(M) - 3699 * Math.cos(2 * D - M) - 2956 * Math.cos(2 * D);
  return { lon, lat, dist };
}
function eclToEq(lon, lat) {
  const ra = Math.atan2(Math.sin(lon) * Math.cos(OBLIQ) - Math.tan(lat) * Math.sin(OBLIQ), Math.cos(lon));
  const dec = Math.asin(Math.sin(lat) * Math.cos(OBLIQ) + Math.cos(lat) * Math.sin(OBLIQ) * Math.sin(lon));
  return { ra, dec };
}
const eqVec = (ra, dec) => [Math.cos(dec) * Math.cos(ra), Math.cos(dec) * Math.sin(ra), Math.sin(dec)];
const localSidereal = (d, lonDeg) => RAD * (280.16 + 360.9856235 * d) + lonDeg * RAD;

// equatorial (ra, dec) → world unit vector
function eqToWorld(ra, dec, lst, lat) {
  const H = lst - ra, cd = Math.cos(dec), sd = Math.sin(dec), cl = Math.cos(lat), sl = Math.sin(lat);
  const east = -cd * Math.sin(H);
  const north = cl * sd - sl * cd * Math.cos(H);
  const up = sl * sd + cl * cd * Math.cos(H);
  return [east, up, -north];
}
const altOf = v => Math.asin(Math.max(-1, Math.min(1, v[1])));
const azOf = v => { const a = Math.atan2(v[0], -v[2]); return a < 0 ? a + 2 * Math.PI : a; };
const fromAltAz = (alt, az) => [Math.sin(az) * Math.cos(alt), Math.sin(alt), -Math.cos(az) * Math.cos(alt)];
// Sæmundsson refraction, true → apparent altitude (degrees)
function refract(altDeg) {
  if (altDeg < -2) return altDeg;
  const h = Math.max(altDeg, -1.9);
  return altDeg + 1.02 / Math.tan(RAD * (h + 10.3 / (h + 5.11))) / 60;
}

function astro(ms, latDeg, lonDeg) {
  const d = daysJ2000(ms), lat = latDeg * RAD, lst = localSidereal(d, lonDeg);
  const se = sunEcl(d), me = moonEcl(d);
  const sq = eclToEq(se.lon, 0), mq = eclToEq(me.lon, me.lat);
  let sun = eqToWorld(sq.ra, sq.dec, lst, lat);
  let moon = eqToWorld(mq.ra, mq.dec, lst, lat);
  // topocentric lunar parallax, then refraction
  let mAlt = altOf(moon);
  mAlt -= Math.asin(6378.14 / me.dist * Math.cos(mAlt));
  const mAltApp = refract(mAlt * DEG) * RAD;
  moon = fromAltAz(mAltApp, azOf(moon));
  const sAltApp = refract(altOf(sun) * DEG) * RAD;
  sun = fromAltAz(sAltApp, azOf(sun));
  // phase
  const sv = eqVec(sq.ra, sq.dec), mv = eqVec(mq.ra, mq.dec);
  const cosElong = sv[0] * mv[0] + sv[1] * mv[1] + sv[2] * mv[2];
  const elongDeg = Math.acos(Math.max(-1, Math.min(1, cosElong))) * DEG;
  const illum = (1 - cosElong) / 2;
  let age = ((me.lon - se.lon) * DEG) % 360; if (age < 0) age += 360;
  const phaseAngle = 180 - elongDeg;
  const phaseLaw = Math.pow(10, -0.4 * (0.026 * phaseAngle + 4e-9 * Math.pow(phaseAngle, 4)));
  // equatorial → world matrix columns
  const m = [eqToWorld(0, 0, lst, lat), eqToWorld(Math.PI / 2, 0, lst, lat), eqToWorld(0, Math.PI / 2, lst, lat)];
  return { sun, moon, illum, age, elongDeg, phaseLaw, lst, eqMat: m, moonDist: me.dist };
}

// ════════════════════════════════════════════════════════════════════════
//  CPU copy of the atmosphere model (for exposure + direct-light colour)
// ════════════════════════════════════════════════════════════════════════
const RE = 6360e3, RA_ = 6420e3, HR = 8000, HM = 1200;
const BR = [5.802e-6, 13.558e-6, 33.1e-6], BM = 12e-6, BME = 13.3e-6, BO = [0.650e-6, 1.881e-6, 0.085e-6];
function rsi(o, d, r) {
  const b = o[0] * d[0] + o[1] * d[1] + o[2] * d[2];
  const c = o[0] * o[0] + o[1] * o[1] + o[2] * o[2] - r * r;
  let h = b * b - c; if (h < 0) return [1e9, -1e9]; h = Math.sqrt(h); return [-b - h, -b + h];
}
const hitsEarth = (p, d) => { const g = rsi(p, d, RE); return g[0] > 0 && g[0] < 1e8; };
function dens(h) { return [Math.exp(-h / HR), Math.exp(-h / HM), Math.max(0, 1 - Math.abs(h - 25e3) / 15e3)]; }
function extinct(od) { return [0, 1, 2].map(i => Math.exp(-(BR[i] * od[0] + BME * od[1] + BO[i] * od[2]))); }
function lightOD(p, L, n) {
  const t = rsi(p, L, RA_)[1], ds = t / n, od = [0, 0, 0];
  for (let j = 0; j < n; j++) {
    const s = ds * (j + 0.5), q = [p[0] + L[0] * s, p[1] + L[1] * s, p[2] + L[2] * s];
    const dd = dens(Math.hypot(q[0], q[1], q[2]) - RE); od[0] += dd[0]; od[1] += dd[1]; od[2] += dd[2];
  }
  return od.map(x => x * ds);
}
const EYE = [0, RE + 10, 0];
function transmittance(dir) {
  if (hitsEarth(EYE, dir)) return [0, 0, 0];
  return extinct(lightOD(EYE, dir, 24));
}
function phaseM(mu) { const g = 0.76, g2 = g * g; return 3 / (8 * Math.PI) * (1 - g2) * (1 + mu * mu) / ((2 + g2) * Math.pow(1 + g2 - 2 * g * mu, 1.5)); }
function phaseR(mu) { return 3 / (16 * Math.PI) * (1 + mu * mu); }
function skyRadiance(rd, lights) {
  let tmax = rsi(EYE, rd, RA_)[1];
  const g = rsi(EYE, rd, RE); if (g[0] > 0 && g[0] < 1e8) tmax = Math.min(tmax, g[0]);
  const N = 16, ds = tmax / N, od = [0, 0, 0];
  const acc = lights.map(() => ({ r: [0, 0, 0], m: [0, 0, 0] }));
  for (let i = 0; i < N; i++) {
    const s = ds * (i + 0.5), p = [EYE[0] + rd[0] * s, EYE[1] + rd[1] * s, EYE[2] + rd[2] * s];
    const dd = dens(Math.hypot(p[0], p[1], p[2]) - RE);
    od[0] += dd[0] * ds; od[1] += dd[1] * ds; od[2] += dd[2] * ds;
    lights.forEach((l, k) => {
      if (l.I <= 0 || hitsEarth(p, l.dir)) return;
      const lo = lightOD(p, l.dir, 6);
      const T = extinct([od[0] + lo[0], od[1] + lo[1], od[2] + lo[2]]);
      for (let c = 0; c < 3; c++) { acc[k].r[c] += dd[0] * T[c] * ds; acc[k].m[c] += dd[1] * T[c] * ds; }
    });
  }
  const out = [0, 0, 0];
  lights.forEach((l, k) => {
    const mu = rd[0] * l.dir[0] + rd[1] * l.dir[1] + rd[2] * l.dir[2];
    const pr = phaseR(mu), pm = phaseM(mu);
    for (let c = 0; c < 3; c++) out[c] += l.I * (BR[c] * pr * acc[k].r[c] + BM * pm * acc[k].m[c]);
  });
  return out;
}
const lum = c => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];

// ════════════════════════════════════════════════════════════════════════
//  Bright star catalogue (J2000): name, RA°, Dec°, V mag, B−V
// ════════════════════════════════════════════════════════════════════════
const STARS = [
  ['天狼星', 101.287, -16.716, -1.46, 0.00], ['老人星', 95.988, -52.696, -0.74, 0.15],
  ['大角星', 213.915, 19.182, -0.05, 1.23], ['南門二', 219.902, -60.834, -0.27, 0.71],
  ['織女星', 279.234, 38.784, 0.03, 0.00], ['五車二', 79.172, 45.998, 0.08, 0.80],
  ['參宿七', 78.634, -8.202, 0.13, -0.03], ['南河三', 114.825, 5.225, 0.34, 0.42],
  ['水委一', 24.429, -57.237, 0.46, -0.16], ['參宿四', 88.793, 7.407, 0.50, 1.85],
  ['馬腹一', 210.956, -60.373, 0.61, -0.23], ['牛郎星', 297.696, 8.868, 0.77, 0.22],
  ['十字架二', 186.650, -63.099, 0.77, -0.24], ['畢宿五', 68.980, 16.509, 0.85, 1.54],
  ['心宿二', 247.352, -26.432, 1.09, 1.83], ['角宿一', 201.298, -11.161, 1.04, -0.23],
  ['北河三', 116.329, 28.026, 1.14, 1.00], ['北落師門', 344.413, -29.622, 1.16, 0.09],
  ['天津四', 310.358, 45.280, 1.25, 0.09], ['十字架三', 191.930, -59.689, 1.25, -0.24],
  ['軒轅十四', 152.093, 11.967, 1.35, -0.11], ['弧矢七', 104.656, -28.972, 1.50, -0.21],
  ['北河二', 113.650, 31.888, 1.58, 0.03], ['尾宿八', 263.402, -37.104, 1.62, -0.22],

vec2 rsi(vec3 o, vec3 d, float r){ float b = dot(o,d); float c = dot(o,o) - r*r; float h = b*b - c;

vec3 extinct(vec3 od){ return exp(-(BR*od.x + BME*od.y + BO*od.z)); }

float traceSea(vec3 ro, vec3 rd){

  float t1 = min((-uMaxH - ro.y)/rd.y, 2500.0);
  if (t1 <= t0) return -1.0;
  float tp = t0;
  vec3 p = ro + rd*t0;
  float dp = p.y + curveDrop(p.xz) - seaH(p.xz, GEO);
  if (dp < 0.0) return t0;

    p = ro + rd*t;
    float d = p.y + curveDrop(p.xz) - seaH(p.xz, GEO);
    if (d < 0.0){
      float ta = tp, da = dp, tb = t, db = d;
      for (int j = 0; j < 6; j++){
        float tm = mix(ta, tb, da/(da - db));
        vec3 q = ro + rd*tm;

        if (dm < 0.0){ tb = tm; db = dm; } else { ta = tm; da = dm; }

  gl.uniform1f(su.uSunI, E_SUN); gl.uniform1f(su.uMoonI, moonI);
  gl.uniform1f(su.uExposure, exposure); gl.uniform1f(su.uOutScale, 1 / lutScale);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // pass 2: scene
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(mainProg.p);
  const mu = mainProg.u;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, lutTex); gl.uniform1i(mu.uSky, 0);
  gl.uniform1f(mu.uSkyScale, lutScale);
  gl.uniform2f(mu.uRes, canvas.width, canvas.height);
  gl.uniform1f(mu.uTime, wave);
  gl.uniform1f(mu.uTanHalf, tanHalf);
  gl.uniform1f(mu.uPix, 2 * tanHalf / canvas.height);
  gl.uniform3f(mu.uCamPos, 0, camY, 0);
  gl.uniform3fv(mu.uF, f); gl.uniform3fv(mu.uR, r); gl.uniform3fv(mu.uU, u);
  gl.uniform3fv(mu.uSunDir, A.sun); gl.uniform3fv(mu.uMoonDir, A.moon);
  gl.uniform3fv(mu.uSunRad, sunRad); gl.uniform3fv(mu.uMoonRad, moonRad);
  gl.uniform3fv(mu.uSunE, sunE); gl.uniform3fv(mu.uMoonE, moonE);
  gl.uniform1f(mu.uExposure, exposure); gl.uniform1f(mu.uDiskScale, S.disk);
  gl.uniform1f(mu.uEarthshine, 0.012 * (1 + Math.cos(A.elongDeg * RAD)) / 2);
  gl.uniform1f(mu.uNight, night);
  gl.uniformMatrix3fv(mu.uEq, false, new Float32Array([...A.eqMat[0], ...A.eqMat[1], ...A.eqMat[2]]));
  gl.uniform3fv(mu.uNGP, NGP); gl.uniform3fv(mu.uGC, GC);
  gl.uniform4fv(mu.uStarA, starA); gl.uniform3fv(mu.uStarC, starC);
  gl.uniform1f(mu.uAmp, S.amp); gl.uniform1f(mu.uChop, S.chop); gl.uniform1f(mu.uK0, k0); gl.uniform1f(mu.uMaxH, maxH);
  gl.uniform2fv(mu.uWind, wdir);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // UI (throttled)
  uiTimer -= dt;
  if (uiTimer <= 0 || dt === 0) {
    uiTimer = 0.1;
    updateDay();
    const mins = Math.floor((S.sim - localMidnight(S.sim)) / 60000);
    if (document.activeElement !== $('time')) $('time').value = mins;
    const doy = Math.floor((localMidnight(S.sim) - yearStart(S.sim)) / 86400000 + 0.5);
    if (document.activeElement !== $('doy')) $('doy').value = doy;
    $('clock').textContent = fmtHM(S.sim);
    if (document.activeElement !== $('date')) $('date').value = fmtDate(S.sim);
    $('timeCap').textContent = fmtHM(S.sim);
    $('dateCap').textContent = `${fmtDate(S.sim)}（第 ${doy + 1} 天）`;
    const sa = altOf(A.sun), ma = altOf(A.moon);
    $('sunAlt').textContent = fmtDeg(sa); $('sunAz').textContent = fmtDeg(azOf(A.sun)) + ' ' + compass(azOf(A.sun));
    $('moonAlt').textContent = fmtDeg(ma); $('moonAz').textContent = fmtDeg(azOf(A.moon)) + ' ' + compass(azOf(A.moon));
    $('moonPhase').textContent = PHASE_NAMES.find(p => A.age < p[0])[1];
    $('moonIllum').textContent = (A.illum * 100).toFixed(1) + '%';
    $('moonAge').textContent = (A.age / 360 * 29.53).toFixed(1) + ' 天';
    $('moonPath').setAttribute('d', moonIconPath(A.illum, A.age < 180));
    const sd = sa * DEG;
    $('skyState').textContent = sd > 6 ? '白天' : sd > -0.83 ? '黃金時刻' : sd > -6 ? '民用曙暮光' : sd > -12 ? '航海曙暮光' : sd > -18 ? '天文曙暮光' : '黑夜';
    let lst = (A.lst * DEG / 15) % 24; if (lst < 0) lst += 24;
    $('lst').textContent = pad(Math.floor(lst)) + ':' + pad(Math.floor((lst % 1) * 60));
  }
}

// test hook: set a scene and render one frame synchronously
window.__scene = (o) => { const look = o.look; delete o.look; Object.assign(S, o);
  if (look) lookAt(astro(S.sim, S.lat, S.lon)[look]); S.logExp = null; syncInputs(); render(0); };

// start: look toward whichever of sun/moon is up
syncInputs(); resize();
{
  const A = astro(S.sim, S.lat, S.lon);
  if (altOf(A.sun) > -0.05) lookAt(A.sun); else if (altOf(A.moon) > 0) lookAt(A.moon); else S.camAz = 90 * RAD;
  S.camEl = Math.min(Math.max(S.camEl * 0.6, 0.03), 0.6);
}
window.READY = true;
requestAnimationFrame(frame);
</script>
</body>
</html>
